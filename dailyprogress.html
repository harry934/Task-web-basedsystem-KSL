<section class="page-shell">
  <div class="page-header">
    <h1>Daily Progress</h1>
    <p>Generate calculated daily snapshots for active employees and record supervisor remarks.</p>
  </div>
  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="generateDailyButton" class="btn btn-primary" type="button">Generate Today</button>
        <button id="exportDailyButton" class="btn btn-outline" type="button">Export</button>
        <button id="exportDailyPdfButton" class="btn btn-outline" type="button">Export PDF</button>
        <button id="refreshDailyButton" class="btn btn-outline" type="button">Refresh</button>
      </div>
      <div class="toolbar-right">
        <input id="dailyDateInput" class="input" type="date">
        <input id="dailyDepartmentFilter" class="input" type="search" placeholder="Department" style="min-width: 150px;">
        <input id="dailySupervisorFilter" class="input" type="search" placeholder="Supervisor" style="min-width: 150px;">
        <input id="dailySearchInput" class="input" type="search" placeholder="Search..." style="min-width: 180px;">
      </div>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Employee</th>
          <th>Department</th>
          <th>Assigned</th>
          <th>Completed</th>
          <th>Overdue</th>
          <th>Hours</th>
          <th>Score</th>
          <th>Remarks</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="dailyTableBody"><tr><td colspan="10" class="empty-state">Loading...</td></tr></tbody>
    </table>
  </div>
  <div id="dailyPagination" class="pagination"></div>
</section>
<script>
  (function () {
    var state = { items: [], page: 1, pages: 1, pageSize: 25 };
    function filters() {
      return {
        date: document.getElementById('dailyDateInput').value,
        department: document.getElementById('dailyDepartmentFilter').value.trim(),
        supervisor: document.getElementById('dailySupervisorFilter').value.trim(),
        query: document.getElementById('dailySearchInput').value.trim(),
        page: state.page,
        pageSize: state.pageSize
      };
    }
    function load() {
      KSL.call('listDailyProgress', KSL.getSessionToken(), filters()).then(function (response) {
        if (!response || !response.success) throw new Error((response && response.message) || 'Failed to load daily progress.');
        var payload = response.data || {};
        state.items = payload.items || [];
        state.page = Number((payload.pagination || {}).page || 1);
        state.pages = Number((payload.pagination || {}).pages || 1);
        var body = document.getElementById('dailyTableBody');
        if (!state.items.length) {
          body.innerHTML = '<tr><td colspan="10" class="empty-state">No matching data found.</td></tr>';
        } else {
          body.innerHTML = state.items.map(function (item) {
            return '<tr><td>' + KSL.escapeHtml(item.date) + '</td><td>' + KSL.escapeHtml(item.employeeName) +
              '</td><td>' + KSL.escapeHtml(item.department || '-') + '</td><td>' + item.assigned +
              '</td><td>' + item.completed + '</td><td>' + item.overdue + '</td><td>' + item.hours +
              '</td><td>' + item.performanceScore + '</td><td>' + KSL.escapeHtml(item.remarks || '-') +
              '</td><td><button class="btn btn-outline" type="button" data-id="' + KSL.escapeHtml(item.recordId) +
              '">Review</button></td></tr>';
          }).join('');
        }
        KSL.renderPager('dailyPagination', state, load);
      }).catch(function (error) { KSL.showToast(error.message || 'Failed to load daily progress.', 'error'); });
    }
    function exportFile(format) {
      var options = filters();
      options.format = format;
      KSL.callBusy('exportDailyProgress', KSL.getSessionToken(), options).then(function (response) {
        if (!response || !response.success) throw new Error((response && response.message) || 'Export failed.');
        KSL.downloadFile(response.data);
        KSL.showToast('Report generated.', 'success');
      }).catch(function (error) { KSL.showToast(error.message || 'Export failed.', 'error'); });
    }
    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager', 'Supervisor'], function () {
        document.getElementById('dailyDateInput').value = new Date().toISOString().slice(0, 10);
        document.getElementById('generateDailyButton').addEventListener('click', function () {
          KSL.callBusy('generateDailyProgress', KSL.getSessionToken(), { date: document.getElementById('dailyDateInput').value })
            .then(function (response) {
              if (!response || !response.success) throw new Error((response && response.message) || 'Generate failed.');
              KSL.showToast(response.message || 'Daily progress generated.', 'success');
              load();
            }).catch(function (error) { KSL.showToast(error.message || 'Generate failed.', 'error'); });
        });
        document.getElementById('exportDailyButton').addEventListener('click', function () { exportFile('csv'); });
        document.getElementById('exportDailyPdfButton').addEventListener('click', function () { exportFile('pdf'); });
        document.getElementById('refreshDailyButton').addEventListener('click', load);
        ['dailyDateInput', 'dailyDepartmentFilter', 'dailySupervisorFilter', 'dailySearchInput'].forEach(function (id) {
          document.getElementById(id).addEventListener(id === 'dailyDateInput' ? 'change' : 'input', KSL.debounce(function () {
            state.page = 1;
            load();
          }, 350));
        });
        document.getElementById('dailyTableBody').addEventListener('click', function (event) {
          var button = event.target.closest('button[data-id]');
          if (!button) return;
          var remarks = window.prompt('Supervisor remarks:', '') || '';
          KSL.call('reviewDailyProgress', KSL.getSessionToken(), { recordId: button.dataset.id, remarks: remarks })
            .then(function (response) {
              if (!response || !response.success) throw new Error((response && response.message) || 'Review failed.');
              KSL.showToast('Review saved.', 'success');
              load();
            }).catch(function (error) { KSL.showToast(error.message || 'Review failed.', 'error'); });
        });
        load();
      });
    });
  })();
</script>
