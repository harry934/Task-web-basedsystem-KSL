<section class="page-shell">
  <div class="page-header">
    <h1>Progress Updates</h1>
    <p>Review employee progress submissions. Updates are kept as history and are not overwritten.</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="progressRefreshButton" class="btn btn-primary" type="button">Refresh</button>
      </div>
      <div class="toolbar-right">
        <input id="progressSearchInput" class="input" type="search" placeholder="Search..." style="min-width: 220px;">
        <select id="progressReviewFilter" class="select" style="min-width: 150px;">
          <option value="">All reviews</option>
          <option value="Pending">Pending</option>
          <option value="Approved">Approved</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Update</th>
          <th>Task</th>
          <th>Employee</th>
          <th>Progress</th>
          <th>Status</th>
          <th>Review</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="progressTableBody">
        <tr><td colspan="8" class="empty-state">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</section>

<script>
  (function () {
    function loadProgress() {
      KSL.call('listProgressUpdates', KSL.getSessionToken(), {
        query: document.getElementById('progressSearchInput').value.trim(),
        review: document.getElementById('progressReviewFilter').value,
        page: 1,
        pageSize: 25
      })
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load progress.');
          }
          var items = (response.data && response.data.items) || [];
          var body = document.getElementById('progressTableBody');
          if (!items.length) {
            body.innerHTML = '<tr><td colspan="8" class="empty-state">No progress updates yet.</td></tr>';
            return;
          }
          body.innerHTML = items
            .map(function (item) {
              var actions = '';
              if ((item.supervisorReview || '').toLowerCase() === 'pending') {
                actions =
                  '<button class="btn btn-secondary" type="button" data-decision="Approved" data-id="' +
                  KSL.escapeHtml(item.updateId) +
                  '">Approve</button>' +
                  '<button class="btn btn-danger" type="button" data-decision="Rejected" data-id="' +
                  KSL.escapeHtml(item.updateId) +
                  '">Reject</button>';
              }
              return (
                '<tr><td>' +
                KSL.escapeHtml(item.updateId) +
                '</td><td>' +
                KSL.escapeHtml(item.taskId) +
                '</td><td>' +
                KSL.escapeHtml(item.employeeName) +
                '</td><td>' +
                KSL.escapeHtml(String(item.previousProgress) + '% → ' + String(item.progress) + '%') +
                '</td><td>' +
                KSL.escapeHtml(item.status) +
                '</td><td><span class="status-badge ' +
                KSL.statusClass(item.supervisorReview) +
                '">' +
                KSL.escapeHtml(item.supervisorReview) +
                '</span></td><td>' +
                KSL.escapeHtml(KSL.formatDate(item.updateDate) || '-') +
                '</td><td><div class="toolbar-left">' +
                actions +
                '</div></td></tr>'
              );
            })
            .join('');
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Failed to load progress.', 'error');
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager', 'Supervisor', 'Team Leader', 'Employee'], function () {
        document.getElementById('progressRefreshButton').addEventListener('click', loadProgress);
        document.getElementById('progressSearchInput').addEventListener('input', KSL.debounce(loadProgress, 400));
        document.getElementById('progressReviewFilter').addEventListener('change', loadProgress);
        document.getElementById('progressTableBody').addEventListener('click', function (event) {
          var button = event.target.closest('button[data-decision]');
          if (!button) {
            return;
          }
          var comment = window.prompt('Review comment (optional):', '') || '';
          KSL.call('reviewProgressUpdate', KSL.getSessionToken(), {
            updateId: button.dataset.id,
            decision: button.dataset.decision,
            comment: comment
          })
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Review failed.');
              }
              KSL.showToast('Review saved.', 'success');
              loadProgress();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Review failed.', 'error');
            });
        });
        loadProgress();
      });
    });
  })();
</script>
