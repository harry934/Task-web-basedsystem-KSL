<section class="page-shell">
  <div class="page-header">
    <h1>My Tasks</h1>
    <p>Accept assignments and submit progress on your work.</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="myTasksNewUpdateButton" class="btn btn-outline" type="button">New update</button>
        <button id="myTasksOverdueButton" class="btn btn-outline" type="button">My overdue</button>
        <button id="myTasksDueSoonButton" class="btn btn-outline" type="button">Due soon</button>
        <button id="myTasksRefreshButton" class="btn btn-primary" type="button">Refresh</button>
      </div>
      <div class="toolbar-right">
        <input id="myTasksSearchInput" class="input" type="search" placeholder="Search my tasks..." style="min-width: 240px;">
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Title</th>
          <th>Acceptance</th>
          <th>Status</th>
          <th>Progress</th>
          <th>Due</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="myTasksTableBody">
        <tr><td colspan="7" class="empty-state">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  <div id="myTasksPagination" class="pagination"></div>
</section>

<div id="progressModalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>Submit progress</h3>
      <button class="btn btn-outline" type="button" data-close-modal="progressModalBackdrop">Close</button>
    </div>
    <form id="myProgressForm">
      <input id="myAssignmentId" type="hidden">
      <div class="form-grid">
        <div class="field full">
          <label for="myAssignmentSelect">Assignment</label>
          <select id="myAssignmentSelect" class="select" required></select>
        </div>
        <div class="field">
          <label for="myProgressInput">Progress %</label>
          <input id="myProgressInput" class="input" type="number" min="0" max="100" required>
        </div>
        <div class="field">
          <label for="myStatusInput">Status</label>
          <select id="myStatusInput" class="select">
            <option value="In Progress">In Progress</option>
            <option value="Blocked">Blocked</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div class="field">
          <label for="myHoursInput">Hours worked</label>
          <input id="myHoursInput" class="input" type="number" min="0" step="0.25" value="0">
        </div>
        <div class="field full">
          <label for="myWorkCompletedInput">Work completed</label>
          <textarea id="myWorkCompletedInput" class="textarea"></textarea>
        </div>
        <div class="field full">
          <label for="myBlockersInput">Blockers</label>
          <textarea id="myBlockersInput" class="textarea"></textarea>
        </div>
        <div class="field full">
          <label for="myRemarksInput">Remarks</label>
          <textarea id="myRemarksInput" class="textarea"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" type="button" data-close-modal="progressModalBackdrop">Cancel</button>
        <button class="btn btn-primary" type="submit">Submit update</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    var state = { items: [], page: 1, pages: 1, pageSize: 25, view: 'all' };

    function getFilters() {
      return {
        query: document.getElementById('myTasksSearchInput').value.trim(),
        page: state.page,
        pageSize: state.pageSize,
        view: state.view
      };
    }

    function renderRows() {
      var body = document.getElementById('myTasksTableBody');
      if (!state.items.length) {
        body.innerHTML = '<tr><td colspan="7" class="empty-state">No assigned tasks yet.</td></tr>';
        return;
      }
      body.innerHTML = state.items
        .map(function (item) {
          var actions = '';
          if ((item.employeeAcceptance || '').toLowerCase() === 'pending') {
            actions +=
              '<button class="btn btn-secondary" type="button" data-action="accept" data-id="' +
              KSL.escapeHtml(item.assignmentId) +
              '">Accept</button>' +
              '<button class="btn btn-danger" type="button" data-action="reject" data-id="' +
              KSL.escapeHtml(item.assignmentId) +
              '">Reject</button>';
          }
          actions +=
            '<button class="btn btn-outline" type="button" data-action="progress" data-id="' +
            KSL.escapeHtml(item.assignmentId) +
            '">Update</button>';
          return (
            '<tr><td>' +
            KSL.escapeHtml(item.taskId) +
            '</td><td>' +
            KSL.escapeHtml(item.taskTitle || '-') +
            '</td><td>' +
            KSL.escapeHtml(item.employeeAcceptance) +
            '</td><td>' +
            KSL.escapeHtml(item.employeeStatus) +
            '</td><td>' +
            KSL.escapeHtml(String(item.employeeProgress || 0) + '%') +
            '</td><td>' +
            KSL.escapeHtml(KSL.formatDate(item.dueDate) || '-') +
            '</td><td><div class="toolbar-left">' +
            actions +
            '</div></td></tr>'
          );
        })
        .join('');
    }

    function renderPagination() {
      var pagination = document.getElementById('myTasksPagination');
      pagination.innerHTML =
        '<button type="button" id="myTasksPrevPage" ' +
        (state.page <= 1 ? 'disabled' : '') +
        '>Previous</button>' +
        '<button type="button" disabled>Page ' +
        state.page +
        ' of ' +
        state.pages +
        '</button>' +
        '<button type="button" id="myTasksNextPage" ' +
        (state.page >= state.pages ? 'disabled' : '') +
        '>Next</button>';
      var prev = document.getElementById('myTasksPrevPage');
      var next = document.getElementById('myTasksNextPage');
      if (prev) {
        prev.addEventListener('click', function () {
          state.page -= 1;
          loadMyTasks();
        });
      }
      if (next) {
        next.addEventListener('click', function () {
          state.page += 1;
          loadMyTasks();
        });
      }
    }

    function populateAssignmentSelect(preferredAssignmentId) {
      var select = document.getElementById('myAssignmentSelect');
      if (!state.items.length) {
        select.innerHTML = '<option value="">No assignments available</option>';
        document.getElementById('myAssignmentId').value = '';
        return;
      }
      select.innerHTML = state.items
        .map(function (item) {
          return (
            '<option value="' +
            KSL.escapeHtml(item.assignmentId) +
            '">' +
            KSL.escapeHtml(item.taskId + ' - ' + (item.taskTitle || 'Task')) +
            '</option>'
          );
        })
        .join('');
      if (preferredAssignmentId) {
        select.value = preferredAssignmentId;
      }
      if (!select.value) {
        select.value = state.items[0].assignmentId;
      }
      document.getElementById('myAssignmentId').value = select.value;
    }

    function openProgressModal(assignmentId) {
      if (!state.items.length) {
        KSL.showToast('No assignment available for update.', 'error');
        return;
      }
      document.getElementById('myProgressForm').reset();
      populateAssignmentSelect(assignmentId);
      document.getElementById('myHoursInput').value = 0;
      KSL.openModal('progressModalBackdrop');
    }

    function loadMyTasks() {
      KSL.call('listMyTasks', KSL.getSessionToken(), getFilters())
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load my tasks.');
          }
          var payload = response.data || {};
          state.items = payload.items || [];
          state.page = Number((payload.pagination || {}).page || 1);
          state.pages = Number((payload.pagination || {}).pages || 1);
          renderRows();
          renderPagination();
          populateAssignmentSelect();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Failed to load my tasks.', 'error');
        });
    }

    function applyView(viewName) {
      state.view = viewName;
      state.page = 1;
      loadMyTasks();
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager', 'Supervisor', 'Team Leader', 'Employee'], function () {
        document.getElementById('myTasksNewUpdateButton').addEventListener('click', function () {
          openProgressModal('');
        });
        document.getElementById('myTasksOverdueButton').addEventListener('click', function () {
          applyView('overdue');
        });
        document.getElementById('myTasksDueSoonButton').addEventListener('click', function () {
          applyView('duesoon');
        });
        document.getElementById('myTasksRefreshButton').addEventListener('click', function () {
          applyView('all');
        });
        document.getElementById('myTasksSearchInput').addEventListener(
          'input',
          KSL.debounce(function () {
            state.page = 1;
            loadMyTasks();
          }, 400)
        );
        document.getElementById('myTasksTableBody').addEventListener('click', function (event) {
          var button = event.target.closest('button[data-action]');
          if (!button) {
            return;
          }
          var id = button.dataset.id || '';
          if (button.dataset.action === 'progress') {
            openProgressModal(id);
            return;
          }
          KSL.call('respondToAssignment', KSL.getSessionToken(), {
            assignmentId: id,
            decision: button.dataset.action === 'accept' ? 'Accepted' : 'Rejected'
          })
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Update failed.');
              }
              KSL.showToast('Response saved.', 'success');
              state.page = 1;
              loadMyTasks();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Update failed.', 'error');
            });
        });
        document.getElementById('myAssignmentSelect').addEventListener('change', function () {
          document.getElementById('myAssignmentId').value =
            document.getElementById('myAssignmentSelect').value;
        });
        document.getElementById('myProgressForm').addEventListener('submit', function (event) {
          event.preventDefault();
          var assignmentId = document.getElementById('myAssignmentSelect').value;
          if (!assignmentId) {
            KSL.showToast('Select an assignment first.', 'error');
            return;
          }
          KSL.call('submitMyProgress', KSL.getSessionToken(), {
            assignmentId: assignmentId,
            progress: Number(document.getElementById('myProgressInput').value || 0),
            status: document.getElementById('myStatusInput').value,
            hoursWorked: Number(document.getElementById('myHoursInput').value || 0),
            workCompleted: document.getElementById('myWorkCompletedInput').value,
            blockers: document.getElementById('myBlockersInput').value,
            remarks: document.getElementById('myRemarksInput').value
          })
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Submit failed.');
              }
              KSL.showToast('Progress submitted.', 'success');
              KSL.closeModal('progressModalBackdrop');
              state.page = 1;
              loadMyTasks();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Submit failed.', 'error');
            });
        });
        loadMyTasks();
      });
    });
  })();
</script>
