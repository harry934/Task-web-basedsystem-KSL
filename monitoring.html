<section class="page-shell">
  <div class="page-header">
    <h1>Task Monitoring</h1>
    <p>Overdue, due soon, blocked, and in-progress work across your scope.</p>
  </div>

  <div id="monitoringSummary" class="kpi-grid"></div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn btn-outline monitor-view" type="button" data-view="all">All</button>
        <button class="btn btn-outline monitor-view" type="button" data-view="overdue">Overdue</button>
        <button class="btn btn-outline monitor-view" type="button" data-view="duesoon">Due soon</button>
        <button class="btn btn-outline monitor-view" type="button" data-view="blocked">Blocked</button>
        <button class="btn btn-outline monitor-view" type="button" data-view="inprogress">In progress</button>
        <button id="monitoringRefreshButton" class="btn btn-primary" type="button">Refresh</button>
      </div>
      <div class="toolbar-right">
        <input id="monitoringSearchInput" class="input" type="search" placeholder="Search..." style="min-width: 180px;">
        <input id="monitoringDepartmentFilter" class="input" type="search" placeholder="Department" style="min-width: 140px;">
        <input id="monitoringTeamFilter" class="input" type="search" placeholder="Team" style="min-width: 130px;">
        <input id="monitoringAssigneeFilter" class="input" type="search" placeholder="Assignee" style="min-width: 140px;">
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Task ID</th>
          <th>Title</th>
          <th>Department</th>
          <th>Assignee</th>
          <th>Status</th>
          <th>Flag</th>
          <th>Due</th>
          <th>Progress</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="monitoringTableBody">
        <tr><td colspan="9" class="empty-state">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  <div id="monitoringPagination" class="pagination"></div>
</section>

<div id="monitoringDetailBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="monitoringDetailTitle">Task detail</h3>
      <button class="btn btn-outline" type="button" data-close-modal="monitoringDetailBackdrop">Close</button>
    </div>
    <div id="monitoringDetailBody"></div>
  </div>
</div>

<script>
  (function () {
    var state = { view: 'all', page: 1, pages: 1, pageSize: 25 };

    function renderPagination() {
      var pagination = document.getElementById('monitoringPagination');
      pagination.innerHTML =
        '<button type="button" id="monitoringPrevPage" ' +
        (state.page <= 1 ? 'disabled' : '') +
        '>Previous</button>' +
        '<button type="button" disabled>Page ' +
        state.page +
        ' of ' +
        state.pages +
        '</button>' +
        '<button type="button" id="monitoringNextPage" ' +
        (state.page >= state.pages ? 'disabled' : '') +
        '>Next</button>';
      var prev = document.getElementById('monitoringPrevPage');
      var next = document.getElementById('monitoringNextPage');
      if (prev) {
        prev.addEventListener('click', function () {
          state.page -= 1;
          loadMonitoring();
        });
      }
      if (next) {
        next.addEventListener('click', function () {
          state.page += 1;
          loadMonitoring();
        });
      }
    }

    function loadMonitoring() {
      KSL.call('listMonitoredTasks', KSL.getSessionToken(), {
        view: state.view,
        query: document.getElementById('monitoringSearchInput').value.trim(),
        department: document.getElementById('monitoringDepartmentFilter').value.trim(),
        team: document.getElementById('monitoringTeamFilter').value.trim(),
        assignee: document.getElementById('monitoringAssigneeFilter').value.trim(),
        page: state.page,
        pageSize: state.pageSize
      })
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load monitoring.');
          }
          var payload = response.data || {};
          state.page = Number((payload.pagination || {}).page || 1);
          state.pages = Number((payload.pagination || {}).pages || 1);
          var summary = payload.summary || {};
          document.getElementById('monitoringSummary').innerHTML = [
            { key: 'overdue', label: 'Overdue' },
            { key: 'duesoon', label: 'Due soon' },
            { key: 'blocked', label: 'Blocked' },
            { key: 'inprogress', label: 'In progress' }
          ]
            .map(function (item) {
              return (
                '<div class="card kpi-card"><h3>' +
                item.label +
                '</h3><strong>' +
                Number(summary[item.key] || 0) +
                '</strong></div>'
              );
            })
            .join('');

          var items = payload.items || [];
          var body = document.getElementById('monitoringTableBody');
          if (!items.length) {
            body.innerHTML = '<tr><td colspan="9" class="empty-state">No matching tasks.</td></tr>';
            renderPagination();
            return;
          }
          body.innerHTML = items
            .map(function (item) {
              return (
                '<tr><td>' +
                KSL.escapeHtml(item.taskId) +
                '</td><td>' +
                KSL.escapeHtml(item.taskTitle) +
                '</td><td>' +
                KSL.escapeHtml(item.department || '-') +
                '</td><td>' +
                KSL.escapeHtml(item.primaryAssigneeName || '-') +
                '</td><td>' +
                KSL.escapeHtml(item.status) +
                '</td><td><span class="status-badge ' +
                KSL.statusClass(item.monitorFlag) +
                '">' +
                KSL.escapeHtml(item.monitorFlag) +
                '</span></td><td>' +
                KSL.escapeHtml(KSL.formatDate(item.dueDate) || '-') +
                '</td><td>' +
                KSL.escapeHtml(String(item.progress || 0) + '%') +
                '</td><td><button class="btn btn-outline" type="button" data-action="detail" data-id="' +
                KSL.escapeHtml(item.taskId) +
                '">Open</button></td></tr>'
              );
            })
            .join('');
          renderPagination();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Failed to load monitoring.', 'error');
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager', 'Supervisor', 'Team Leader'], function () {
        document.querySelectorAll('.monitor-view').forEach(function (button) {
          button.addEventListener('click', function () {
            state.view = button.dataset.view || 'all';
            state.page = 1;
            loadMonitoring();
          });
        });
        document.getElementById('monitoringRefreshButton').addEventListener('click', function () {
          state.page = 1;
          loadMonitoring();
        });
        ['monitoringSearchInput', 'monitoringDepartmentFilter', 'monitoringTeamFilter', 'monitoringAssigneeFilter'].forEach(function (id) {
          document.getElementById(id).addEventListener(
            'input',
            KSL.debounce(function () {
              state.page = 1;
              loadMonitoring();
            }, 400)
          );
        });
        document.getElementById('monitoringTableBody').addEventListener('click', function (event) {
          var button = event.target.closest('button[data-action="detail"]');
          if (!button) {
            return;
          }
          KSL.call('getMonitoredTaskDetail', KSL.getSessionToken(), { taskId: button.dataset.id })
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Unable to load task detail.');
              }
              var data = response.data || {};
              var task = data.task || {};
              document.getElementById('monitoringDetailTitle').textContent =
                (task.taskId || button.dataset.id) + ' — ' + (task.taskTitle || 'Task');
              document.getElementById('monitoringDetailBody').innerHTML =
                '<p>' +
                KSL.escapeHtml(task.taskDescription || 'No description.') +
                '</p>' +
                '<p class="page-note">Status: ' +
                KSL.escapeHtml(task.status || '-') +
                ' · Progress: ' +
                KSL.escapeHtml(String(task.progress || 0)) +
                '% · Assignee: ' +
                KSL.escapeHtml(task.primaryAssigneeName || '-') +
                '</p>' +
                '<strong>Assignments</strong><ul class="collab-list">' +
                ((data.assignments || [])
                  .map(function (item) {
                    return (
                      '<li>' +
                      KSL.escapeHtml(item.employeeName || item.employeeId) +
                      ' · ' +
                      KSL.escapeHtml(item.assignmentStatus || '') +
                      ' · ' +
                      KSL.escapeHtml(String(item.employeeProgress || 0) + '%') +
                      '</li>'
                    );
                  })
                  .join('') || '<li>None</li>') +
                '</ul><strong>Comments</strong><ul class="collab-list">' +
                ((data.comments || [])
                  .map(function (item) {
                    return (
                      '<li>' +
                      KSL.escapeHtml(item.employeeName || 'User') +
                      ': ' +
                      KSL.escapeHtml(item.comment || '') +
                      '</li>'
                    );
                  })
                  .join('') || '<li>None</li>') +
                '</ul>';
              KSL.openModal('monitoringDetailBackdrop');
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Unable to load task detail.', 'error');
            });
        });
        loadMonitoring();
      });
    });
  })();
</script>
