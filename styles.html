<style>
  :root {
    --navy: #0b1f3a;
    --navy-mid: #123056;
    --gold: #c5a028;
    --white: #ffffff;
    --page: #f4f6f8;
    --line: #d7dde5;
    --text: #1f2933;
    --muted: #5b6775;
    --success: #1b7a3d;
    --warning: #b45309;
    --danger: #b42318;
    --info: #125d95;
  }

  * {
    box-sizing: border-box;
    scrollbar-width: thin;
    scrollbar-color: #b7c2ce transparent;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    background: var(--page);
    min-height: 100%;
  }

  body:not(.login-body) {
    overflow: hidden;
  }

  body.shell-locked .app-shell {
    visibility: hidden;
    pointer-events: none;
  }

  .access-gate {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
    padding: 24px;
  }

  .access-gate-inner {
    text-align: center;
    max-width: 420px;
  }

  .access-gate-inner h2 {
    margin: 16px 0 8px;
    color: var(--navy);
    font-size: 20px;
  }

  .access-gate-inner p {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 14px;
  }

  *::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  *::-webkit-scrollbar-track {
    background: transparent;
  }

  *::-webkit-scrollbar-thumb {
    background: #b7c2ce;
  }

  *::-webkit-scrollbar-thumb:hover {
    background: #8f9aaa;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .hidden {
    display: none !important;
  }

  .kenya-stripe {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    display: flex;
    z-index: 1200;
  }

  .stripe-black { flex: 1; background: #000; }
  .stripe-red { flex: 1; background: #bb0000; }
  .stripe-green { flex: 1; background: #006600; }

  .app-shell {
    display: flex;
    height: calc(100vh - 6px);
    min-height: calc(100vh - 6px);
    margin-top: 6px;
  }

  .app-sidebar {
    width: 268px;
    background: var(--navy);
    color: var(--white);
    position: fixed;
    left: 0;
    top: 6px;
    bottom: 0;
    padding: 16px 8px 20px 12px;
    overflow-x: hidden;
    overflow-y: auto;
    border-right: 3px solid var(--gold);
    display: flex;
    flex-direction: column;
    scrollbar-color: rgba(197, 160, 40, 0.45) transparent;
  }

  .app-sidebar::-webkit-scrollbar-thumb {
    background: rgba(197, 160, 40, 0.45);
  }

  .app-sidebar::-webkit-scrollbar-thumb:hover {
    background: rgba(197, 160, 40, 0.7);
  }

  .brand-block {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 0 4px 18px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .ksl-spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto;
    border: 3px solid var(--line);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: ksl-spin 0.7s linear infinite;
  }

  @keyframes ksl-spin {
    to {
      transform: rotate(360deg);
    }
  }

  .brand-logo-img,
  .topbar-logo,
  .login-logo {
    display: block;
    object-fit: contain;
    background: transparent;
  }

  .brand-logo-img {
    width: 58px;
    height: 58px;
    padding: 0;
    border: none;
  }

  .brand-text h1 {
    margin: 0;
    line-height: 1.2;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .brand-text p {
    margin: 3px 0 0;
    font-size: 11px;
    color: #d4c07a;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    padding-bottom: 16px;
  }

  .nav-group {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .nav-group-label {
    position: sticky;
    top: 0;
    z-index: 1;
    margin: 2px 8px 4px;
    padding: 4px 0 2px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9aa8b8;
    background: var(--navy);
  }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #dce4ee;
    padding: 7px 10px;
    border-left: 3px solid transparent;
    font-size: 13px;
    border-radius: 2px;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .nav-icon {
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    fill: currentColor;
  }

  .nav-link:hover {
    background: transparent;
    color: var(--white);
    border-left-color: var(--gold);
  }

  .nav-link.active {
    background: rgba(197, 160, 40, 0.16);
    border-left-color: var(--gold);
    color: var(--white);
    font-weight: 600;
  }

  .sidebar-footer {
    position: static;
    margin-top: auto;
    padding-top: 12px;
    font-size: 11px;
    color: #9aa8b8;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .app-main {
    margin-left: 268px;
    width: calc(100% - 268px);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 6px);
    min-height: 0;
    overflow: hidden;
    background: var(--white);
  }

  .app-topbar {
    position: sticky;
    top: 6px;
    z-index: 15;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 10px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-logo {
    width: 42px;
    height: 42px;
  }

  .topbar-kicker {
    margin: 0;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .topbar-left h2 {
    margin: 0;
    font-size: 18px;
    color: var(--navy);
    font-weight: 700;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-button {
    border: 1px solid var(--navy);
    background: transparent;
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    border-radius: 2px;
    color: var(--navy);
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .icon-button:hover {
    background: transparent;
    border-color: var(--gold);
    color: var(--navy);
  }

  .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    background: var(--danger);
    color: var(--white);
    font-size: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    padding: 4px 10px 4px 4px;
    background: var(--white);
  }

  .user-chip img {
    width: 30px;
    height: 30px;
    object-fit: cover;
    background: #eef2f6;
  }

  .user-meta {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .user-meta strong {
    font-size: 13px;
    color: var(--navy);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 150px;
  }

  .user-meta span {
    font-size: 11px;
    color: var(--muted);
  }

  .content-area {
    padding: 22px;
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: var(--white);
  }

  .page-shell {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .page-header h1 {
    margin: 0;
    font-size: 18px;
    color: var(--navy);
    font-weight: 700;
  }

  .page-header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .toolbar-left,
  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    border: 1px solid transparent;
    border-radius: 2px;
    padding: 8px 13px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .btn-primary {
    background: var(--navy);
    color: var(--white);
    border-color: var(--navy);
  }

  .btn-primary:hover,
  .btn-primary:focus-visible {
    background: transparent;
    color: var(--navy);
    border-color: var(--navy);
  }

  .btn-secondary {
    background: var(--gold);
    color: var(--navy);
    border-color: var(--gold);
  }

  .btn-secondary:hover,
  .btn-secondary:focus-visible {
    background: transparent;
    color: var(--navy);
    border-color: var(--gold);
  }

  .btn-danger {
    background: var(--danger);
    color: var(--white);
    border-color: var(--danger);
  }

  .btn-danger:hover,
  .btn-danger:focus-visible {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
  }

  .btn-outline {
    border-color: var(--navy);
    background: transparent;
    color: var(--navy);
  }

  .btn-outline:hover,
  .btn-outline:focus-visible {
    background: transparent;
    color: var(--navy);
    border-color: var(--gold);
  }

  .card {
    background: var(--white);
    border: 1px solid var(--line);
    padding: 14px;
  }

  .kpi-grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }

  .kpi-card {
    border-top: 3px solid var(--gold);
  }

  .kpi-card h3 {
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .kpi-card strong {
    margin-top: 8px;
    display: block;
    font-size: 24px;
    color: var(--navy);
  }

  .input,
  .select,
  .textarea {
    width: 100%;
    border: 1px solid #b8c2cc;
    border-radius: 2px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    background: var(--white);
  }

  .select[multiple] {
    min-height: 120px;
  }

  .textarea {
    min-height: 96px;
    resize: vertical;
  }

  .input:focus,
  .select:focus,
  .textarea:focus {
    outline: none;
    border-color: var(--navy);
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    color: var(--navy);
    font-weight: 600;
  }

  .field.full {
    grid-column: span 2;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    background: var(--white);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 760px;
  }

  thead {
    background: var(--navy);
  }

  th,
  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 13px;
    vertical-align: middle;
  }

  th {
    color: var(--white);
    font-weight: 600;
    white-space: nowrap;
  }

  tbody tr:nth-child(even) {
    background: #f7f9fb;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .status-active,
  .status-completed {
    background: #e8f6ee;
    color: var(--success);
  }

  .status-duesoon,
  .status-ontrack {
    background: #e8eef6;
    color: var(--navy);
  }

  .status-disabled,
  .status-inactive,
  .status-overdue,
  .status-blocked,
  .status-archived {
    background: #fdecea;
    color: var(--danger);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(11, 31, 58, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 90;
  }

  .modal {
    width: min(860px, 100%);
    max-height: calc(100vh - 36px);
    overflow-y: auto;
    background: var(--white);
    border: 1px solid var(--line);
    padding: 18px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 10px;
  }

  .modal-header h3 {
    margin: 0;
    color: var(--navy);
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }

  .processing-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.45);
    z-index: 2000;
  }

  .processing-card {
    width: auto;
    max-width: 90vw;
    background: transparent;
    border: none;
    box-shadow: none;
    text-align: center;
    padding: 0;
  }

  .processing-card p {
    margin: 12px 0 0;
    color: var(--navy);
    font-weight: 600;
  }

  .auth-submit-button:disabled {
    opacity: 0.75;
    cursor: wait;
  }

  .toast-host {
    position: fixed;
    top: 24px;
    right: 18px;
    z-index: 1100;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    min-width: 240px;
    max-width: 360px;
    color: var(--white);
    padding: 10px 12px;
    font-size: 13px;
  }

  .toast-success { background: var(--success); }
  .toast-error { background: var(--danger); }
  .toast-info { background: var(--info); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 26px 16px;
  }

  .page-note {
    color: var(--muted);
    font-size: 13px;
  }

  .pagination {
    margin-top: 12px;
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  .pagination button {
    border: 1px solid var(--line);
    background: var(--white);
    padding: 5px 10px;
    cursor: pointer;
  }

  .pagination button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .login-page-container {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 36px 24px;
    background: var(--navy);
  }

  .login-card {
    width: min(500px, 100%);
    background: var(--white);
    padding: 30px 30px 24px;
    border-top: 6px solid var(--gold);
    border-radius: 2px;
    border: 1px solid #d6dee8;
    box-shadow: 0 14px 34px rgba(11, 31, 58, 0.22);
  }

  .login-card .login-logo {
    width: 96px;
    height: 96px;
    margin: 0 auto 12px;
    background: transparent;
  }

  .login-card h1 {
    margin: 0;
    color: var(--navy);
    font-size: 20px;
    text-align: center;
  }

  .login-kicker {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 11px;
    color: var(--gold);
    font-weight: 700;
    margin: 0 0 6px;
  }

  .login-card p {
    color: var(--muted);
    margin: 8px 0 16px;
    text-align: center;
  }

  .login-rules {
    display: none;
  }

  .auth-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 0 0 14px;
    padding: 0;
    border: none;
    background: transparent;
    border-radius: 0;
  }

  .auth-switch-button {
    border: 1px solid var(--navy);
    border-radius: 2px;
    background: transparent;
    color: var(--navy);
    padding: 9px 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .auth-switch-button:hover {
    background: transparent;
    color: var(--navy);
    border-color: var(--gold);
  }

  .auth-switch-button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .auth-switch-button.active {
    background: var(--navy);
    color: var(--white);
    border-color: var(--navy);
    box-shadow: none;
  }

  .auth-switch-button.active:hover {
    background: transparent;
    color: var(--navy);
    border-color: var(--navy);
  }

  .auth-panel {
    border: 1px solid #dde4ed;
    border-top: 3px solid var(--gold);
    border-radius: 2px;
    background: var(--white);
    box-shadow: none;
  }

  .auth-submit-button {
    width: 100%;
    min-width: 0;
    justify-content: center;
    border-radius: 2px;
    padding: 10px 14px;
    font-size: 14px;
    box-shadow: none;
  }

  .auth-alt-link {
    margin: 12px 0 0;
    font-size: 13px;
    color: var(--muted);
    text-align: left;
  }

  .auth-alt-link a {
    color: var(--navy-mid);
    font-weight: 700;
    text-decoration: none;
  }

  .auth-alt-link a:hover {
    text-decoration: underline;
  }

  .auth-extra-actions {
    margin-top: 10px;
    display: flex;
    justify-content: stretch;
  }

  .auth-utility-button {
    border-radius: 2px;
    font-size: 12px;
    padding: 7px 12px;
    color: var(--navy);
    width: 100%;
    justify-content: center;
  }

  .auth-utility-button:hover {
    color: var(--navy);
    background: #f1f5fa;
  }

  @media (max-width: 1050px) {
    .app-sidebar {
      width: 230px;
    }

    .app-main {
      margin-left: 230px;
      width: calc(100% - 230px);
    }

    .form-grid {
      grid-template-columns: 1fr;
    }

    .field.full {
      grid-column: auto;
    }
  }

  @media (max-width: 520px) {
    .login-card {
      padding: 22px 18px 18px;
      border-radius: 2px;
    }

    .auth-submit-button {
      width: 100%;
    }

    .auth-extra-actions {
      justify-content: stretch;
    }

    .auth-utility-button {
      width: 100%;
      justify-content: center;
    }
  }

  @media (max-width: 820px) {
    body:not(.login-body) {
      overflow: auto;
    }

    .app-sidebar {
      position: static;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .app-shell {
      flex-direction: column;
      height: auto;
      min-height: 0;
    }

    .app-main {
      margin-left: 0;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .content-area {
      overflow: visible;
    }

    .sidebar-footer {
      position: static;
      margin-top: 16px;
    }

    .app-topbar {
      position: static;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .topbar-right {
      width: 100%;
      justify-content: space-between;
    }
  }

  .chart-grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    margin-top: 12px;
  }

  .chart-card h3 {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--navy);
  }

  .chart-row {
    display: grid;
    grid-template-columns: 110px 1fr 36px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
  }

  .chart-bar {
    height: 10px;
    background: #e6ebf1;
    overflow: hidden;
  }

  .chart-bar > span {
    display: block;
    height: 100%;
    background: var(--navy);
  }

  .progress-bar {
    height: 8px;
    background: #e6ebf1;
    overflow: hidden;
  }

  .progress-bar > span {
    display: block;
    height: 100%;
    background: var(--success);
  }

  .progress-meter {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .progress-meter .progress-bar {
    flex: 1;
    min-width: 80px;
  }

  .subtask-list {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
  }
