<section class="page-shell">
  <div class="page-header">
    <h1>Task Management</h1>
    <p>Create, update, archive, and reopen tasks with role-based controls and validations.</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="newTaskButton" class="btn btn-primary" type="button">
          <i class="fa-solid fa-plus"></i>
          New Task
        </button>
        <button id="tasksRefreshButton" class="btn btn-outline" type="button">
          <i class="fa-solid fa-rotate-right"></i>
          Refresh
        </button>
      </div>
      <div class="toolbar-right">
        <input id="tasksSearchInput" class="input" type="search" placeholder="Search task title, description, assignee..." style="min-width: 280px;">
        <select id="tasksDepartmentFilter" class="select" style="min-width: 160px;">
          <option value="">All departments</option>
        </select>
        <select id="tasksPriorityFilter" class="select" style="min-width: 140px;">
          <option value="">All priorities</option>
        </select>
        <select id="tasksStatusFilter" class="select" style="min-width: 150px;">
          <option value="">All statuses</option>
        </select>
        <select id="tasksRecordStatusFilter" class="select" style="min-width: 140px;">
          <option value="Active">Active</option>
          <option value="Archived">Archived</option>
        </select>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Task ID</th>
          <th>Title</th>
          <th>Department</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Progress</th>
          <th>Start</th>
          <th>Due</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tasksTableBody">
        <tr>
          <td colspan="9" class="empty-state">Loading tasks...</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div id="tasksPagination" class="pagination"></div>
</section>

<div id="taskModalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="taskModalTitle">Create Task</h3>
      <button class="btn btn-outline" type="button" data-close-modal="taskModalBackdrop">
        <i class="fa-solid fa-xmark"></i>
        Close
      </button>
    </div>

    <form id="taskForm">
      <input id="taskIdInput" type="hidden">
      <div class="form-grid">
        <div class="field full">
          <label for="taskTitleInput">Task Title</label>
          <input id="taskTitleInput" class="input" type="text" required>
        </div>
        <div class="field full">
          <label for="taskDescriptionInput">Task Description</label>
          <textarea id="taskDescriptionInput" class="textarea"></textarea>
        </div>
        <div class="field">
          <label for="taskDepartmentInput">Department</label>
          <select id="taskDepartmentInput" class="select" required></select>
        </div>
        <div class="field">
          <label for="taskPriorityInput">Priority</label>
          <select id="taskPriorityInput" class="select" required></select>
        </div>
        <div class="field">
          <label for="taskStatusInput">Status</label>
          <select id="taskStatusInput" class="select" required></select>
        </div>
        <div class="field">
          <label for="taskProgressInput">Progress %</label>
          <input id="taskProgressInput" class="input" type="number" min="0" max="100" value="0" required>
        </div>
        <div class="field">
          <label for="taskStartDateInput">Start Date</label>
          <input id="taskStartDateInput" class="input" type="date" required>
        </div>
        <div class="field">
          <label for="taskDueDateInput">Due Date</label>
          <input id="taskDueDateInput" class="input" type="date" required>
        </div>
        <div class="field">
          <label for="taskEstimatedHoursInput">Estimated Hours</label>
          <input id="taskEstimatedHoursInput" class="input" type="number" min="0" step="0.25" value="0">
        </div>
        <div class="field">
          <label for="taskActualHoursInput">Actual Hours</label>
          <input id="taskActualHoursInput" class="input" type="number" min="0" step="0.25" value="0">
        </div>
        <div class="field">
          <label for="taskPrimaryAssigneeInput">Primary Assignee ID</label>
          <input id="taskPrimaryAssigneeInput" class="input" type="text">
        </div>
        <div class="field">
          <label for="taskPrimaryAssigneeNameInput">Primary Assignee Name</label>
          <input id="taskPrimaryAssigneeNameInput" class="input" type="text">
        </div>
        <div class="field full">
          <label for="taskBlockerDescriptionInput">Blocker Description</label>
          <textarea id="taskBlockerDescriptionInput" class="textarea"></textarea>
        </div>
        <div class="field full">
          <label for="taskCompletionNotesInput">Completion Notes</label>
          <textarea id="taskCompletionNotesInput" class="textarea"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" type="button" data-close-modal="taskModalBackdrop">Cancel</button>
        <button class="btn btn-primary" type="submit">
          <i class="fa-solid fa-floppy-disk"></i>
          Save Task
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    var state = {
      tasks: [],
      page: 1,
      pages: 1,
      pageSize: 25,
      metadata: {
        priorities: [],
        statuses: [],
        departments: []
      }
    };

    function renderOptions(selectElement, values, placeholder, valueKey, labelKey) {
      if (!selectElement) {
        return;
      }
      var entries = values || [];
      var html = placeholder ? '<option value="">' + KSL.escapeHtml(placeholder) + '</option>' : '';
      html += entries
        .map(function (entry) {
          var value;
          var label;
          if (typeof entry === 'string') {
            value = entry;
            label = entry;
          } else {
            value = entry[valueKey];
            label = entry[labelKey];
          }
          return (
            '<option value="' +
            KSL.escapeHtml(value || '') +
            '">' +
            KSL.escapeHtml(label || value || '') +
            '</option>'
          );
        })
        .join('');
      selectElement.innerHTML = html;
    }

    function getFilters() {
      return {
        query: document.getElementById('tasksSearchInput').value.trim(),
        department: document.getElementById('tasksDepartmentFilter').value,
        priority: document.getElementById('tasksPriorityFilter').value,
        status: document.getElementById('tasksStatusFilter').value,
        recordStatus: document.getElementById('tasksRecordStatusFilter').value,
        page: state.page,
        pageSize: state.pageSize
      };
    }

    function renderTasks() {
      var body = document.getElementById('tasksTableBody');
      if (!body) {
        return;
      }
      if (!state.tasks.length) {
        body.innerHTML = '<tr><td colspan="9" class="empty-state"><i class="fa-solid fa-list-check"></i><p>No tasks found.</p></td></tr>';
        return;
      }
      body.innerHTML = state.tasks
        .map(function (task) {
          var actions = [
            '<button class="btn btn-outline" type="button" data-action="edit" data-id="' +
              KSL.escapeHtml(task.taskId) +
              '">Edit</button>'
          ];
          if ((task.recordStatus || '').toLowerCase() === 'archived') {
            actions.push(
              '<button class="btn btn-secondary" type="button" data-action="reopen" data-id="' +
                KSL.escapeHtml(task.taskId) +
                '">Reopen</button>'
            );
          } else {
            actions.push(
              '<button class="btn btn-danger" type="button" data-action="archive" data-id="' +
                KSL.escapeHtml(task.taskId) +
                '">Archive</button>'
            );
          }
          return (
            '<tr>' +
            '<td>' +
            KSL.escapeHtml(task.taskId) +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(task.taskTitle) +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(task.department || '-') +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(task.priority || '-') +
            '</td>' +
            '<td><span class="status-badge ' +
            KSL.statusClass(task.status) +
            '">' +
            KSL.escapeHtml(task.status || '-') +
            '</span></td>' +
            '<td>' +
            KSL.escapeHtml(String(task.progress || 0) + '%') +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(KSL.formatDate(task.startDate) || '-') +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(KSL.formatDate(task.dueDate) || '-') +
            '</td>' +
            '<td><div class="toolbar-left">' +
            actions.join('') +
            '</div></td>' +
            '</tr>'
          );
        })
        .join('');
    }

    function renderPagination() {
      var pagination = document.getElementById('tasksPagination');
      if (!pagination) {
        return;
      }
      pagination.innerHTML =
        '<button type="button" id="tasksPrevPage" ' +
        (state.page <= 1 ? 'disabled' : '') +
        '>Previous</button>' +
        '<button type="button" disabled>Page ' +
        state.page +
        ' of ' +
        state.pages +
        '</button>' +
        '<button type="button" id="tasksNextPage" ' +
        (state.page >= state.pages ? 'disabled' : '') +
        '>Next</button>';

      var prevButton = document.getElementById('tasksPrevPage');
      var nextButton = document.getElementById('tasksNextPage');
      if (prevButton) {
        prevButton.addEventListener('click', function () {
          state.page -= 1;
          loadTasks();
        });
      }
      if (nextButton) {
        nextButton.addEventListener('click', function () {
          state.page += 1;
          loadTasks();
        });
      }
    }

    function loadTaskMetadata() {
      return KSL.call('getTaskFormMetadata', KSL.getSessionToken()).then(function (response) {
        if (!response || !response.success) {
          throw new Error((response && response.message) || 'Unable to load task metadata.');
        }
        state.metadata = response.data || state.metadata;

        renderOptions(
          document.getElementById('tasksDepartmentFilter'),
          state.metadata.departments || [],
          'All departments',
          'departmentName',
          'departmentName'
        );
        renderOptions(
          document.getElementById('taskDepartmentInput'),
          state.metadata.departments || [],
          '',
          'departmentName',
          'departmentName'
        );
        renderOptions(document.getElementById('tasksPriorityFilter'), state.metadata.priorities || [], 'All priorities');
        renderOptions(document.getElementById('taskPriorityInput'), state.metadata.priorities || [], '');
        renderOptions(document.getElementById('tasksStatusFilter'), state.metadata.statuses || [], 'All statuses');
        renderOptions(document.getElementById('taskStatusInput'), state.metadata.statuses || [], '');
      });
    }

    function loadTasks() {
      KSL.call('listTasks', KSL.getSessionToken(), getFilters())
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Unable to load tasks.');
          }
          var payload = response.data || {};
          state.tasks = payload.items || [];
          var pagination = payload.pagination || {};
          state.page = Number(pagination.page || 1);
          state.pages = Number(pagination.pages || 1);
          renderTasks();
          renderPagination();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Unable to load tasks.', 'error');
        });
    }

    function resetTaskForm() {
      document.getElementById('taskForm').reset();
      document.getElementById('taskIdInput').value = '';
      document.getElementById('taskModalTitle').textContent = 'Create Task';
      document.getElementById('taskProgressInput').value = 0;
      document.getElementById('taskEstimatedHoursInput').value = 0;
      document.getElementById('taskActualHoursInput').value = 0;
    }

    function openCreateModal() {
      resetTaskForm();
      KSL.openModal('taskModalBackdrop');
    }

    function toDateInputValue(value) {
      if (!value) {
        return '';
      }
      var date = new Date(value);
      if (isNaN(date.getTime())) {
        return '';
      }
      var mm = String(date.getMonth() + 1).padStart(2, '0');
      var dd = String(date.getDate()).padStart(2, '0');
      return date.getFullYear() + '-' + mm + '-' + dd;
    }

    function openEditModal(taskId) {
      var task = state.tasks.find(function (item) {
        return item.taskId === taskId;
      });
      if (!task) {
        KSL.showToast('Task not found.', 'error');
        return;
      }
      document.getElementById('taskModalTitle').textContent = 'Edit Task';
      document.getElementById('taskIdInput').value = task.taskId;
      document.getElementById('taskTitleInput').value = task.taskTitle || '';
      document.getElementById('taskDescriptionInput').value = task.taskDescription || '';
      document.getElementById('taskDepartmentInput').value = task.department || '';
      document.getElementById('taskPriorityInput').value = task.priority || '';
      document.getElementById('taskStatusInput').value = task.status || '';
      document.getElementById('taskProgressInput').value = Number(task.progress || 0);
      document.getElementById('taskStartDateInput').value = toDateInputValue(task.startDate);
      document.getElementById('taskDueDateInput').value = toDateInputValue(task.dueDate);
      document.getElementById('taskEstimatedHoursInput').value = Number(task.estimatedHours || 0);
      document.getElementById('taskActualHoursInput').value = Number(task.actualHours || 0);
      document.getElementById('taskPrimaryAssigneeInput').value = task.primaryAssignee || '';
      document.getElementById('taskPrimaryAssigneeNameInput').value = task.primaryAssigneeName || '';
      document.getElementById('taskBlockerDescriptionInput').value = task.blockerDescription || '';
      document.getElementById('taskCompletionNotesInput').value = task.completionNotes || '';
      KSL.openModal('taskModalBackdrop');
    }

    function collectTaskPayload() {
      return {
        taskId: document.getElementById('taskIdInput').value.trim(),
        taskTitle: document.getElementById('taskTitleInput').value.trim(),
        taskDescription: document.getElementById('taskDescriptionInput').value.trim(),
        department: document.getElementById('taskDepartmentInput').value,
        priority: document.getElementById('taskPriorityInput').value,
        status: document.getElementById('taskStatusInput').value,
        progress: Number(document.getElementById('taskProgressInput').value || 0),
        startDate: document.getElementById('taskStartDateInput').value,
        dueDate: document.getElementById('taskDueDateInput').value,
        estimatedHours: Number(document.getElementById('taskEstimatedHoursInput').value || 0),
        actualHours: Number(document.getElementById('taskActualHoursInput').value || 0),
        primaryAssignee: document.getElementById('taskPrimaryAssigneeInput').value.trim(),
        primaryAssigneeName: document.getElementById('taskPrimaryAssigneeNameInput').value.trim(),
        blockerDescription: document.getElementById('taskBlockerDescriptionInput').value.trim(),
        completionNotes: document.getElementById('taskCompletionNotesInput').value.trim()
      };
    }

    function submitTask(event) {
      event.preventDefault();
      var payload = collectTaskPayload();
      var isUpdate = Boolean(payload.taskId);
      var fnName = isUpdate ? 'updateTask' : 'createTask';
      KSL.call(fnName, KSL.getSessionToken(), payload)
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Unable to save task.');
          }
          KSL.showToast('Task saved successfully.', 'success');
          KSL.closeModal('taskModalBackdrop');
          state.page = 1;
          loadTasks();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Unable to save task.', 'error');
        });
    }

    function archiveTask(taskId) {
      if (!window.confirm('Archive this task?')) {
        return;
      }
      KSL.call('archiveTask', KSL.getSessionToken(), { taskId: taskId })
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Unable to archive task.');
          }
          KSL.showToast('Task archived.', 'success');
          loadTasks();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Unable to archive task.', 'error');
        });
    }

    function reopenTask(taskId) {
      if (!window.confirm('Reopen this task?')) {
        return;
      }
      KSL.call('reopenTask', KSL.getSessionToken(), { taskId: taskId })
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Unable to reopen task.');
          }
          KSL.showToast('Task reopened.', 'success');
          loadTasks();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Unable to reopen task.', 'error');
        });
    }

    function bindEvents() {
      document.getElementById('newTaskButton').addEventListener('click', openCreateModal);
      document.getElementById('tasksRefreshButton').addEventListener('click', function () {
        state.page = 1;
        loadTasks();
      });
      document.getElementById('tasksSearchInput').addEventListener('input', function () {
        state.page = 1;
        loadTasks();
      });
      document.getElementById('tasksDepartmentFilter').addEventListener('change', function () {
        state.page = 1;
        loadTasks();
      });
      document.getElementById('tasksPriorityFilter').addEventListener('change', function () {
        state.page = 1;
        loadTasks();
      });
      document.getElementById('tasksStatusFilter').addEventListener('change', function () {
        state.page = 1;
        loadTasks();
      });
      document.getElementById('tasksRecordStatusFilter').addEventListener('change', function () {
        state.page = 1;
        loadTasks();
      });
      document.getElementById('taskForm').addEventListener('submit', submitTask);
      document.getElementById('tasksTableBody').addEventListener('click', function (event) {
        var button = event.target.closest('button[data-action]');
        if (!button) {
          return;
        }
        var action = button.dataset.action;
        var taskId = button.dataset.id || '';
        if (action === 'edit') {
          openEditModal(taskId);
          return;
        }
        if (action === 'archive') {
          archiveTask(taskId);
          return;
        }
        if (action === 'reopen') {
          reopenTask(taskId);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager', 'Supervisor', 'Team Leader'], function () {
        bindEvents();
        loadTaskMetadata()
          .then(function () {
            loadTasks();
          })
          .catch(function (error) {
            KSL.showToast(error.message || 'Unable to initialize task module.', 'error');
          });
      });
    });
  })();
</script>
