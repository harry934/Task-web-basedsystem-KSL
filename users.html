<section class="page-shell">
  <div class="page-header">
    <h1>User Management</h1>
    <p>Login accounts for staff. Create staff records first, then issue a username here.</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="newUserButton" class="btn btn-primary" type="button">New User</button>
        <button id="usersRefreshButton" class="btn btn-outline" type="button">Refresh</button>
        <button id="usersPendingButton" class="btn btn-outline" type="button">Approval queue</button>
      </div>
      <div class="toolbar-right">
        <input id="usersSearchInput" class="input" type="search" placeholder="Search users..." style="min-width: 220px;">
        <select id="usersRoleFilter" class="select" style="min-width: 150px;">
          <option value="">All roles</option>
        </select>
        <select id="usersStatusFilter" class="select" style="min-width: 170px;">
          <option value="">All statuses</option>
        </select>
      </div>
    </div>
  </div>

  <div id="approvalQueue" class="card approval-queue hidden">
    <strong>Approval queue</strong>
    <div class="table-wrap" style="margin-top: 10px;">
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="approvalQueueBody">
          <tr><td colspan="5" class="empty-state">No pending accounts.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Department</th>
          <th>Last Login</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr>
          <td colspan="8" class="empty-state">Loading users...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="usersPagination" class="pagination"></div>
</section>

<div id="newUserModalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>Create user</h3>
      <button class="btn btn-outline" type="button" data-close-modal="newUserModalBackdrop">Close</button>
    </div>
    <form id="newUserForm">
      <div class="form-grid">
        <div class="field">
          <label for="newUserFullName">Full name</label>
          <input id="newUserFullName" class="input" type="text" required>
        </div>
        <div class="field">
          <label for="newUserUsername">Username</label>
          <input id="newUserUsername" class="input" type="text" required>
        </div>
        <div class="field">
          <label for="newUserEmail">Work email</label>
          <input id="newUserEmail" class="input" type="email">
        </div>
        <div class="field">
          <label for="newUserPassword">Password</label>
          <input id="newUserPassword" class="input" type="password" required>
        </div>
        <div class="field">
          <label for="newUserRole">Role</label>
          <select id="newUserRole" class="select" required></select>
        </div>
        <div class="field">
          <label for="newUserIdPreview">User UID</label>
          <input id="newUserIdPreview" class="input" type="text" readonly>
        </div>
        <div class="field">
          <label for="newUserEmployeeId">Staff UID</label>
          <select id="newUserEmployeeId" class="select"></select>
        </div>
        <div class="field">
          <label for="newUserDepartment">Department</label>
          <input id="newUserDepartment" class="input" type="text">
        </div>
        <div class="field">
          <label for="newUserJobTitle">Job title</label>
          <input id="newUserJobTitle" class="input" type="text">
        </div>
        <div class="field">
          <label for="newUserSupervisorId">Supervisor</label>
          <select id="newUserSupervisorId" class="select"></select>
        </div>
        <div class="field">
          <label for="newUserStatus">Account status</label>
          <select id="newUserStatus" class="select">
            <option value="Active">Active</option>
            <option value="Pending Approval">Pending Approval</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" type="button" data-close-modal="newUserModalBackdrop">Cancel</button>
        <button class="btn btn-primary" type="submit">Create user</button>
      </div>
    </form>
  </div>
</div>

<div id="userApprovalModalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>Approve User Account</h3>
      <button class="btn btn-outline" type="button" data-close-modal="userApprovalModalBackdrop">
        <i class="fa-solid fa-xmark"></i>
        Close
      </button>
    </div>

    <form id="userApprovalForm">
      <input id="approvalUserId" type="hidden">
      <div class="form-grid">
        <div class="field">
          <label for="approvalEmployeeId">Staff UID</label>
          <select id="approvalEmployeeId" class="select" required></select>
        </div>
        <div class="field">
          <label for="approvalDepartment">Department</label>
          <input id="approvalDepartment" class="input" type="text" required>
        </div>
        <div class="field">
          <label for="approvalJobTitle">Job Title</label>
          <input id="approvalJobTitle" class="input" type="text" required>
        </div>
        <div class="field">
          <label for="approvalRole">Role</label>
          <select id="approvalRole" class="select" required></select>
        </div>
        <div class="field">
          <label for="approvalSupervisorId">Supervisor</label>
          <select id="approvalSupervisorId" class="select"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" type="button" data-close-modal="userApprovalModalBackdrop">Cancel</button>
        <button class="btn btn-primary" type="submit">
          <i class="fa-solid fa-check-circle"></i>
          Approve User
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    var state = {
      users: [],
      pending: [],
      page: 1,
      pageSize: 25,
      pages: 1
    };

    function getFilters() {
      return {
        query: document.getElementById('usersSearchInput').value.trim(),
        role: document.getElementById('usersRoleFilter').value,
        status: document.getElementById('usersStatusFilter').value,
        page: state.page,
        pageSize: state.pageSize
      };
    }

    function staffRoleValues(roles) {
      var seen = {};
      return (roles || [])
        .map(function (role) {
          return role === 'Employee' ? 'Staff' : role;
        })
        .filter(function (role) {
          if (!role || seen[role]) {
            return false;
          }
          seen[role] = true;
          return true;
        });
    }

    function loadStaffSelects(selectedStaffId, selectedSupervisorId) {
      return KSL.call('listStaffOptions', KSL.getSessionToken()).then(function (response) {
        var people = (response && response.data && response.data.items) || [];
        state.staff = people;
        KSL.fillStaffSelect('newUserEmployeeId', people, 'Select staff', selectedStaffId || '');
        KSL.fillStaffSelect('newUserSupervisorId', people, 'Select supervisor', selectedSupervisorId || '');
        KSL.fillStaffSelect('approvalEmployeeId', people, 'Select staff', selectedStaffId || '');
        KSL.fillStaffSelect('approvalSupervisorId', people, 'Select supervisor', selectedSupervisorId || '');
        return people;
      });
    }

    function renderDropdownOptions(selectId, values, placeholder) {
      var select = document.getElementById(selectId);
      if (!select) {
        return;
      }
      var existingPlaceholder = placeholder ? '<option value="">' + KSL.escapeHtml(placeholder) + '</option>' : '';
      var options = (values || []).map(function (value) {
        return '<option value="' + KSL.escapeHtml(value) + '">' + KSL.escapeHtml(value) + '</option>';
      });
      select.innerHTML = existingPlaceholder + options.join('');
    }

    function renderUsersTable() {
      var body = document.getElementById('usersTableBody');
      if (!body) {
        return;
      }

      if (!state.users.length) {
        body.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fa-solid fa-users"></i><p>No users found.</p></td></tr>';
        return;
      }

      body.innerHTML = state.users
        .map(function (user) {
          var statusClass = KSL.statusClass(user.accountStatus);
          var menuItems = [];
          if ((user.accountStatus || '').toLowerCase() === 'pending approval') {
            menuItems.push(
              '<button class="action-menu-item" type="button" data-action="approve" data-user-id="' +
                KSL.escapeHtml(user.userId) +
                '">Approve</button>'
            );
          }
          menuItems.push(
            '<button class="action-menu-item" type="button" data-action="password" data-user-id="' +
              KSL.escapeHtml(user.userId) +
              '">Set password</button>'
          );
          menuItems.push(
            '<button class="action-menu-item" type="button" data-action="status" data-status="Active" data-user-id="' +
              KSL.escapeHtml(user.userId) +
              '">Activate</button>'
          );
          menuItems.push(
            '<button class="action-menu-item" type="button" data-action="status" data-status="Suspended" data-user-id="' +
              KSL.escapeHtml(user.userId) +
              '">Suspend</button>'
          );
          menuItems.push(
            '<button class="action-menu-item" type="button" data-action="status" data-status="Disabled" data-user-id="' +
              KSL.escapeHtml(user.userId) +
              '">Disable</button>'
          );
          menuItems.push(
            '<button class="action-menu-item action-menu-danger" type="button" data-action="delete" data-user-id="' +
              KSL.escapeHtml(user.userId) +
              '" data-name="' +
              KSL.escapeHtml(user.fullName || user.username || user.userId) +
              '">Delete</button>'
          );

          return (
            '<tr>' +
            '<td>' +
            KSL.escapeHtml(user.username || '-') +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(user.fullName) +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(user.email) +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(KSL.displayRole(user.role) || '-') +
            '</td>' +
            '<td><span class="status-badge ' +
            statusClass +
            '">' +
            KSL.escapeHtml(user.accountStatus || '-') +
            '</span></td>' +
            '<td>' +
            KSL.escapeHtml(user.department || '-') +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(KSL.formatDate(user.lastLogin) || '-') +
            '</td>' +
            '<td><div class="action-menu">' +
            '<button class="btn btn-outline action-menu-toggle" type="button" aria-haspopup="true">Actions</button>' +
            '<div class="action-menu-list hidden">' +
            menuItems.join('') +
            '</div></div></td>' +
            '</tr>'
          );
        })
        .join('');
    }

    function renderPagination() {
      var pagination = document.getElementById('usersPagination');
      if (!pagination) {
        return;
      }
      pagination.innerHTML =
        '<button type="button" id="usersPrevPage" ' +
        (state.page <= 1 ? 'disabled' : '') +
        '>Previous</button>' +
        '<button type="button" disabled>Page ' +
        state.page +
        ' of ' +
        state.pages +
        '</button>' +
        '<button type="button" id="usersNextPage" ' +
        (state.page >= state.pages ? 'disabled' : '') +
        '>Next</button>';

      var prevButton = document.getElementById('usersPrevPage');
      var nextButton = document.getElementById('usersNextPage');
      if (prevButton) {
        prevButton.addEventListener('click', function () {
          state.page -= 1;
          loadUsers();
        });
      }
      if (nextButton) {
        nextButton.addEventListener('click', function () {
          state.page += 1;
          loadUsers();
        });
      }
    }

    function loadUsers() {
      var filters = getFilters();
      KSL.call('listUsers', KSL.getSessionToken(), filters)
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load users.');
          }
          var payload = response.data || {};
          state.users = payload.items || [];
          var pagination = payload.pagination || {};
          state.page = Number(pagination.page || 1);
          state.pages = Number(pagination.pages || 1);
          renderUsersTable();
          renderPagination();
          loadPendingUsers();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Failed to load users.', 'error');
        });
    }

    function loadPendingUsers() {
      KSL.call('listPendingUsers', KSL.getSessionToken())
        .then(function (response) {
          var payload = response && response.data ? response.data : {};
          state.pending = payload.items || [];
          renderApprovalQueue(state.pending);
        })
        .catch(function () {
          renderApprovalQueue(state.users);
        });
    }

    function openApprovalModal(userId) {
      var selected = state.users.concat(state.pending).find(function (user) {
        return user.userId === userId;
      });
      if (!selected) {
        KSL.showToast('Selected user was not found.', 'error');
        return;
      }
      document.getElementById('approvalUserId').value = selected.userId;
      document.getElementById('approvalDepartment').value = selected.department || '';
      document.getElementById('approvalJobTitle').value = selected.jobTitle || '';
      document.getElementById('approvalRole').value = KSL.displayRole(selected.role || 'Staff');
      loadStaffSelects(selected.employeeId || '', selected.supervisorId || '').then(function () {
        KSL.openModal('userApprovalModalBackdrop');
      });
    }

    function submitApproval(event) {
      event.preventDefault();
      var payload = {
        userId: document.getElementById('approvalUserId').value.trim(),
        employeeId: document.getElementById('approvalEmployeeId').value.trim(),
        department: document.getElementById('approvalDepartment').value.trim(),
        jobTitle: document.getElementById('approvalJobTitle').value.trim(),
        role: document.getElementById('approvalRole').value,
        supervisorId: document.getElementById('approvalSupervisorId').value.trim(),
        accountStatus: 'Active'
      };
      KSL.call('approveUser', KSL.getSessionToken(), payload)
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Approval failed.');
          }
          KSL.showToast('User approved successfully.', 'success');
          KSL.closeModal('userApprovalModalBackdrop');
          loadUsers();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Approval failed.', 'error');
        });
    }

    function updateStatus(userId, status) {
      var confirmed = window.confirm('Change account status to "' + status + '"?');
      if (!confirmed) {
        return;
      }
      KSL.call('updateUserAccountStatus', KSL.getSessionToken(), {
        userId: userId,
        accountStatus: status
      })
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Status update failed.');
          }
          KSL.showToast('Account status updated.', 'success');
          loadUsers();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Status update failed.', 'error');
        });
    }

    function suggestUsername(user) {
      if (user && user.username) {
        return user.username;
      }
      var email = user && user.email ? String(user.email) : '';
      if (!email) {
        return '';
      }
      return email.split('@')[0].toLowerCase().replace(/[^a-z0-9._-]/g, '');
    }

    function resetPassword(userId) {
      var target = state.users.find(function (user) {
        return user.userId === userId;
      });
      if (!target) {
        KSL.showToast('User not found.', 'error');
        return;
      }

      var username = window.prompt('Username for this account:', suggestUsername(target));
      if (username === null) {
        return;
      }
      username = String(username || '').trim().toLowerCase();
      if (!username) {
        KSL.showToast('Username is required.', 'error');
        return;
      }

      var newPassword = window.prompt(
        'Enter a new temporary password (must include uppercase, lowercase, and a number):',
        ''
      );
      if (newPassword === null) {
        return;
      }
      if (!newPassword) {
        KSL.showToast('Password is required.', 'error');
        return;
      }
      var confirmPassword = window.prompt('Confirm the new password:', '');
      if (confirmPassword === null) {
        return;
      }
      if (newPassword !== confirmPassword) {
        KSL.showToast('Passwords do not match.', 'error');
        return;
      }

      KSL.callBusy('adminResetUserPassword', KSL.getSessionToken(), {
        userId: userId,
        username: username,
        newPassword: newPassword
      })
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Password reset failed.');
          }
          KSL.showToast('Password updated.', 'success');
          loadUsers();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Password reset failed.', 'error');
        });
    }

    function renderApprovalQueue(items) {
      var body = document.getElementById('approvalQueueBody');
      var queue = document.getElementById('approvalQueue');
      var pending = (items || []).filter(function (user) {
        return String(user.accountStatus || '').toLowerCase() === 'pending approval';
      });
      queue.classList.toggle('hidden', pending.length === 0 && document.getElementById('usersStatusFilter').value !== 'Pending Approval');
      if (!pending.length) {
        body.innerHTML = '<tr><td colspan="5" class="empty-state">No pending accounts.</td></tr>';
        return;
      }
      queue.classList.remove('hidden');
      body.innerHTML = pending
        .map(function (user) {
          return (
            '<tr><td>' +
            KSL.escapeHtml(user.username || '-') +
            '</td><td>' +
            KSL.escapeHtml(user.fullName || '-') +
            '</td><td>' +
            KSL.escapeHtml(user.email || '-') +
            '</td><td>' +
            KSL.escapeHtml(user.accountStatus) +
            '</td><td><button class="btn btn-secondary" type="button" data-action="approve" data-user-id="' +
            KSL.escapeHtml(user.userId) +
            '">Approve</button></td></tr>'
          );
        })
        .join('');
    }

    function bindTableActions() {
      var body = document.getElementById('usersTableBody');
      if (!body) {
        return;
      }
      body.addEventListener('click', function (event) {
        var toggle = event.target.closest('.action-menu-toggle');
        if (toggle) {
          event.stopPropagation();
          var menu = toggle.parentElement.querySelector('.action-menu-list');
          document.querySelectorAll('.action-menu-list').forEach(function (openMenu) {
            if (openMenu !== menu) {
              openMenu.classList.add('hidden');
            }
          });
          if (menu) {
            menu.classList.toggle('hidden');
          }
          return;
        }
        var button = event.target.closest('button[data-action]');
        if (!button) {
          return;
        }
        var action = button.dataset.action;
        var userId = button.dataset.userId || '';
        if (action === 'approve') {
          openApprovalModal(userId);
          return;
        }
        if (action === 'password') {
          resetPassword(userId);
          return;
        }
        if (action === 'status') {
          updateStatus(userId, button.dataset.status || '');
          return;
        }
        if (action === 'delete' && KSL.confirmDelete(button.dataset.name || userId)) {
          KSL.call('deleteUserAccount', KSL.getSessionToken(), { userId: userId })
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Delete failed.');
              }
              KSL.showToast('User deleted.', 'success');
              loadUsers();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Delete failed.', 'error');
            });
        }
      });
    }

    function bindFilters() {
      document.getElementById('usersRefreshButton').addEventListener('click', function () {
        state.page = 1;
        loadUsers();
      });
      document.getElementById('usersSearchInput').addEventListener('input', function () {
        state.page = 1;
        loadUsers();
      });
      document.getElementById('usersRoleFilter').addEventListener('change', function () {
        state.page = 1;
        loadUsers();
      });
      document.getElementById('usersStatusFilter').addEventListener('change', function () {
        state.page = 1;
        loadUsers();
      });
      document.getElementById('userApprovalForm').addEventListener('submit', submitApproval);
      document.getElementById('newUserButton').addEventListener('click', function () {
        document.getElementById('newUserForm').reset();
        document.getElementById('newUserStatus').value = 'Active';
        document.getElementById('newUserRole').value = 'Staff';
        loadStaffSelects('', '');
        KSL.previewNextId('USR').then(function (nextId) {
          document.getElementById('newUserIdPreview').value = nextId || 'Generated on save';
        });
        KSL.openModal('newUserModalBackdrop');
      });
      document.getElementById('usersPendingButton').addEventListener('click', function () {
        document.getElementById('usersStatusFilter').value = 'Pending Approval';
        state.page = 1;
        loadUsers();
        document.getElementById('approvalQueue').classList.remove('hidden');
      });
      document.getElementById('newUserForm').addEventListener('submit', function (event) {
        event.preventDefault();
        KSL.call('createUserAccount', KSL.getSessionToken(), {
          fullName: document.getElementById('newUserFullName').value.trim(),
          username: document.getElementById('newUserUsername').value.trim(),
          email: document.getElementById('newUserEmail').value.trim(),
          password: document.getElementById('newUserPassword').value,
          role: document.getElementById('newUserRole').value,
          employeeId: document.getElementById('newUserEmployeeId').value.trim(),
          supervisorId: document.getElementById('newUserSupervisorId').value.trim(),
          department: document.getElementById('newUserDepartment').value.trim(),
          jobTitle: document.getElementById('newUserJobTitle').value.trim(),
          accountStatus: document.getElementById('newUserStatus').value
        })
          .then(function (response) {
            if (!response || !response.success) {
              throw new Error((response && response.message) || 'Unable to create user.');
            }
            KSL.showToast('User created.', 'success');
            KSL.closeModal('newUserModalBackdrop');
            state.page = 1;
            loadUsers();
          })
          .catch(function (error) {
            KSL.showToast(error.message || 'Unable to create user.', 'error');
          });
      });
      document.getElementById('approvalQueueBody').addEventListener('click', function (event) {
        var button = event.target.closest('button[data-action="approve"]');
        if (!button) {
          return;
        }
        openApprovalModal(button.dataset.userId || '');
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator'], function () {
        var defaultRoles = ['Administrator', 'Manager', 'Supervisor', 'Team Leader', 'Staff'];
        var defaultStatuses = ['Active', 'Inactive', 'Pending'];
        function applyUserDimensions(dimensions) {
          var values = dimensions || {};
          renderDropdownOptions('usersRoleFilter', staffRoleValues(values.Roles || defaultRoles), 'All roles');
          renderDropdownOptions(
            'usersStatusFilter',
            values['Account Statuses'] || defaultStatuses,
            'All statuses'
          );
          renderDropdownOptions('approvalRole', staffRoleValues(values.Roles || defaultRoles), '');
          renderDropdownOptions('newUserRole', staffRoleValues(values.Roles || defaultRoles), '');
        }
        applyUserDimensions({});
        KSL.call('listDimensionsAdmin', KSL.getSessionToken())
          .then(function (response) {
            var grouped = {};
            (((response && response.data) || {}).items || []).forEach(function (item) {
              if (!item || item.status === 'Inactive') {
                return;
              }
              grouped[item.column] = grouped[item.column] || [];
              grouped[item.column].push(item.value);
            });
            applyUserDimensions(grouped);
          })
          .catch(function () {
            return null;
          });
        loadStaffSelects('', '');
        bindTableActions();
        bindFilters();
        document.addEventListener('click', function () {
          document.querySelectorAll('.action-menu-list').forEach(function (menu) {
            menu.classList.add('hidden');
          });
        });
        loadUsers();
      });
    });
  })();
</script>
