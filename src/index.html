<section class="page-shell">
  <div class="page-header">
    <h1>Dashboard</h1>
    <p>Role-scoped KPIs, filters, and printable operational summaries for Kenya Shipyards Limited.</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="refreshDashboardButton" class="btn btn-primary" type="button">
          <i class="fa-solid fa-rotate-right"></i>
          Refresh
        </button>
        <button id="exportDashboardButton" class="btn btn-outline" type="button">Export</button>
        <button id="exportDashboardPdfButton" class="btn btn-outline" type="button">Export PDF</button>
      </div>
      <div class="toolbar-right">
        <input id="dashboardStartInput" class="input" type="date">
        <input id="dashboardEndInput" class="input" type="date">
        <input id="dashboardDepartmentInput" class="input" type="search" placeholder="Department" style="min-width: 140px;">
        <input id="dashboardSupervisorInput" class="input" type="search" placeholder="Supervisor" style="min-width: 140px;">
      </div>
    </div>
  </div>

  <div id="dashboardKpiGrid" class="kpi-grid"></div>
  <div id="staffWorkCard" class="card hidden">
    <strong>Look up staff work</strong>
    <p class="page-note">Search a staff member by name, username, or Staff UID to see their tasks and subtask progress.</p>
    <div class="toolbar" style="margin-top: 10px;">
      <div class="toolbar-left">
        <input id="dashboardStaffSearchInput" class="input" type="search" placeholder="Name, username, or Staff UID" style="min-width: 260px;">
        <button id="dashboardStaffSearchButton" class="btn btn-primary" type="button">Search</button>
      </div>
    </div>
    <div id="dashboardStaffWorkResults"></div>
  </div>
  <div id="dashboardCharts" class="chart-grid"></div>
</section>

<script>
  (function () {
    var KPI_CONFIG = [
      { key: 'totalTasks', label: 'Total Tasks' },
      { key: 'assignedTasks', label: 'Assigned' },
      { key: 'inProgressTasks', label: 'In Progress' },
      { key: 'completedTasks', label: 'Completed' },
      { key: 'overdueTasks', label: 'Overdue' },
      { key: 'dueSoonTasks', label: 'Due Soon' },
      { key: 'blockedTasks', label: 'Blocked' },
      { key: 'completionRate', label: 'Completion %' }
    ];

    function kpiTarget(key) {
      var staff = KSL.isStaffLike();
      if (key === 'overdueTasks') {
        return staff
          ? { page: 'mytasks', query: 'view=overdue', hint: 'Open my overdue tasks' }
          : { page: 'monitoring', query: 'view=overdue', hint: 'Open overdue monitoring' };
      }
      if (key === 'dueSoonTasks') {
        return staff
          ? { page: 'mytasks', query: 'view=duesoon', hint: 'Open tasks due soon' }
          : { page: 'monitoring', query: 'view=duesoon', hint: 'Open due-soon monitoring' };
      }
      if (key === 'blockedTasks') {
        return staff
          ? { page: 'mytasks', query: 'view=blocked', hint: 'Open my blocked tasks' }
          : { page: 'monitoring', query: 'view=blocked', hint: 'Open blocked tasks' };
      }
      if (key === 'inProgressTasks') {
        return staff
          ? { page: 'mytasks', query: 'view=inprogress', hint: 'Open my in-progress tasks' }
          : { page: 'monitoring', query: 'view=inprogress', hint: 'Open in-progress work' };
      }
      if (key === 'completedTasks') {
        return staff
          ? { page: 'mytasks', hint: 'Open my tasks' }
          : { page: 'tasks', query: 'status=Completed', hint: 'Open completed tasks' };
      }
      if (key === 'totalTasks' || key === 'assignedTasks') {
        return staff
          ? { page: 'mytasks', hint: 'Open my tasks' }
          : { page: 'tasks', hint: 'Open the task list' };
      }
      return null;
    }

    function filters() {
      return {
        startDate: document.getElementById('dashboardStartInput').value,
        endDate: document.getElementById('dashboardEndInput').value,
        department: document.getElementById('dashboardDepartmentInput').value.trim(),
        supervisor: document.getElementById('dashboardSupervisorInput').value.trim()
      };
    }

    function chartTone(label) {
      var key = String(label || '').toLowerCase();
      if (key.indexOf('overdue') !== -1 || key === 'blocked' || key === 'critical') {
        return 'is-danger';
      }
      if (key === 'due soon' || key === 'high' || key === 'delayed') {
        return 'is-warning';
      }
      if (key === 'completed' || key === 'low') {
        return 'is-success';
      }
      if (key === 'in progress' || key === 'medium' || key === 'assigned') {
        return 'is-info';
      }
      return '';
    }

    function chartEntries(map) {
      return Object.keys(map || {})
        .map(function (key) {
          return { key: key, value: Number(map[key] || 0) };
        })
        .filter(function (item) {
          return item.value > 0;
        })
        .sort(function (a, b) {
          return b.value - a.value;
        });
    }

    function renderBarChart(title, map, note) {
      var entries = chartEntries(map);
      var total = entries.reduce(function (sum, item) {
        return sum + item.value;
      }, 0);
      if (!entries.length) {
        return (
          '<div class="card chart-card"><h3>' +
          KSL.escapeHtml(title) +
          '</h3><p class="page-note">' +
          KSL.escapeHtml(note || 'No matching data found.') +
          '</p></div>'
        );
      }
      var max = entries[0].value || 1;
      return (
        '<div class="card chart-card"><h3>' +
        KSL.escapeHtml(title) +
        '</h3><p class="chart-total">' +
        total +
        ' tasks</p>' +
        entries.map(function (item) {
          var width = Math.round((item.value / max) * 100);
          var share = total ? Math.round((item.value / total) * 100) : 0;
          return (
            '<div class="chart-row"><span title="' +
            KSL.escapeHtml(item.key) +
            '">' +
            KSL.escapeHtml(item.key) +
            '</span><div class="chart-bar"><span class="' +
            chartTone(item.key) +
            '" data-width="' +
            width +
            '"></span></div><strong>' +
            item.value +
            '<em>' +
            share +
            '%</em></strong></div>'
          );
        }).join('') +
        '</div>'
      );
    }

    function animateCharts() {
      document.querySelectorAll('#dashboardCharts .chart-bar > span[data-width]').forEach(function (bar) {
        bar.style.width = '0%';
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            bar.style.width = String(bar.getAttribute('data-width') || 0) + '%';
          });
        });
      });
    }

    function render(summary) {
      document.getElementById('dashboardKpiGrid').innerHTML = KPI_CONFIG.map(function (item) {
        var target = kpiTarget(item.key);
        var hint = target ? '<span class="kpi-hint">' + KSL.escapeHtml(target.hint) + '</span>' : '';
        var attrs = target
          ? ' class="card kpi-card is-link" type="button" data-kpi="' +
            KSL.escapeHtml(item.key) +
            '"'
          : ' class="card kpi-card"';
        var tag = target ? 'button' : 'div';
        return (
          '<' +
          tag +
          attrs +
          '><h3>' +
          KSL.escapeHtml(item.label) +
          '</h3><strong>' +
          Number(summary[item.key] || 0) +
          '</strong>' +
          hint +
          '</' +
          tag +
          '>'
        );
      }).join('');
      var charts = summary.charts || {};
      var workload = {
        Completed: Number(summary.completedTasks || 0),
        'In Progress': Number(summary.inProgressTasks || 0),
        Overdue: Number(summary.overdueTasks || 0),
        Blocked: Number(summary.blockedTasks || 0),
        'Due Soon': Number(summary.dueSoonTasks || 0)
      };
      document.getElementById('dashboardCharts').innerHTML =
        renderBarChart('Live workload', workload, 'No active work in this filter.') +
        renderBarChart('Status mix', charts.status, 'No task statuses in this filter.') +
        renderBarChart('Priority mix', charts.priority, 'No priorities in this filter.') +
        renderBarChart('Department mix', charts.department, 'No departments in this filter.') +
        renderBarChart('Overdue by department', charts.overdueByDepartment, 'No overdue tasks in this filter.');
      animateCharts();
    }

    function loadDashboard() {
      KSL.call('getDashboardSummary', KSL.getSessionToken(), filters())
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load dashboard.');
          }
          render(response.data || {});
        })
        .catch(function (error) {
          render({
            totalTasks: 0,
            assignedTasks: 0,
            inProgressTasks: 0,
            completedTasks: 0,
            overdueTasks: 0,
            dueSoonTasks: 0,
            blockedTasks: 0,
            completionRate: 0,
            charts: {}
          });
          KSL.showToast(error.message || 'Failed to load dashboard.', 'error');
        });
    }

    function exportFile(format) {
      var options = filters();
      options.format = format;
      KSL.callBusy('exportDashboard', KSL.getSessionToken(), options).then(function (response) {
        if (!response || !response.success) throw new Error((response && response.message) || 'Export failed.');
        KSL.previewOrDownloadFile(response.data);
        KSL.showToast('Report generated.', 'success');
      }).catch(function (error) {
        KSL.showToast(error.message || 'Export failed.', 'error');
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager', 'Supervisor', 'Team Leader', 'Employee', 'Staff'], function (bootstrap) {
        var role = bootstrap && bootstrap.user && bootstrap.user.role;
        if (KSL.isStaffLike(role)) {
          document.getElementById('dashboardDepartmentInput').classList.add('hidden');
          document.getElementById('dashboardSupervisorInput').classList.add('hidden');
        }
        if (KSL.canSearchStaffWork(role)) {
          document.getElementById('staffWorkCard').classList.remove('hidden');
          KSL.bindStaffWorkSearch({
            inputId: 'dashboardStaffSearchInput',
            buttonId: 'dashboardStaffSearchButton',
            resultsId: 'dashboardStaffWorkResults'
          });
        }
        loadDashboard();
        document.getElementById('dashboardKpiGrid').addEventListener('click', function (event) {
          var card = event.target.closest('[data-kpi]');
          if (!card) {
            return;
          }
          var target = kpiTarget(card.getAttribute('data-kpi'));
          if (!target) {
            return;
          }
          KSL.navigate(target.page, target.query || '');
        });
        document.getElementById('refreshDashboardButton').addEventListener('click', loadDashboard);
        document.getElementById('exportDashboardButton').addEventListener('click', function () { exportFile('csv'); });
        document.getElementById('exportDashboardPdfButton').addEventListener('click', function () { exportFile('pdf'); });
        ['dashboardStartInput', 'dashboardEndInput'].forEach(function (id) {
          document.getElementById(id).addEventListener('change', loadDashboard);
        });
        ['dashboardDepartmentInput', 'dashboardSupervisorInput'].forEach(function (id) {
          document.getElementById(id).addEventListener('input', KSL.debounce(loadDashboard, 400));
        });
      });
    });
  })();
</script>
