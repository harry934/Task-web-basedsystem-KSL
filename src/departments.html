<section class="page-shell">
  <div class="page-header">
    <h1>Departments</h1>
    <p>
      These are department records used for tasks and staff. Names listed under Settings → Dimensions are dropdown
      labels until you import or create them here.
    </p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="newDepartmentButton" class="btn btn-primary" type="button">
          <i class="fa-solid fa-plus"></i>
          New Department
        </button>
        <button id="departmentsRefreshButton" class="btn btn-outline" type="button">Refresh</button>
        <button id="departmentsImportButton" class="btn btn-outline" type="button">Import from Dimensions</button>
        <button id="departmentsClearButton" class="btn btn-outline" type="button">Clear</button>
      </div>
      <div class="toolbar-right">
        <input id="departmentsSearchInput" class="input" type="search" placeholder="Search departments..." style="min-width: 240px;">
        <input id="departmentsHead" class="input" type="search" placeholder="Department head" style="min-width: 160px;">
        <select id="departmentsStatusFilter" class="select" style="min-width: 150px;">
          <option value="">All statuses</option>
          <option value="Active">Active</option>
          <option value="Archived">Archived</option>
        </select>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Department ID</th>
          <th>Name</th>
          <th>Head</th>
          <th>Status</th>
          <th>Updated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="departmentsTableBody">
        <tr>
          <td colspan="6" class="empty-state">Loading departments...</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div id="departmentsPagination" class="pagination"></div>
</section>

<div id="departmentModalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="departmentModalTitle">Create Department</h3>
      <button class="btn btn-outline" type="button" data-close-modal="departmentModalBackdrop">
        <i class="fa-solid fa-xmark"></i>
        Close
      </button>
    </div>

    <form id="departmentForm">
      <input id="departmentIdInput" type="hidden">
      <div class="form-grid">
        <div class="field">
          <label for="departmentNameInput">Department Name</label>
          <input id="departmentNameInput" class="input" type="text" required>
        </div>
        <div class="field">
          <label for="departmentHeadInput">Department Head</label>
          <input id="departmentHeadInput" class="input" type="text">
        </div>
        <div class="field full">
          <label for="departmentDescriptionInput">Description</label>
          <textarea id="departmentDescriptionInput" class="textarea"></textarea>
        </div>
        <div class="field">
          <label for="departmentStatusInput">Status</label>
          <select id="departmentStatusInput" class="select">
            <option value="Active">Active</option>
            <option value="Archived">Archived</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" type="button" data-close-modal="departmentModalBackdrop">Cancel</button>
        <button class="btn btn-primary" type="submit">
          <i class="fa-solid fa-floppy-disk"></i>
          Save Department
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    var state = {
      departments: [],
      page: 1,
      pages: 1,
      pageSize: 25
    };

    function getFilters() {
      return {
        query: document.getElementById('departmentsSearchInput').value.trim(),
        departmentHead: document.getElementById('departmentsHead').value.trim(),
        status: document.getElementById('departmentsStatusFilter').value,
        page: state.page,
        pageSize: state.pageSize
      };
    }

    function renderDepartments() {
      var body = document.getElementById('departmentsTableBody');
      if (!body) {
        return;
      }
      if (!state.departments.length) {
        body.innerHTML = '<tr><td colspan="6" class="empty-state"><i class="fa-solid fa-building"></i><p>No department records yet. Import names from Settings → Dimensions or click New Department.</p></td></tr>';
        return;
      }

      body.innerHTML = state.departments
        .map(function (department) {
          return (
            '<tr>' +
            '<td>' +
            KSL.escapeHtml(department.departmentId) +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(department.departmentName) +
            '</td>' +
            '<td>' +
            KSL.escapeHtml(department.departmentHead || '-') +
            '</td>' +
            '<td><span class="status-badge ' +
            KSL.statusClass(department.status) +
            '">' +
            KSL.escapeHtml(department.status || '-') +
            '</span></td>' +
            '<td>' +
            KSL.escapeHtml(KSL.formatDate(department.updatedDate) || '-') +
            '</td>' +
            '<td><div class="toolbar-left">' +
            '<button class="btn btn-outline" type="button" data-action="edit" data-id="' +
            KSL.escapeHtml(department.departmentId) +
            '">Edit</button>' +
            '<button class="btn btn-danger" type="button" data-action="archive" data-id="' +
            KSL.escapeHtml(department.departmentId) +
            '">Archive</button>' +
            (KSL.isAdministrator()
              ? '<button class="btn btn-danger" type="button" data-action="delete" data-id="' +
                KSL.escapeHtml(department.departmentId) +
                '" data-name="' +
                KSL.escapeHtml(department.departmentName || department.departmentId) +
                '">Delete</button>'
              : '') +
            '</div></td>' +
            '</tr>'
          );
        })
        .join('');
    }

    function renderPagination() {
      var pagination = document.getElementById('departmentsPagination');
      if (!pagination) {
        return;
      }
      pagination.innerHTML =
        '<button type="button" id="departmentsPrevPage" ' +
        (state.page <= 1 ? 'disabled' : '') +
        '>Previous</button>' +
        '<button type="button" disabled>Page ' +
        state.page +
        ' of ' +
        state.pages +
        '</button>' +
        '<button type="button" id="departmentsNextPage" ' +
        (state.page >= state.pages ? 'disabled' : '') +
        '>Next</button>';

      var prev = document.getElementById('departmentsPrevPage');
      var next = document.getElementById('departmentsNextPage');
      if (prev) {
        prev.addEventListener('click', function () {
          state.page -= 1;
          loadDepartments();
        });
      }
      if (next) {
        next.addEventListener('click', function () {
          state.page += 1;
          loadDepartments();
        });
      }
    }

    function loadDepartments(retryCount) {
      var attempts = Number(retryCount || 0);
      var filters = getFilters();
      KSL.replaceFiltersInUrl({
        query: filters.query,
        departmentHead: filters.departmentHead,
        status: filters.status,
        page: filters.page > 1 ? filters.page : ''
      });
      KSL.call('listDepartments', KSL.getSessionToken(), filters)
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load departments.');
          }
          var payload = response.data || {};
          state.departments = payload.items || [];
          var pagination = payload.pagination || {};
          state.page = Number(pagination.page || 1);
          state.pages = Number(pagination.pages || 1);
          renderDepartments();
          renderPagination();
        })
        .catch(function (error) {
          if (attempts < 1) {
            window.setTimeout(function () {
              loadDepartments(attempts + 1);
            }, 800);
            return;
          }
          KSL.showToast(error.message || 'Failed to load departments.', 'error');
        });
    }

    function resetDepartmentForm() {
      document.getElementById('departmentForm').reset();
      document.getElementById('departmentIdInput').value = '';
      document.getElementById('departmentStatusInput').value = 'Active';
      document.getElementById('departmentModalTitle').textContent = 'Create Department';
    }

    function openCreateModal() {
      resetDepartmentForm();
      KSL.openModal('departmentModalBackdrop');
    }

    function openEditModal(departmentId) {
      var department = state.departments.find(function (item) {
        return item.departmentId === departmentId;
      });
      if (!department) {
        KSL.showToast('Department not found.', 'error');
        return;
      }

      document.getElementById('departmentModalTitle').textContent = 'Edit Department';
      document.getElementById('departmentIdInput').value = department.departmentId;
      document.getElementById('departmentNameInput').value = department.departmentName || '';
      document.getElementById('departmentHeadInput').value = department.departmentHead || '';
      document.getElementById('departmentDescriptionInput').value =
        department.departmentDescription || '';
      document.getElementById('departmentStatusInput').value = department.status || 'Active';
      KSL.openModal('departmentModalBackdrop');
    }

    function submitDepartment(event) {
      event.preventDefault();
      var departmentId = document.getElementById('departmentIdInput').value.trim();
      var payload = {
        departmentId: departmentId,
        departmentName: document.getElementById('departmentNameInput').value.trim(),
        departmentHead: document.getElementById('departmentHeadInput').value.trim(),
        departmentDescription: document.getElementById('departmentDescriptionInput').value.trim(),
        status: document.getElementById('departmentStatusInput').value
      };

      var serverFunction = departmentId ? 'updateDepartment' : 'createDepartment';
      KSL.call(serverFunction, KSL.getSessionToken(), payload)
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Unable to save department.');
          }
          KSL.showToast('Department saved successfully.', 'success');
          KSL.closeModal('departmentModalBackdrop');
          var saved = response.data && response.data.department;
          if (saved && !departmentId) {
            state.departments = [saved].concat(state.departments || []);
            renderDepartments();
          }
          state.page = 1;
          window.setTimeout(function () {
            loadDepartments();
          }, 400);
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Unable to save department.', 'error');
        });
    }

    function archiveDepartment(departmentId) {
      KSL.confirmModal({
        title: 'Archive department',
        message: 'Archive this department? You can restore it later by editing status.'
      }).then(function (ok) {
        if (!ok) {
          return;
        }
        KSL.call('archiveDepartment', KSL.getSessionToken(), {
          departmentId: departmentId
        })
          .then(function (response) {
            if (!response || !response.success) {
              throw new Error((response && response.message) || 'Unable to archive department.');
            }
            KSL.showToast('Department archived.', 'success');
            loadDepartments();
          })
          .catch(function (error) {
            KSL.showToast(error.message || 'Unable to archive department.', 'error');
          });
      });
    }

    function bindEvents() {
      document.getElementById('newDepartmentButton').addEventListener('click', openCreateModal);
      document.getElementById('departmentsRefreshButton').addEventListener('click', function () {
        state.page = 1;
        loadDepartments();
      });
      document.getElementById('departmentsImportButton').addEventListener('click', function () {
        KSL.call('importDepartmentsFromDimensions', KSL.getSessionToken())
          .then(function (response) {
            if (!response || !response.success) {
              throw new Error((response && response.message) || 'Import failed.');
            }
            KSL.showToast(response.message || 'Imported from Dimensions.', 'success');
            loadDepartments();
          })
          .catch(function (error) {
            KSL.showToast(error.message || 'Import failed.', 'error');
          });
      });
      document.getElementById('departmentsSearchInput').addEventListener(
        'input',
        KSL.debounce(function () {
          state.page = 1;
          loadDepartments();
        }, 450)
      );
      document.getElementById('departmentsStatusFilter').addEventListener('change', function () {
        state.page = 1;
        loadDepartments();
      });
      document.getElementById('departmentsHead').addEventListener(
        'input',
        KSL.debounce(function () {
          state.page = 1;
          loadDepartments();
        }, 400)
      );
      document.getElementById('departmentsClearButton').addEventListener('click', function () {
        document.getElementById('departmentsSearchInput').value = '';
        document.getElementById('departmentsHead').value = '';
        document.getElementById('departmentsStatusFilter').value = '';
        state.page = 1;
        loadDepartments();
      });
      document.getElementById('departmentForm').addEventListener('submit', submitDepartment);

      document.getElementById('departmentsTableBody').addEventListener('click', function (event) {
        var button = event.target.closest('button[data-action]');
        if (!button) {
          return;
        }
        var action = button.dataset.action;
        var id = button.dataset.id || '';
        if (action === 'edit') {
          openEditModal(id);
        } else if (action === 'archive') {
          archiveDepartment(id);
        } else if (action === 'delete') {
          KSL.confirmDelete(button.dataset.name || id).then(function (ok) {
            if (!ok) {
              return;
            }
            var removed = state.departments.filter(function (item) {
              return item.departmentId === id;
            })[0];
            state.departments = state.departments.filter(function (item) {
              return item.departmentId !== id;
            });
            renderDepartments();
            KSL.scheduleAction({
              message: 'Department will be deleted. Undo?',
              delayMs: 5000,
              run: function () {
                return KSL.call('deleteDepartment', KSL.getSessionToken(), { departmentId: id }).then(function (response) {
                  if (!response || !response.success) {
                    throw new Error((response && response.message) || 'Unable to delete department.');
                  }
                  KSL.showToast('Department deleted.', 'success');
                });
              },
              onUndo: function () {
                if (removed) {
                  state.departments.unshift(removed);
                  renderDepartments();
                }
                KSL.showToast('Delete cancelled.', 'info');
              }
            });
          });
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager'], function () {
        bindEvents();
        KSL.applyFiltersFromUrl({
          query: 'departmentsSearchInput',
          departmentHead: 'departmentsHead',
          status: 'departmentsStatusFilter'
        });
        if (KSL.readQueryParam('page')) {
          state.page = Number(KSL.readQueryParam('page')) || 1;
        }
        loadDepartments();
      });
    });
  })();
</script>
