<section class="page-shell">
  <div class="page-header">
    <h1>Staff Deployment</h1>
    <p>
      Daily duty roster by section and location. Section Heads draft and submit;
      RSM (Manager) approves or returns; Admin finalizes.
    </p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="deploymentNewButton" class="btn btn-primary" type="button">New draft</button>
        <button id="deploymentRefreshButton" class="btn btn-outline" type="button">Refresh</button>
      </div>
      <div class="toolbar-right">
        <input id="deploymentStartInput" class="input" type="date" title="From date">
        <input id="deploymentEndInput" class="input" type="date" title="To date">
        <select id="deploymentStatusFilter" class="select">
          <option value="">All statuses</option>
          <option value="Draft">Draft</option>
          <option value="Submitted">Submitted</option>
          <option value="Returned">Returned</option>
          <option value="Approved">Approved</option>
          <option value="Finalized">Finalized</option>
        </select>
        <input id="deploymentSearchInput" class="input" type="search" placeholder="Search batches..." style="min-width: 160px;">
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Department</th>
          <th>Location</th>
          <th>Status</th>
          <th>Submitted by</th>
          <th>Updated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="deploymentTableBody">
        <tr><td colspan="7" class="empty-state">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  <div id="deploymentPagination" class="pagination"></div>
</section>

<div id="deploymentEditorBackdrop" class="modal-backdrop hidden">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3 id="deploymentEditorTitle">Deployment draft</h3>
      <button class="btn btn-outline" type="button" data-close-modal="deploymentEditorBackdrop">Close</button>
    </div>
    <form id="deploymentEditorForm">
      <input type="hidden" id="deploymentBatchIdInput">
      <div class="form-grid">
        <div class="field">
          <label for="deploymentDateInput">Operational date</label>
          <input id="deploymentDateInput" class="input" type="date" required>
        </div>
        <div class="field">
          <label for="deploymentDepartmentInput">Department / section</label>
          <select id="deploymentDepartmentInput" class="select" data-searchable="true" required></select>
        </div>
        <div class="field">
          <label for="deploymentSectionInput">Section (optional)</label>
          <select id="deploymentSectionInput" class="select" data-searchable="true"></select>
        </div>
        <div class="field">
          <label for="deploymentLocationInput">Location</label>
          <select id="deploymentLocationInput" class="select" data-searchable="true" required></select>
        </div>
        <div class="field full">
          <label>Staff entries</label>
          <p class="page-note">Search staff by name. Non–On Duty statuses require a note.</p>
          <div id="deploymentEntriesList" class="deployment-entries"></div>
          <button id="deploymentAddEntryButton" class="btn btn-outline" type="button">Add staff row</button>
        </div>
        <div id="deploymentReviewPanel" class="field full hidden">
          <label>Approval actions</label>
          <div class="form-grid">
            <div class="field full">
              <label for="deploymentReviewCommentInput">Comment</label>
              <textarea id="deploymentReviewCommentInput" class="textarea" rows="2"></textarea>
            </div>
            <div class="field full">
              <label for="deploymentApprovalFileInput">Approval evidence (optional PDF/image)</label>
              <input id="deploymentApprovalFileInput" class="input" type="file" accept=".pdf,image/*">
            </div>
          </div>
        </div>
        <div id="deploymentStatusNote" class="field full">
          <p class="page-note" id="deploymentStatusNoteText"></p>
        </div>
      </div>
      <div class="modal-footer">
        <button id="deploymentSaveButton" class="btn btn-outline" type="submit">Save draft</button>
        <button id="deploymentSubmitButton" class="btn btn-primary" type="button">Submit to RSM</button>
        <button id="deploymentApproveButton" class="btn btn-primary hidden" type="button">Approve</button>
        <button id="deploymentReturnButton" class="btn btn-outline hidden" type="button">Return</button>
        <button id="deploymentFinalizeButton" class="btn btn-primary hidden" type="button">Finalize</button>
        <button id="deploymentExportButton" class="btn btn-outline" type="button">Download PDF</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    var state = {
      items: [],
      page: 1,
      pages: 1,
      pageSize: 25,
      meta: null,
      capabilities: {},
      currentBatch: null,
      currentEntries: [],
      entryRows: []
    };

    function filters() {
      return {
        startDate: document.getElementById('deploymentStartInput').value,
        endDate: document.getElementById('deploymentEndInput').value,
        status: document.getElementById('deploymentStatusFilter').value,
        query: document.getElementById('deploymentSearchInput').value.trim(),
        page: state.page,
        pageSize: state.pageSize
      };
    }

    function fillSelect(id, values, placeholder, selectedValue) {
      var select = document.getElementById(id);
      if (!select) return;
      var list = (values || []).slice();
      var selected = selectedValue || '';
      if (selected && list.indexOf(selected) === -1) {
        list.unshift(selected);
      }
      select.innerHTML =
        '<option value="">' +
        KSL.escapeHtml(placeholder || 'Select') +
        '</option>' +
        list
          .map(function (value) {
            var selectedAttr = value === selected ? ' selected' : '';
            return (
              '<option value="' +
              KSL.escapeHtml(value) +
              '"' +
              selectedAttr +
              '>' +
              KSL.escapeHtml(value) +
              '</option>'
            );
          })
          .join('');
      KSL.enhanceSearchableSelect(select);
    }

    function loadMeta() {
      return KSL.call('getDeploymentFormMetadata', KSL.getSessionToken()).then(function (response) {
        if (!response || !response.success) {
          throw new Error((response && response.message) || 'Failed to load deployment options.');
        }
        state.meta = response.data || {};
        state.capabilities = state.meta.capabilities || {};
        var scope = state.meta.scope || {};
        fillSelect('deploymentDepartmentInput', state.meta.departments || [], 'Select department', scope.department || '');
        fillSelect('deploymentSectionInput', state.meta.sections || [], 'Select section', scope.section || '');
        fillSelect('deploymentLocationInput', state.meta.workLocations || [], 'Select location', scope.location || '');
        document.getElementById('deploymentNewButton').classList.toggle('hidden', !state.capabilities.canEditDraft);
      });
    }

    function load() {
      KSL.call('listDeploymentBatches', KSL.getSessionToken(), filters()).then(function (response) {
        if (!response || !response.success) {
          throw new Error((response && response.message) || 'Failed to load deployments.');
        }
        var payload = response.data || {};
        state.items = payload.items || [];
        state.page = Number((payload.pagination || {}).page || 1);
        state.pages = Number((payload.pagination || {}).pages || 1);
        var body = document.getElementById('deploymentTableBody');
        if (!state.items.length) {
          body.innerHTML = '<tr><td colspan="7" class="empty-state">No matching deployment batches.</td></tr>';
        } else {
          body.innerHTML = state.items
            .map(function (item) {
              return (
                '<tr>' +
                '<td>' +
                KSL.escapeHtml(KSL.formatDate(item.operationalDate) || '-') +
                '</td>' +
                '<td>' +
                KSL.escapeHtml(item.department || '-') +
                '</td>' +
                '<td>' +
                KSL.escapeHtml(item.location || '-') +
                '</td>' +
                '<td><span class="badge">' +
                KSL.escapeHtml(item.workflowStatus || '-') +
                '</span></td>' +
                '<td>' +
                KSL.escapeHtml(item.submittedByName || '-') +
                '</td>' +
                '<td>' +
                KSL.escapeHtml(KSL.formatDate(item.updatedDate) || '-') +
                '</td>' +
                '<td><button class="btn btn-outline" type="button" data-open-batch="' +
                KSL.escapeHtml(item.batchId) +
                '">Open</button></td>' +
                '</tr>'
              );
            })
            .join('');
        }
        KSL.renderPager('deploymentPagination', state, load);
      }).catch(function (error) {
        KSL.showToast(error.message || 'Failed to load deployments.', 'error');
      });
    }

    function renderEntryRows(editable) {
      var host = document.getElementById('deploymentEntriesList');
      var dutyStatuses = (state.meta && state.meta.dutyStatuses) || ['On Duty', 'Off Duty', 'On Leave', 'Absent', 'Other'];
      var staff = (state.meta && state.meta.staff) || [];
      if (!state.entryRows.length) {
        host.innerHTML = '<p class="page-note">No staff rows yet.</p>';
        return;
      }
      host.innerHTML = state.entryRows
        .map(function (row, index) {
          var staffOptions =
            '<option value="">Search / select staff</option>' +
            staff
              .map(function (person) {
                var selected = person.employeeId === row.employeeId ? ' selected' : '';
                var label = person.fullName + (person.department ? ' · ' + person.department : '');
                return (
                  '<option value="' +
                  KSL.escapeHtml(person.employeeId) +
                  '"' +
                  selected +
                  '>' +
                  KSL.escapeHtml(label) +
                  '</option>'
                );
              })
              .join('');
          var dutyOptions = dutyStatuses
            .map(function (status) {
              var selected = status === row.dutyStatus ? ' selected' : '';
              return (
                '<option value="' +
                KSL.escapeHtml(status) +
                '"' +
                selected +
                '>' +
                KSL.escapeHtml(status) +
                '</option>'
              );
            })
            .join('');
          var disabled = editable ? '' : ' disabled';
          return (
            '<div class="deployment-entry-row" data-index="' +
            index +
            '">' +
            '<div class="field"><label>Staff</label><select class="select entry-staff" data-searchable="true"' +
            disabled +
            '>' +
            staffOptions +
            '</select></div>' +
            '<div class="field"><label>Duty status</label><select class="select entry-duty"' +
            disabled +
            '>' +
            dutyOptions +
            '</select></div>' +
            '<div class="field"><label>Destination / assignment</label><input class="input entry-destination" type="text" value="' +
            KSL.escapeHtml(row.destination || '') +
            '"' +
            disabled +
            '></div>' +
            '<div class="field"><label>Notes</label><input class="input entry-notes" type="text" value="' +
            KSL.escapeHtml(row.notes || '') +
            '"' +
            disabled +
            '></div>' +
            (editable
              ? '<button class="btn btn-outline entry-remove" type="button" data-remove="' +
                index +
                '">Remove</button>'
              : '') +
            '</div>'
          );
        })
        .join('');
      host.querySelectorAll('select[data-searchable="true"]').forEach(function (select) {
        KSL.enhanceSearchableSelect(select);
      });
    }

    function collectEntriesFromDom() {
      var rows = [];
      document.querySelectorAll('#deploymentEntriesList .deployment-entry-row').forEach(function (row) {
        rows.push({
          employeeId: row.querySelector('.entry-staff').value,
          dutyStatus: row.querySelector('.entry-duty').value,
          destination: row.querySelector('.entry-destination').value.trim(),
          notes: row.querySelector('.entry-notes').value.trim()
        });
      });
      state.entryRows = rows;
      return rows;
    }

    function setEditorMode(batch) {
      var status = String((batch && batch.workflowStatus) || 'Draft').toLowerCase();
      var caps = state.capabilities || {};
      var editable = caps.canEditDraft && (status === 'draft' || status === 'returned' || !batch);
      document.getElementById('deploymentSaveButton').classList.toggle('hidden', !editable);
      document.getElementById('deploymentSubmitButton').classList.toggle('hidden', !(caps.canSubmit && editable && batch && batch.batchId));
      document.getElementById('deploymentAddEntryButton').classList.toggle('hidden', !editable);
      document.getElementById('deploymentDateInput').disabled = !editable;
      document.getElementById('deploymentDepartmentInput').disabled = !editable;
      document.getElementById('deploymentSectionInput').disabled = !editable;
      document.getElementById('deploymentLocationInput').disabled = !editable;

      var canReview = caps.canReview && status === 'submitted';
      var canFinalize = caps.canFinalize && status === 'approved';
      document.getElementById('deploymentReviewPanel').classList.toggle('hidden', !(canReview || canFinalize));
      document.getElementById('deploymentApproveButton').classList.toggle('hidden', !canReview);
      document.getElementById('deploymentReturnButton').classList.toggle('hidden', !canReview);
      document.getElementById('deploymentFinalizeButton').classList.toggle('hidden', !canFinalize);

      var note = 'Status: ' + ((batch && batch.workflowStatus) || 'Draft');
      if (batch && batch.rsmComment) note += ' · RSM: ' + batch.rsmComment;
      if (batch && batch.adminComment) note += ' · Admin: ' + batch.adminComment;
      if (batch && batch.approvalFileUrl) {
        note += ' · Evidence on file';
      }
      document.getElementById('deploymentStatusNoteText').textContent = note;
      renderEntryRows(editable);
    }

    function openNewDraft() {
      state.currentBatch = null;
      state.entryRows = [{ employeeId: '', dutyStatus: 'On Duty', destination: '', notes: '' }];
      document.getElementById('deploymentEditorTitle').textContent = 'New deployment draft';
      document.getElementById('deploymentBatchIdInput').value = '';
      document.getElementById('deploymentDateInput').value = new Date().toISOString().slice(0, 10);
      document.getElementById('deploymentReviewCommentInput').value = '';
      document.getElementById('deploymentApprovalFileInput').value = '';
      var scope = (state.meta && state.meta.scope) || {};
      fillSelect('deploymentDepartmentInput', state.meta.departments || [], 'Select department', scope.department || '');
      fillSelect('deploymentSectionInput', state.meta.sections || [], 'Select section', scope.section || '');
      fillSelect('deploymentLocationInput', state.meta.workLocations || [], 'Select location', scope.location || '');
      setEditorMode(null);
      KSL.openModal('deploymentEditorBackdrop');
    }

    function openBatch(batchId) {
      KSL.callBusy('getDeploymentBatch', KSL.getSessionToken(), batchId).then(function (response) {
        if (!response || !response.success) {
          throw new Error((response && response.message) || 'Failed to open batch.');
        }
        state.capabilities = (response.data && response.data.capabilities) || state.capabilities;
        state.currentBatch = response.data.batch;
        state.currentEntries = response.data.entries || [];
        state.entryRows = state.currentEntries.map(function (entry) {
          return {
            employeeId: entry.employeeId,
            dutyStatus: entry.dutyStatus || 'On Duty',
            destination: entry.destination || '',
            notes: entry.notes || ''
          };
        });
        if (!state.entryRows.length) {
          state.entryRows = [{ employeeId: '', dutyStatus: 'On Duty', destination: '', notes: '' }];
        }
        document.getElementById('deploymentEditorTitle').textContent = 'Deployment · ' + state.currentBatch.batchId;
        document.getElementById('deploymentBatchIdInput').value = state.currentBatch.batchId;
        document.getElementById('deploymentDateInput').value = String(state.currentBatch.operationalDate || '').slice(0, 10);
        fillSelect('deploymentDepartmentInput', state.meta.departments || [], 'Select department', state.currentBatch.department || '');
        fillSelect('deploymentSectionInput', state.meta.sections || [], 'Select section', state.currentBatch.section || '');
        fillSelect('deploymentLocationInput', state.meta.workLocations || [], 'Select location', state.currentBatch.location || '');
        document.getElementById('deploymentReviewCommentInput').value = '';
        document.getElementById('deploymentApprovalFileInput').value = '';
        setEditorMode(state.currentBatch);
        KSL.openModal('deploymentEditorBackdrop');
      }).catch(function (error) {
        KSL.showToast(error.message || 'Failed to open batch.', 'error');
      });
    }

    function readApprovalFile() {
      var input = document.getElementById('deploymentApprovalFileInput');
      var file = input && input.files && input.files[0];
      if (!file) {
        return Promise.resolve(null);
      }
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var result = String(reader.result || '');
          var base64 = result.indexOf(',') > -1 ? result.split(',')[1] : result;
          resolve({
            fileName: file.name,
            mimeType: file.type || '',
            base64: base64
          });
        };
        reader.onerror = function () {
          reject(new Error('Failed to read approval file.'));
        };
        reader.readAsDataURL(file);
      });
    }

    function saveDraft(event) {
      if (event) event.preventDefault();
      var entries = collectEntriesFromDom();
      var payload = {
        batchId: document.getElementById('deploymentBatchIdInput').value,
        operationalDate: document.getElementById('deploymentDateInput').value,
        department: document.getElementById('deploymentDepartmentInput').value,
        section: document.getElementById('deploymentSectionInput').value,
        location: document.getElementById('deploymentLocationInput').value,
        entries: entries
      };
      KSL.callBusy('saveDeploymentDraft', KSL.getSessionToken(), payload).then(function (response) {
        if (!response || !response.success) {
          throw new Error((response && response.message) || 'Save failed.');
        }
        KSL.showToast(response.message || 'Draft saved.', 'success');
        document.getElementById('deploymentBatchIdInput').value = response.data.batchId;
        load();
        openBatch(response.data.batchId);
      }).catch(function (error) {
        KSL.showToast(error.message || 'Save failed.', 'error');
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(
        ['Administrator', 'Manager', 'Supervisor', 'Team Leader', 'Employee', 'Staff'],
        function () {
          loadMeta()
            .then(load)
            .catch(function (error) {
              KSL.showToast(error.message || 'Failed to initialize deployment.', 'error');
            });

          document.getElementById('deploymentRefreshButton').addEventListener('click', load);
          document.getElementById('deploymentNewButton').addEventListener('click', openNewDraft);
          document.getElementById('deploymentEditorForm').addEventListener('submit', saveDraft);
          document.getElementById('deploymentAddEntryButton').addEventListener('click', function () {
            collectEntriesFromDom();
            state.entryRows.push({ employeeId: '', dutyStatus: 'On Duty', destination: '', notes: '' });
            setEditorMode(state.currentBatch);
          });
          document.getElementById('deploymentEntriesList').addEventListener('click', function (event) {
            var button = event.target.closest('[data-remove]');
            if (!button) return;
            collectEntriesFromDom();
            state.entryRows.splice(Number(button.getAttribute('data-remove')), 1);
            setEditorMode(state.currentBatch);
          });
          document.getElementById('deploymentTableBody').addEventListener('click', function (event) {
            var button = event.target.closest('[data-open-batch]');
            if (!button) return;
            openBatch(button.getAttribute('data-open-batch'));
          });
          document.getElementById('deploymentSubmitButton').addEventListener('click', function () {
            var batchId = document.getElementById('deploymentBatchIdInput').value;
            if (!batchId) {
              KSL.showToast('Save the draft first.', 'error');
              return;
            }
            KSL.callBusy('submitDeploymentBatch', KSL.getSessionToken(), batchId).then(function (response) {
              if (!response || !response.success) throw new Error((response && response.message) || 'Submit failed.');
              KSL.showToast(response.message || 'Submitted.', 'success');
              load();
              openBatch(batchId);
            }).catch(function (error) {
              KSL.showToast(error.message || 'Submit failed.', 'error');
            });
          });
          document.getElementById('deploymentApproveButton').addEventListener('click', function () {
            var batchId = document.getElementById('deploymentBatchIdInput').value;
            readApprovalFile().then(function (approvalFile) {
              return KSL.callBusy('reviewDeploymentBatch', KSL.getSessionToken(), {
                batchId: batchId,
                decision: 'approve',
                comment: document.getElementById('deploymentReviewCommentInput').value.trim(),
                approvalFile: approvalFile
              });
            }).then(function (response) {
              if (!response || !response.success) throw new Error((response && response.message) || 'Approve failed.');
              KSL.showToast(response.message || 'Approved.', 'success');
              load();
              openBatch(batchId);
            }).catch(function (error) {
              KSL.showToast(error.message || 'Approve failed.', 'error');
            });
          });
          document.getElementById('deploymentReturnButton').addEventListener('click', function () {
            var batchId = document.getElementById('deploymentBatchIdInput').value;
            KSL.callBusy('reviewDeploymentBatch', KSL.getSessionToken(), {
              batchId: batchId,
              decision: 'return',
              comment: document.getElementById('deploymentReviewCommentInput').value.trim()
            }).then(function (response) {
              if (!response || !response.success) throw new Error((response && response.message) || 'Return failed.');
              KSL.showToast(response.message || 'Returned.', 'success');
              load();
              openBatch(batchId);
            }).catch(function (error) {
              KSL.showToast(error.message || 'Return failed.', 'error');
            });
          });
          document.getElementById('deploymentFinalizeButton').addEventListener('click', function () {
            var batchId = document.getElementById('deploymentBatchIdInput').value;
            KSL.callBusy('finalizeDeploymentBatch', KSL.getSessionToken(), {
              batchId: batchId,
              comment: document.getElementById('deploymentReviewCommentInput').value.trim()
            }).then(function (response) {
              if (!response || !response.success) throw new Error((response && response.message) || 'Finalize failed.');
              KSL.showToast(response.message || 'Finalized.', 'success');
              load();
              openBatch(batchId);
            }).catch(function (error) {
              KSL.showToast(error.message || 'Finalize failed.', 'error');
            });
          });
          document.getElementById('deploymentExportButton').addEventListener('click', function () {
            var batchId = document.getElementById('deploymentBatchIdInput').value;
            if (!batchId) {
              KSL.showToast('Open a batch first.', 'error');
              return;
            }
            KSL.callBusy('exportDeploymentBatch', KSL.getSessionToken(), batchId, { format: 'pdf' }).then(function (response) {
              if (!response || !response.success) throw new Error((response && response.message) || 'Export failed.');
              KSL.previewOrDownloadFile(response.data);
              KSL.showToast('PDF ready — use Download if prompted.', 'success');
            }).catch(function (error) {
              KSL.showToast(error.message || 'Export failed.', 'error');
            });
          });
          ['deploymentStartInput', 'deploymentEndInput', 'deploymentStatusFilter'].forEach(function (id) {
            document.getElementById(id).addEventListener('change', function () {
              state.page = 1;
              load();
            });
          });
          document.getElementById('deploymentSearchInput').addEventListener(
            'input',
            KSL.debounce(function () {
              state.page = 1;
              load();
            }, 350)
          );
        }
      );
    });
  })();
</script>
