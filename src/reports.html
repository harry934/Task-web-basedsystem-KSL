<section class="page-shell">
  <div class="page-header">
    <h1>Reports</h1>
    <p>Generate operational and performance reports with preview, CSV export, and server-side PDF output.</p>
  </div>
  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="generateReportButton" class="btn btn-primary" type="button">Generate Report</button>
        <button id="exportReportCsvButton" class="btn btn-outline" type="button">Export</button>
        <button id="exportReportPdfButton" class="btn btn-outline" type="button">Export PDF</button>
      </div>
      <div class="toolbar-right">
        <select id="reportTypeInput" class="select" style="min-width: 220px;">
          <option>Task Register</option>
          <option>Outstanding Tasks</option>
          <option>Overdue Tasks</option>
          <option>Daily Progress</option>
          <option>Weekly Progress</option>
          <option>Monthly Progress</option>
          <option>Department Performance</option>
          <option>Supervisor/Team Performance</option>
          <option>Staff Performance</option>
          <option>Assignment Report</option>
          <option>Audit Summary</option>
        </select>
        <input id="reportStartInput" class="input" type="date">
        <input id="reportEndInput" class="input" type="date">
        <input id="reportDepartmentInput" class="input" type="search" placeholder="Department" style="min-width: 140px;">
        <input id="reportEmployeeInput" class="input" type="search" placeholder="Staff" style="min-width: 140px;">
      </div>
    </div>
  </div>
  <div class="card report-preview">
    <h3 id="reportPreviewTitle">Report preview</h3>
    <p id="reportPreviewNote" class="page-note">Select a report type and generate a preview.</p>
    <div class="table-wrap">
      <table>
        <thead id="reportHead"></thead>
        <tbody id="reportBody"><tr><td class="empty-state">No report generated yet.</td></tr></tbody>
      </table>
    </div>
  </div>
</section>
<script>
  (function () {
    var state = { headers: [], rows: [] };
    function payload() {
      return {
        reportType: document.getElementById('reportTypeInput').value,
        startDate: document.getElementById('reportStartInput').value,
        endDate: document.getElementById('reportEndInput').value,
        department: document.getElementById('reportDepartmentInput').value.trim(),
        employee: document.getElementById('reportEmployeeInput').value.trim()
      };
    }
    function render(data) {
      state.headers = data.headers || [];
      state.rows = data.rows || [];
      document.getElementById('reportPreviewTitle').textContent = data.title || data.reportType || 'Report preview';
      document.getElementById('reportPreviewNote').textContent = state.rows.length
        ? state.rows.length + ' row(s) in current preview.'
        : 'No matching data found.';
      document.getElementById('reportHead').innerHTML = state.headers.length
        ? '<tr>' + state.headers.map(function (header) { return '<th>' + KSL.escapeHtml(header) + '</th>'; }).join('') + '</tr>'
        : '';
      var body = document.getElementById('reportBody');
      if (!state.rows.length) {
        body.innerHTML = '<tr><td class="empty-state">No matching data found.</td></tr>';
        return;
      }
      body.innerHTML = state.rows.map(function (row) {
        return '<tr>' + row.map(function (cell) { return '<td>' + KSL.escapeHtml(String(cell == null ? '' : cell)) + '</td>'; }).join('') + '</tr>';
      }).join('');
    }
    function exportFile(format) {
      var request = payload();
      request.format = format;
      KSL.callBusy('exportReport', KSL.getSessionToken(), request).then(function (response) {
        if (!response || !response.success) throw new Error((response && response.message) || 'Export failed.');
        KSL.downloadFile(response.data);
        KSL.showToast('Report generated.', 'success');
      }).catch(function (error) { KSL.showToast(error.message || 'Export failed.', 'error'); });
    }
    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager', 'Supervisor'], function () {
        document.getElementById('generateReportButton').addEventListener('click', function () {
          KSL.callBusy('generateReport', KSL.getSessionToken(), payload()).then(function (response) {
            if (!response || !response.success) throw new Error((response && response.message) || 'Failed to generate report.');
            render(response.data || {});
            KSL.showToast('Report generated.', 'success');
          }).catch(function (error) { KSL.showToast(error.message || 'Failed to generate report.', 'error'); });
        });
        document.getElementById('exportReportCsvButton').addEventListener('click', function () { exportFile('csv'); });
        document.getElementById('exportReportPdfButton').addEventListener('click', function () { exportFile('pdf'); });
      });
    });
  })();
</script>
