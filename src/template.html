  <body
    class="<?= isLoginPage ? 'login-body' : 'shell-locked' ?>"

  >
    <div class="kenya-stripe" aria-hidden="true">
      <span class="stripe-black"></span>
      <span class="stripe-red"></span>
      <span class="stripe-green"></span>
    </div>
    <div id="appProgressBar" class="app-progress-bar hidden" aria-hidden="true"></div>

    <div id="appProcessingOverlay" class="processing-overlay hidden">
      <div class="processing-card">
        <div class="ksl-spinner" aria-hidden="true"></div>
        <p id="appProcessingMessage">Please wait...</p>
      </div>
    </div>

    <div id="appToastHost" class="toast-host"></div>

    <? if (!isLoginPage) { ?>
    <div id="accessGate" class="access-gate hidden">
      <div class="access-gate-inner">
        <h2 id="accessGateTitle">Access restricted</h2>
        <p id="accessGateMessage"></p>
        <button id="accessGateButton" class="btn btn-primary hidden" type="button">Sign in</button>
      </div>
    </div>
    <? } ?>

    <? if (isLoginPage) { ?>
      <main class="login-page-container">
        <?!= include(contentTemplate); ?>
      </main>
    <? } else { ?>
      <div class="app-shell">
        <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
        <aside class="app-sidebar" id="appSidebar">
          <div class="brand-block">
            <img class="brand-logo-img" alt="Kenya Shipyards Limited">
            <div class="brand-text">
              <h1 id="appTitleText">Kenya Shipyards Limited</h1>

            </div>
          </div>

          <nav class="sidebar-nav" id="sidebarNav"></nav>

          <div class="sidebar-footer">
            Ministry of Defence
          </div>
        </aside>

        <div class="app-main">
          <header class="app-topbar">
            <div class="topbar-left">
              <button id="sidebarToggle" class="icon-button sidebar-toggle" type="button" aria-label="Open menu">
                <i class="fa-solid fa-bars"></i>
              </button>
              <img class="topbar-logo" alt="Kenya Shipyards Limited">
              <div>
                <p class="topbar-kicker">Republic of Kenya</p>
                <h2><?= pageTitle ?></h2>
              </div>
            </div>
            <div class="topbar-right">
              <div class="notification-wrap">
                <button id="notificationButton" class="icon-button" type="button" title="Notifications" aria-expanded="false">
                  <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.1-1.6-5.6-4.5-6.3V4c0-.8-.7-1.5-1.5-1.5S10.5 3.2 10.5 4v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z"/>
                  </svg>

                    <strong>Notifications</strong>
                    <button id="notificationViewAll" class="btn btn-outline" type="button">View all</button>
                  </div>
                  <div id="notificationDropdownList" class="notification-dropdown-list">
                    <p class="page-note">No unread notifications.</p>
                  </div>
                </div>
              </div>
              <div class="user-chip">
                <img id="userAvatar" alt="User profile photo">

                  <span id="userRole">-</span>
                </div>
              </div>
              <button id="logoutButton" class="btn btn-outline" type="button">
                <i class="fa-solid fa-right-from-bracket"></i>
                Sign out
              </button>
            </div>
          </header>

          <main class="content-area">
            <?!= include(contentTemplate); ?>
          </main>
        </div>
      </div>
    <? } ?>

    <script>
      window.APP_TEMPLATE_STATE = {
        activePage: "<?= activePage ?>",
        scriptUrl: "<?= scriptUrl ?>",
        appTitle: "<?= appTitle ?>",
        navItems: <?!= JSON.stringify(navItems) ?>
      };
    </script>

    <div id="kslConfirmModal" class="modal-backdrop hidden">
      <div class="modal modal-narrow">
        <div class="modal-header">
          <h3 id="kslConfirmTitle">Confirm</h3>
          <button class="btn btn-outline" type="button" id="kslConfirmClose">Close</button>
        </div>
        <p id="kslConfirmMessage"></p>
        <div class="modal-footer">
          <button class="btn btn-outline" type="button" id="kslConfirmCancel">Cancel</button>
          <button class="btn btn-primary" type="button" id="kslConfirmOk">Confirm</button>
        </div>
      </div>
    </div>

    <div id="kslPromptModal" class="modal-backdrop hidden">
      <div class="modal modal-narrow">
        <div class="modal-header">
          <h3 id="kslPromptTitle">Enter a value</h3>
          <button class="btn btn-outline" type="button" id="kslPromptClose">Close</button>
        </div>
        <p id="kslPromptMessage" class="page-note"></p>
        <div class="field">
          <label id="kslPromptLabel" for="kslPromptInput">Value</label>
          <input id="kslPromptInput" class="input" type="text">
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" type="button" id="kslPromptCancel">Cancel</button>
          <button class="btn btn-primary" type="button" id="kslPromptOk">Continue</button>
        </div>
      </div>
    </div>

    <div id="kslPasswordModal" class="modal-backdrop hidden">

        <div class="modal-header">
          <h3>Set password</h3>
          <button class="btn btn-outline" type="button" id="kslPasswordClose">Close</button>
        </div>
        <form id="kslPasswordForm">
          <div class="field">
            <label for="kslPasswordUsername">Username</label>
            <input id="kslPasswordUsername" class="input" type="text" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="kslPasswordValue">New password</label>
            <input id="kslPasswordValue" class="input" type="password" autocomplete="new-password" required>
            <div id="kslPasswordHints" class="password-hints"></div>
          </div>
          <div class="field">
            <label for="kslPasswordConfirm">Confirm password</label>
            <input id="kslPasswordConfirm" class="input" type="password" autocomplete="new-password" required>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" type="button" id="kslPasswordCancel">Cancel</button>
            <button class="btn btn-primary" type="submit">Save password</button>
          </div>
        </form>
      </div>
    </div>

    <div id="kslPdfPreviewModal" class="modal-backdrop hidden">
      <div class="modal modal-wide">
        <div class="modal-header">
          <h3 id="kslPdfPreviewTitle">PDF preview</h3>
          <button class="btn btn-outline" type="button" id="kslPdfPreviewClose">Close</button>
        </div>
        <iframe id="kslPdfPreviewFrame" class="pdf-preview-frame" title="PDF preview"></iframe>
        <div class="modal-footer">
          <button class="btn btn-outline" type="button" id="kslPdfPreviewCloseFooter">Close</button>
          <button class="btn btn-primary" type="button" id="kslPdfPreviewDownload">Download</button>
        </div>
      </div>
    </div>

    <aside id="kslSidePanel" class="side-panel hidden" aria-hidden="true">

      </div>
