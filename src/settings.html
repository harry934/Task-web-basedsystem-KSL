<section class="page-shell">
  <div class="page-header">
    <h1>System Settings</h1>
    <p>Change the app title, dates, task rules, scoring, and dropdown lists.</p>
  </div>
  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="saveSettingsButton" class="btn btn-primary" type="button">Save Settings</button>
        <button id="dimensionsButton" class="btn btn-outline" type="button">Dimensions</button>
        <button id="backupSettingsButton" class="btn btn-outline" type="button">Backup</button>
        <button id="rebuildSettingsButton" class="btn btn-outline" type="button">Rebuild Config</button>
        <button id="refreshSettingsButton" class="btn btn-outline" type="button">Refresh</button>
      </div>
      <div class="toolbar-right">
        <input id="settingsSearchInput" class="input" type="search" placeholder="Search settings..." style="min-width: 220px;">
        <button id="settingsClearButton" class="btn btn-outline" type="button">Clear</button>
      </div>
    </div>
  </div>
  <div id="settingsGroups" class="settings-groups"></div>
</section>
<div id="dimensionsModalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>Dimensions</h3>
      <button class="btn btn-outline" type="button" data-close-modal="dimensionsModalBackdrop">Close</button>
    </div>
    <p id="dimensionListNote" class="page-note">Dropdown lists used across Staff, Tasks, and reports. Deactivate a value to hide it without deleting history.</p>
    <div class="form-grid">
      <div class="field">
        <label for="dimensionColumnInput">List</label>
        <select id="dimensionColumnInput" class="select"></select>
      </div>
      <div class="field">
        <label for="dimensionValueInput">New value</label>
        <input id="dimensionValueInput" class="input" type="text">
      </div>
    </div>
    <div class="modal-footer">
      <button id="addDimensionButton" class="btn btn-primary" type="button">Add value</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>List</th><th>Value</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="dimensionsTableBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
  (function () {
    var GROUP_ORDER = ['General', 'Tasks', 'Workflow', 'Performance', 'Display', 'Sign-in'];
    var state = { items: [], drafts: {} };

    function isTrue(value) {
      return String(value || '').toUpperCase() === 'TRUE' || String(value || '').toUpperCase() === 'YES';
    }

    function currentValue(item) {
      if (state.drafts[item.key] !== undefined) {
        return state.drafts[item.key];
      }
      return item.value;
    }

    function renderInput(item) {
      var type = String(item.dataType || '').toLowerCase();
      var value = currentValue(item);
      var disabled = item.editable ? '' : ' disabled';
      if (type === 'boolean') {
        return (
          '<select class="select" data-key="' +
          KSL.escapeHtml(item.key) +
          '"' +
          disabled +
          '>' +
          '<option value="TRUE"' +
          (isTrue(value) ? ' selected' : '') +
          '>Yes</option>' +
          '<option value="FALSE"' +
          (!isTrue(value) ? ' selected' : '') +
          '>No</option>' +
          '</select>'
        );
      }
      if (type === 'number' || type === 'percentage') {
        return (
          '<input class="input" type="number" data-key="' +
          KSL.escapeHtml(item.key) +
          '" value="' +
          KSL.escapeHtml(String(value == null ? '' : value)) +
          '"' +
          disabled +
          '>'
        );
      }
      if (type === 'date') {
        return (
          '<input class="input" type="date" data-key="' +
          KSL.escapeHtml(item.key) +
          '" value="' +
          KSL.escapeHtml(String(value == null ? '' : String(value).slice(0, 10))) +
          '"' +
          disabled +
          '>'
        );
      }
      return (
        '<input class="input" type="text" data-key="' +
        KSL.escapeHtml(item.key) +
        '" value="' +
        KSL.escapeHtml(String(value == null ? '' : value)) +
        '"' +
        disabled +
        '>'
      );
    }

    function groupedItems(items) {
      var groups = {};
      (items || []).forEach(function (item) {
        var name = item.displayGroup || item.group || 'Other';
        if (!groups[name]) {
          groups[name] = [];
        }
        groups[name].push(item);
      });
      var names = GROUP_ORDER.filter(function (name) {
        return groups[name] && groups[name].length;
      });
      Object.keys(groups).forEach(function (name) {
        if (names.indexOf(name) === -1) {
          names.push(name);
        }
      });
      return names.map(function (name) {
        return { name: name, items: groups[name] };
      });
    }

    function render() {
      var host = document.getElementById('settingsGroups');
      if (!state.items.length) {
        host.innerHTML = '<div class="card"><p class="empty-state">No matching data found.</p></div>';
        return;
      }
      host.innerHTML = groupedItems(state.items)
        .map(function (group) {
          return (
            '<div class="card settings-group"><h2>' +
            KSL.escapeHtml(group.name) +
            '</h2><div class="form-grid">' +
            group.items
              .map(function (item) {
                return (
                  '<div class="field' +
                  (String(item.dataType || '').toLowerCase() === 'text' ? ' full' : '') +
                  '"><label for="setting-' +
                  KSL.escapeHtml(item.key) +
                  '">' +
                  KSL.escapeHtml(item.label || item.description || item.key) +
                  '</label>' +
                  renderInput(item) +
                  (item.description && item.label !== item.description
                    ? '<span class="page-note">' + KSL.escapeHtml(item.description) + '</span>'
                    : '') +
                  '</div>'
                );
              })
              .join('') +
            '</div></div>'
          );
        })
        .join('');
    }

    function collectSettings() {
      var settings = [];
      var seen = {};
      document.querySelectorAll('#settingsGroups [data-key]').forEach(function (field) {
        var key = field.getAttribute('data-key');
        if (!key || seen[key]) {
          return;
        }
        seen[key] = true;
        settings.push({ key: key, value: field.value });
      });
      Object.keys(state.drafts).forEach(function (key) {
        if (!seen[key]) {
          settings.push({ key: key, value: state.drafts[key] });
        }
      });
      return settings;
    }

    function validateClient(settings) {
      var byKey = {};
      settings.forEach(function (item) {
        byKey[item.key] = item.value;
      });
      if (byKey.DEFAULT_PAGE_SIZE && Number(byKey.DEFAULT_PAGE_SIZE) < 1) {
        throw new Error('Rows per page must be at least 1.');
      }
      if (byKey.DUE_SOON_DAYS && Number(byKey.DUE_SOON_DAYS) < 0) {
        throw new Error('Due soon days cannot be negative.');
      }
      var weightKeys = ['WEIGHT_PRODUCTIVITY', 'WEIGHT_TIMELINESS', 'WEIGHT_QUALITY', 'WEIGHT_RELIABILITY'];
      var present = weightKeys.filter(function (key) {
        return byKey[key] !== undefined && byKey[key] !== '';
      });
      if (present.length === 4) {
        var sum = present.reduce(function (total, key) {
          return total + Number(byKey[key] || 0);
        }, 0);
        if (sum !== 100) {
          throw new Error('Performance weights must add up to 100. Current total: ' + sum + '.');
        }
      }
    }

    function load() {
      KSL.call('listSettingsAdmin', KSL.getSessionToken(), {
        query: document.getElementById('settingsSearchInput').value.trim(),
        page: 1,
        pageSize: 200
      })
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load settings.');
          }
          var payload = response.data || {};
          state.items = payload.items || [];
          render();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Failed to load settings.', 'error');
        });
    }

    function loadDimensions() {
      KSL.call('listDimensionsAdmin', KSL.getSessionToken())
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load dimensions.');
          }
          var payload = response.data || {};
          var select = document.getElementById('dimensionColumnInput');
          select.innerHTML = (payload.columns || [])
            .map(function (column) {
              return '<option value="' + KSL.escapeHtml(column) + '">' + KSL.escapeHtml(column) + '</option>';
            })
            .join('');
          var items = payload.items || [];
          document.getElementById('dimensionsTableBody').innerHTML = items.length
            ? items
                .map(function (item) {
                  return (
                    '<tr><td>' +
                    KSL.escapeHtml(item.column) +
                    '</td><td>' +
                    KSL.escapeHtml(item.value) +
                    '</td><td><span class="status-badge ' +
                    KSL.statusClass(item.status) +
                    '">' +
                    KSL.escapeHtml(item.status) +
                    '</span></td><td><button class="btn btn-outline" type="button" data-column="' +
                    KSL.escapeHtml(item.column) +
                    '" data-value="' +
                    KSL.escapeHtml(item.value) +
                    '" data-activate="' +
                    (item.status === 'Inactive' ? '1' : '0') +
                    '">' +
                    (item.status === 'Inactive' ? 'Activate' : 'Deactivate') +
                    '</button></td></tr>'
                  );
                })
                .join('')
            : '<tr><td colspan="4" class="empty-state">No matching data found.</td></tr>';
          updateDimensionNote();
          KSL.openModal('dimensionsModalBackdrop');
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Failed to load dimensions.', 'error');
        });
    }

    function updateDimensionNote() {
      var note = document.getElementById('dimensionListNote');
      var select = document.getElementById('dimensionColumnInput');
      if (!note || !select) {
        return;
      }
      if (select.value === 'Departments') {
        note.textContent =
          'These names are dropdown labels only. Open Departments and use Import from Dimensions (or New Department) to create records with ID and head.';
        return;
      }
      if (select.value === 'Teams') {
        note.textContent =
          'These names are dropdown labels only. Open Teams and use Import from Dimensions (or New Team) to create team records.';
        return;
      }
      note.textContent =
        'Dropdown lists used across Staff, Tasks, and reports. Deactivate a value to hide it without deleting history.';
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator'], function () {
        document.getElementById('refreshSettingsButton').addEventListener('click', load);
        document.getElementById('settingsSearchInput').addEventListener(
          'input',
          KSL.debounce(function () {
            load();
          }, 350)
        );
        document.getElementById('settingsClearButton').addEventListener('click', function () {
          document.getElementById('settingsSearchInput').value = '';
          load();
        });
        document.getElementById('settingsGroups').addEventListener('input', function (event) {
          var field = event.target.closest('[data-key]');
          if (field) {
            state.drafts[field.dataset.key] = field.value;
          }
        });
        document.getElementById('settingsGroups').addEventListener('change', function (event) {
          var field = event.target.closest('[data-key]');
          if (field) {
            state.drafts[field.dataset.key] = field.value;
          }
        });
        document.getElementById('saveSettingsButton').addEventListener('click', function () {
          var settings = collectSettings();
          try {
            validateClient(settings);
          } catch (error) {
            KSL.showToast(error.message || 'Check the settings and try again.', 'error');
            return;
          }
          KSL.call('saveSettingsAdmin', KSL.getSessionToken(), { settings: settings })
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Save failed.');
              }
              KSL.showToast('Settings saved.', 'success');
              state.drafts = {};
              var titleItem = settings.filter(function (item) {
                return item.key === 'APP_TITLE';
              })[0];
              if (titleItem && titleItem.value) {
                var appTitleTextElement = document.getElementById('appTitleText');
                if (appTitleTextElement) {
                  appTitleTextElement.textContent = titleItem.value;
                }
                if (KSL.state.settings) {
                  KSL.state.settings.APP_TITLE = titleItem.value;
                }
              }
              load();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Save failed.', 'error');
            });
        });
        document.getElementById('dimensionsButton').addEventListener('click', loadDimensions);
        document.getElementById('addDimensionButton').addEventListener('click', function () {
          KSL.call('saveDimensionValue', KSL.getSessionToken(), {
            column: document.getElementById('dimensionColumnInput').value,
            value: document.getElementById('dimensionValueInput').value.trim()
          })
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Save failed.');
              }
              document.getElementById('dimensionValueInput').value = '';
              KSL.showToast('Dimension value saved.', 'success');
              loadDimensions();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Save failed.', 'error');
            });
        });
        document.getElementById('dimensionsTableBody').addEventListener('click', function (event) {
          var button = event.target.closest('button[data-column]');
          if (!button) {
            return;
          }
          KSL.call('deactivateDimensionValue', KSL.getSessionToken(), {
            column: button.dataset.column,
            value: button.dataset.value,
            activate: button.dataset.activate === '1'
          })
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Update failed.');
              }
              loadDimensions();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Update failed.', 'error');
            });
        });
        document.getElementById('backupSettingsButton').addEventListener('click', function () {
          KSL.callBusy('backupSettingsConfig', KSL.getSessionToken())
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Backup failed.');
              }
              KSL.previewOrDownloadFile(response.data);
              KSL.showToast('Backup ready.', 'success');
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Backup failed.', 'error');
            });
        });
        document.getElementById('dimensionColumnInput').addEventListener('change', updateDimensionNote);
        document.getElementById('rebuildSettingsButton').addEventListener('click', function () {
          KSL.confirmModal({
            title: 'Rebuild configuration',
            message: 'Creates missing sheets and default settings. Does not delete your data. Continue?'
          }).then(function (ok) {
            if (!ok) {
              return;
            }
            KSL.callBusy('rebuildSettingsConfig', KSL.getSessionToken())
              .then(function (response) {
                if (!response || !response.success) {
                  throw new Error((response && response.message) || 'Rebuild failed.');
                }
                KSL.showToast('Configuration rebuilt.', 'success');
                load();
              })
              .catch(function (error) {
                KSL.showToast(error.message || 'Rebuild failed.', 'error');
              });
          });
        });
        load();
      });
    });
  })();
</script>
