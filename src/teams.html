<section class="page-shell">
  <div class="page-header">
    <h1>Teams</h1>
    <p>Maintain operational teams used for task assignment, monitoring, and performance snapshots.</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="newTeamButton" class="btn btn-primary" type="button">
          <i class="fa-solid fa-plus"></i>
          New Team
        </button>
        <button id="teamsRefreshButton" class="btn btn-outline" type="button">
          <i class="fa-solid fa-rotate-right"></i>
          Refresh
        </button>
        <button id="teamsClearButton" class="btn btn-outline" type="button">Clear</button>
      </div>
      <div class="toolbar-right">
        <input id="teamsSearchInput" class="input" type="search" placeholder="Search teams..." style="min-width: 200px;">
        <input id="teamsDepartmentFilter" class="input" type="search" placeholder="Department" style="min-width: 150px;">
        <input id="teamsLeaderFilter" class="input" type="search" placeholder="Team Leader" style="min-width: 150px;">
        <select id="teamsStatusFilter" class="select" style="min-width: 140px;">
          <option value="">All statuses</option>
          <option value="Active">Active</option>
          <option value="Archived">Archived</option>
        </select>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Team ID</th>
          <th>Name</th>
          <th>Department</th>
          <th>Team Leader</th>
          <th>Status</th>
          <th>Updated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="teamsTableBody">
        <tr><td colspan="7" class="empty-state">Loading teams...</td></tr>
      </tbody>
    </table>
  </div>
  <div id="teamsPagination" class="pagination"></div>
</section>

<div id="teamModalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="teamModalTitle">Create Team</h3>
      <button class="btn btn-outline" type="button" data-close-modal="teamModalBackdrop">Close</button>
    </div>
    <form id="teamForm">
      <input id="teamIdInput" type="hidden">
      <div class="form-grid">
        <div class="field">
          <label for="teamNameInput">Team Name</label>
          <input id="teamNameInput" class="input" type="text" required>
        </div>
        <div class="field">
          <label for="teamDepartmentInput">Department</label>
          <input id="teamDepartmentInput" class="input" type="text" required>
        </div>
        <div class="field">
          <label for="teamLeaderInput">Team Leader</label>
          <input id="teamLeaderInput" class="input" type="text">
        </div>
        <div class="field">
          <label for="teamStatusInput">Status</label>
          <select id="teamStatusInput" class="select">
            <option value="Active">Active</option>
            <option value="Archived">Archived</option>
          </select>
        </div>
        <div class="field full">
          <label for="teamDescriptionInput">Description</label>
          <textarea id="teamDescriptionInput" class="textarea"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" type="button" data-close-modal="teamModalBackdrop">Cancel</button>
        <button class="btn btn-primary" type="submit">Save Team</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    var state = { teams: [], page: 1, pages: 1, pageSize: 25 };

    function getFilters() {
      return {
        query: document.getElementById('teamsSearchInput').value.trim(),
        department: document.getElementById('teamsDepartmentFilter').value.trim(),
        teamLeader: document.getElementById('teamsLeaderFilter').value.trim(),
        status: document.getElementById('teamsStatusFilter').value,
        page: state.page,
        pageSize: state.pageSize
      };
    }

    function renderTeams() {
      var body = document.getElementById('teamsTableBody');
      if (!state.teams.length) {
        body.innerHTML = '<tr><td colspan="7" class="empty-state">No matching data found.</td></tr>';
        return;
      }
      body.innerHTML = state.teams.map(function (team) {
        return (
          '<tr><td>' + KSL.escapeHtml(team.teamId) +
          '</td><td>' + KSL.escapeHtml(team.teamName) +
          '</td><td>' + KSL.escapeHtml(team.department || '-') +
          '</td><td>' + KSL.escapeHtml(team.teamLeader || '-') +
          '</td><td><span class="status-badge ' + KSL.statusClass(team.status) + '">' +
          KSL.escapeHtml(team.status) + '</span></td><td>' +
          KSL.escapeHtml(KSL.formatDate(team.updatedDate) || '-') +
          '</td><td><div class="toolbar-left">' +
          '<button class="btn btn-outline" type="button" data-action="edit" data-id="' +
          KSL.escapeHtml(team.teamId) + '">Edit</button>' +
          '<button class="btn btn-danger" type="button" data-action="archive" data-id="' +
          KSL.escapeHtml(team.teamId) + '">Archive</button>' +
          (KSL.isAdministrator()
            ? '<button class="btn btn-danger" type="button" data-action="delete" data-id="' +
              KSL.escapeHtml(team.teamId) +
              '" data-name="' +
              KSL.escapeHtml(team.teamName || team.teamId) +
              '">Delete</button>'
            : '') +
          '</div></td></tr>'
        );
      }).join('');
    }

    function renderPagination() {
      KSL.renderPager('teamsPagination', state, loadTeams);
    }

    function loadTeams() {
      KSL.call('listTeams', KSL.getSessionToken(), getFilters())
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load teams.');
          }
          var payload = response.data || {};
          state.teams = payload.items || [];
          var pagination = payload.pagination || {};
          state.page = Number(pagination.page || 1);
          state.pages = Number(pagination.pages || 1);
          renderTeams();
          renderPagination();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Failed to load teams.', 'error');
        });
    }

    function resetForm() {
      document.getElementById('teamForm').reset();
      document.getElementById('teamIdInput').value = '';
      document.getElementById('teamStatusInput').value = 'Active';
      document.getElementById('teamModalTitle').textContent = 'Create Team';
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager'], function () {
        document.getElementById('newTeamButton').addEventListener('click', function () {
          resetForm();
          KSL.openModal('teamModalBackdrop');
        });
        document.getElementById('teamsRefreshButton').addEventListener('click', function () {
          state.page = 1;
          loadTeams();
        });
        document.getElementById('teamsClearButton').addEventListener('click', function () {
          document.getElementById('teamsSearchInput').value = '';
          document.getElementById('teamsDepartmentFilter').value = '';
          document.getElementById('teamsLeaderFilter').value = '';
          document.getElementById('teamsStatusFilter').value = '';
          state.page = 1;
          loadTeams();
        });
        ['teamsSearchInput', 'teamsDepartmentFilter', 'teamsLeaderFilter'].forEach(function (id) {
          document.getElementById(id).addEventListener('input', KSL.debounce(function () {
            state.page = 1;
            loadTeams();
          }, 400));
        });
        document.getElementById('teamsStatusFilter').addEventListener('change', function () {
          state.page = 1;
          loadTeams();
        });
        document.getElementById('teamForm').addEventListener('submit', function (event) {
          event.preventDefault();
          var teamId = document.getElementById('teamIdInput').value.trim();
          var payload = {
            teamId: teamId,
            teamName: document.getElementById('teamNameInput').value.trim(),
            department: document.getElementById('teamDepartmentInput').value.trim(),
            teamLeader: document.getElementById('teamLeaderInput').value.trim(),
            teamDescription: document.getElementById('teamDescriptionInput').value.trim(),
            status: document.getElementById('teamStatusInput').value
          };
          KSL.call(teamId ? 'updateTeam' : 'createTeam', KSL.getSessionToken(), payload)
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Unable to save team.');
              }
              KSL.showToast(response.message || 'Team saved.', 'success');
              KSL.closeModal('teamModalBackdrop');
              loadTeams();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Unable to save team.', 'error');
            });
        });
        document.getElementById('teamsTableBody').addEventListener('click', function (event) {
          var button = event.target.closest('button[data-action]');
          if (!button) {
            return;
          }
          var id = button.dataset.id || '';
          if (button.dataset.action === 'edit') {
            var team = state.teams.find(function (item) { return item.teamId === id; });
            if (!team) {
              return;
            }
            document.getElementById('teamModalTitle').textContent = 'Edit Team';
            document.getElementById('teamIdInput').value = team.teamId;
            document.getElementById('teamNameInput').value = team.teamName || '';
            document.getElementById('teamDepartmentInput').value = team.department || '';
            document.getElementById('teamLeaderInput').value = team.teamLeader || '';
            document.getElementById('teamDescriptionInput').value = team.teamDescription || '';
            document.getElementById('teamStatusInput').value = team.status || 'Active';
            KSL.openModal('teamModalBackdrop');
          } else if (button.dataset.action === 'delete') {
            if (!KSL.confirmDelete(button.dataset.name || id)) {
              return;
            }
            KSL.call('deleteTeam', KSL.getSessionToken(), { teamId: id })
              .then(function (response) {
                if (!response || !response.success) {
                  throw new Error((response && response.message) || 'Unable to delete team.');
                }
                KSL.showToast(response.message || 'Team deleted.', 'success');
                loadTeams();
              })
              .catch(function (error) {
                KSL.showToast(error.message || 'Unable to delete team.', 'error');
              });
          } else if (button.dataset.action === 'archive') {
            if (!window.confirm('Archive this team? Active task references will block this action.')) {
              return;
            }
            KSL.call('archiveTeam', KSL.getSessionToken(), { teamId: id })
              .then(function (response) {
                if (!response || !response.success) {
                  throw new Error((response && response.message) || 'Unable to archive team.');
                }
                KSL.showToast(response.message || 'Team archived.', 'success');
                loadTeams();
              })
              .catch(function (error) {
                KSL.showToast(error.message || 'Unable to archive team.', 'error');
              });
          }
        });
        loadTeams();
      });
    });
  })();
</script>
