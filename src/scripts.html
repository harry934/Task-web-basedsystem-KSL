<script>
  (function () {
    var SESSION_KEY = 'kslSessionToken';
    var ROLE_KEY = 'kslUserRole';
    var LOGO_KEY = 'kslLogoUrl.v2';
    var DEFAULT_LOGO_URL =
      'https://kenyashipyards.co.ke/wp-content/uploads/2022/06/cropped-KSL-High-quality-Logo-300x273.png';
    var KSL = (window.KSL = window.KSL || {});
    function readStoredValue_(key) {
      var sessionValue = '';
      try {
        sessionValue = sessionStorage.getItem(key) || '';
      } catch (error) {
        sessionValue = '';
      }
      if (sessionValue) {
        return sessionValue;
      }
      try {
        return localStorage.getItem(key) || '';
      } catch (error) {
        return '';
      }
    }
    function writeStoredValue_(key, value) {
      if (value) {
        try {
          sessionStorage.setItem(key, value);
        } catch (error) {
          // Ignore storage errors.
        }
        try {
          localStorage.setItem(key, value);
        } catch (error) {
          // Ignore storage quota errors.
        }
        return;
      }
      try {
        sessionStorage.removeItem(key);
      } catch (error) {
        // Ignore storage errors.
      }
      try {
        localStorage.removeItem(key);
      } catch (error) {
        // Ignore storage errors.
      }
    }
    function readStoredToken_() {
      return readStoredValue_(SESSION_KEY);
    }
    function readStoredRole_() {
      return readStoredValue_(ROLE_KEY);
    }
    KSL.state = KSL.state || {
      sessionToken: readStoredToken_(),
      bootstrap: null,
      currentUser: null
    };

    KSL.getActivePage = function () {
      return document.body.dataset.activePage || 'login';
    };

    KSL.toShareableWebAppUrl = function (url) {
      var raw = String(url || '').trim();
      if (!raw) {
        return '';
      }

      var match = raw.match(
        /\/(?:a\/\*\/macros\/s|a\/macros\/[^/]+\/s|macros\/(?:u\/\d+\/)?s)\/([A-Za-z0-9_-]+)\/(exec|dev)\b/i
      );
      if (!match) {
        match = raw.match(/\/macros\/s\/([A-Za-z0-9_-]+)\/(exec|dev)\b/i);
      }
      if (!match) {
        return raw;
      }

      var deploymentId = match[1];
      var kind = String(match[2] || 'exec').toLowerCase();
      if (kind === 'dev') {
        return 'https://script.google.com/macros/s/' + deploymentId + '/dev';
      }

      return 'https://script.google.com/a/*/macros/s/' + deploymentId + '/exec';
    };

    KSL.getScriptUrl = function () {
      return KSL.toShareableWebAppUrl(
        String((window.APP_TEMPLATE_STATE && window.APP_TEMPLATE_STATE.scriptUrl) || '').trim()
      );
    };

    KSL.isEditorPreviewUrl = function () {
      var scriptUrl = KSL.getScriptUrl();
      if (/\/macros\/s\/[^/]+\/exec/i.test(scriptUrl) || /\/a\/\*\/macros\/s\/[^/]+\/exec/i.test(scriptUrl)) {
        return false;
      }
      var href = String(window.location.href || '');
      return /\/dev\/?(\?|$)/i.test(scriptUrl) || /\/dev\/?(\?|$)/i.test(href);
    };

    KSL.resolveNavigationBaseUrl = function () {
      var configuredUrl = KSL.getScriptUrl();
      if (configuredUrl) {
        return configuredUrl;
      }

      var href = String(window.location.href || '');
      var match = href.match(
        /https:\/\/script\.google\.com\/(?:a\/\*\/macros\/s|a\/macros\/[^/]+\/s|macros\/(?:u\/\d+\/)?s)\/[^/]+\/(exec|dev)/i
      );
      if (match && match[0]) {
        return KSL.toShareableWebAppUrl(match[0]);
      }

      return '';
    };

    KSL.getSessionToken = function () {
      return KSL.state.sessionToken || '';
    };

    KSL.setSessionToken = function (token) {
      KSL.state.sessionToken = token || '';
      KSL.state.bootstrap = null;
      if (!token) {
        KSL.state.currentUser = null;
      }
      writeStoredValue_(SESSION_KEY, token || '');
    };

    KSL.clearSessionToken = function () {
      KSL.setSessionToken('');
      KSL.setCachedRole('');
    };

    KSL.getCachedRole = function () {
      return String((KSL.state.currentUser && KSL.state.currentUser.role) || readStoredRole_() || '');
    };

    KSL.setCachedRole = function (role) {
      var value = String(role || '').trim();
      writeStoredValue_(ROLE_KEY, value);
    };

    KSL.showBootOverlay = function () {
      KSL.showProcessing('Loading...');
    };

    KSL.hideBootOverlay = function () {
      KSL.hideProcessing();
      document.body.classList.remove('shell-pending');
    };

    KSL.applySharedLogo = function (src) {
      if (!src) {
        return;
      }
      document.querySelectorAll('.brand-logo-img, .topbar-logo, #loginLogoImg').forEach(function (img) {
        if (img) {
          img.src = src;
        }
      });
    };

    KSL.loadLogo = function () {
      var cached = '';
      try {
        cached = localStorage.getItem(LOGO_KEY) || '';
      } catch (error) {
        cached = '';
      }
      var src =
        cached.indexOf('http') === 0 && cached.indexOf('data:') !== 0 ? cached : DEFAULT_LOGO_URL;
      KSL.applySharedLogo(src);
      try {
        localStorage.setItem(LOGO_KEY, src);
      } catch (error) {
        // Ignore storage quota errors and still show the logo.
      }
      return Promise.resolve(src);
    };

    KSL.displayRole = function (role, extras) {
      if (extras && extras.isSuperAdmin) {
        return 'Super Admin';
      }
      if (extras && extras.displayRole) {
        return extras.displayRole;
      }
      var value = String(role || '').trim();
      if (value === 'Employee' || value === 'Staff') {
        return 'Staff';
      }
      return value || '-';
    };

    KSL.roleAllowed = function (role, allowedRoles) {
      var list = Array.isArray(allowedRoles) ? allowedRoles : [];
      if (!list.length) {
        return true;
      }
      var value = String(role || '').trim();
      if (list.indexOf(value) > -1) {
        return true;
      }
      var isStaff = value === 'Employee' || value === 'Staff';
      return isStaff && (list.indexOf('Employee') > -1 || list.indexOf('Staff') > -1);
    };

    KSL.fillStaffSelect = function (selectId, people, placeholder, selectedId) {
      var select = document.getElementById(selectId);
      if (!select) {
        return;
      }
      var list = people || [];
      var nameCounts = {};
      list.forEach(function (person) {
        var name = String((person && person.fullName) || '')
          .trim()
          .toLowerCase();
        if (name) {
          nameCounts[name] = (nameCounts[name] || 0) + 1;
        }
      });
      var html = '<option value="">' + KSL.escapeHtml(placeholder || 'Select staff') + '</option>';
      html += list
        .map(function (person) {
          var id = person.employeeId || person.staffId || '';
          var name = person.fullName || id;
          var label = name;
          if (person.department) {
            label += ' · ' + person.department;
          }
          if (nameCounts[String(name).toLowerCase()] > 1 && id) {
            label += ' · ' + id;
          }
          var selected = selectedId && selectedId === id ? ' selected' : '';
          return (
            '<option value="' +
            KSL.escapeHtml(id) +
            '"' +
            selected +
            '>' +
            KSL.escapeHtml(label) +
            '</option>'
          );
        })
        .join('');
      select.innerHTML = html;
    };

    KSL.previewNextId = function (prefix) {
      return KSL.call('previewNextId', KSL.getSessionToken(), prefix).then(function (response) {
        return (response && response.data && response.data.nextId) || '';
      });
    };

    KSL.getUserRole = function () {
      return KSL.getCachedRole();
    };

    KSL.isStaffLike = function (role) {
      return KSL.roleAllowed(role || KSL.getUserRole(), ['Staff', 'Employee']);
    };

    KSL.canSearchStaffWork = function (role) {
      return KSL.roleAllowed(role || KSL.getUserRole(), ['Administrator', 'Manager', 'Supervisor']);
    };

    KSL.progressBarHtml = function (percent) {
      var value = Math.max(0, Math.min(100, Number(percent) || 0));
      return (
        '<div class="progress-meter"><div class="progress-bar"><span style="width:' +
        value +
        '%"></span></div><strong>' +
        value +
        '%</strong></div>'
      );
    };

    KSL.renderSubtaskChecklist = function (subtasks) {
      if (!subtasks || !subtasks.length) {
        return '<p class="page-note">No subtasks yet. Progress stays at 0% until subtasks are added.</p>';
      }
      return (
        '<ul class="subtask-list">' +
        subtasks
          .map(function (item) {
            var done = String(item.status || '').toLowerCase() === 'completed';
            var evidence = item.fileUrl
              ? '<a href="' +
                KSL.escapeHtml(item.fileUrl) +
                '" target="_blank" rel="noopener">Evidence PDF</a>'
              : '';
            return (
              '<li class="' +
              (done ? 'is-done' : '') +
              '"><span>' +
              (done ? 'Completed · ' : 'Pending · ') +
              KSL.escapeHtml(item.title || item.subtaskId) +
              '</span><span>' +
              KSL.escapeHtml(item.assignedStaffName || item.assignedStaffId || '') +
              '</span>' +
              (item.summary
                ? '<span class="page-note">' + KSL.escapeHtml(item.summary) + '</span>'
                : '') +
              evidence +
              '</li>'
            );
          })
          .join('') +
        '</ul>'
      );
    };

    KSL.renderStaffWorkPanel = function (containerId, payload, emptyMessage) {
      var el = document.getElementById(containerId);
      if (!el) {
        return;
      }
      var staff = payload && payload.staff;
      var tasks = (payload && payload.tasks) || [];
      if (!staff) {
        el.innerHTML =
          '<p class="page-note">' +
          KSL.escapeHtml(emptyMessage || 'Search by name, username, or Staff UID.') +
          '</p>';
        return;
      }
      el.innerHTML =
        '<div class="staff-work-head"><strong>' +
        KSL.escapeHtml(staff.fullName || '-') +
        '</strong> · ' +
        KSL.escapeHtml(staff.staffId || '') +
        (staff.department ? ' · ' + KSL.escapeHtml(staff.department) : '') +
        '</div>' +
        (tasks.length
          ? tasks
              .map(function (task) {
                return (
                  '<div class="staff-work-task"><div class="staff-work-task-head"><strong>' +
                  KSL.escapeHtml(task.taskId) +
                  '</strong> ' +
                  KSL.escapeHtml(task.taskTitle || '') +
                  KSL.progressBarHtml(task.progress) +
                  '</div>' +
                  KSL.renderSubtaskChecklist(task.subtasks) +
                  '</div>'
                );
              })
              .join('')
          : '<p class="page-note">No tasks found for this staff member in your scope.</p>');
    };

    KSL.bindStaffWorkSearch = function (options) {
      var opts = options || {};
      var input = document.getElementById(opts.inputId);
      var button = document.getElementById(opts.buttonId);
      var resultsId = opts.resultsId;
      if (!input || !resultsId) {
        return;
      }
      function runSearch() {
        var query = input.value.trim();
        if (query.length < 2) {
          KSL.renderStaffWorkPanel(
            resultsId,
            { staff: null, tasks: [] },
            'Enter at least 2 characters (name, username, or Staff UID).'
          );
          return;
        }
        KSL.call('searchStaffWork', KSL.getSessionToken(), { query: query })
          .then(function (response) {
            if (!response || !response.success) {
              throw new Error((response && response.message) || 'Search failed.');
            }
            KSL.renderStaffWorkPanel(
              resultsId,
              response.data || {},
              response.message || 'No matching staff found.'
            );
          })
          .catch(function (error) {
            KSL.showToast(error.message || 'Search failed.', 'error');
          });
      }
      if (button) {
        button.addEventListener('click', runSearch);
      }
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          runSearch();
        }
      });
    };

    KSL.isPdfFile = function (file) {
      if (!file) {
        return false;
      }
      var name = String(file.name || '');
      var type = String(file.type || '').toLowerCase();
      return type === 'application/pdf' || /\.pdf$/i.test(name);
    };

    KSL.bindPdfPicker = function (inputId, options) {
      var input = document.getElementById(inputId);
      if (!input || input.dataset.pdfBound === '1') {
        return;
      }
      var opts = options || {};
      var maxMb = Math.max(1, Number((KSL.state.settings && KSL.state.settings.MAX_SUBTASK_PDF_MB) || 2));
      input.dataset.pdfBound = '1';
      input.classList.add('hidden');
      input.setAttribute('accept', 'application/pdf,.pdf');

      var zone = document.createElement('div');
      zone.className = 'pdf-dropzone';
      zone.innerHTML =
        '<div class="pdf-dropzone-inner">' +
        '<i class="fa-solid fa-file-pdf pdf-dropzone-icon" aria-hidden="true"></i>' +
        '<strong class="pdf-dropzone-title">Choose a PDF</strong>' +
        '<span class="pdf-dropzone-name">No file selected</span>' +
        '<span class="pdf-dropzone-hint">PDF only, max ' +
        maxMb +
        ' MB. Click or drop a file here.</span>' +
        '<span class="pdf-dropzone-error hidden"></span>' +
        '</div>';
      input.parentNode.insertBefore(zone, input);
      zone.appendChild(input);

      var nameEl = zone.querySelector('.pdf-dropzone-name');
      var titleEl = zone.querySelector('.pdf-dropzone-title');
      var errorEl = zone.querySelector('.pdf-dropzone-error');

      function showPickerError(message) {
        if (errorEl) {
          errorEl.textContent = message;
          errorEl.classList.remove('hidden');
        }
        zone.classList.add('is-error');
        zone.classList.remove('has-file');
        KSL.showToast(message, 'error');
      }

      function clearPickerError() {
        if (errorEl) {
          errorEl.textContent = '';
          errorEl.classList.add('hidden');
        }
        zone.classList.remove('is-error');
      }

      function setSelectedFile(file) {
        try {
          var transfer = new DataTransfer();
          transfer.items.add(file);
          input.files = transfer.files;
        } catch (error) {
          return false;
        }
        return true;
      }

      function applyFile(file) {
        if (!file) {
          nameEl.textContent = 'No file selected';
          titleEl.textContent = 'Choose a PDF';
          zone.classList.remove('has-file');
          return false;
        }
        if (!KSL.isPdfFile(file)) {
          input.value = '';
          nameEl.textContent = 'No file selected';
          titleEl.textContent = 'Choose a PDF';
          showPickerError('Only PDF files are allowed.');
          return false;
        }
        if (file.size < 1024) {
          input.value = '';
          nameEl.textContent = 'No file selected';
          titleEl.textContent = 'Choose a PDF';
          showPickerError('The PDF is too small or empty.');
          return false;
        }
        if (file.size > maxMb * 1024 * 1024) {
          input.value = '';
          nameEl.textContent = 'No file selected';
          titleEl.textContent = 'Choose a PDF';
          showPickerError('The PDF must be ' + maxMb + ' MB or smaller.');
          return false;
        }
        clearPickerError();
        zone.classList.add('has-file');
        nameEl.textContent = file.name;
        titleEl.textContent = 'PDF selected';
        return true;
      }

      zone.addEventListener('click', function (event) {
        if (event.target === input) {
          return;
        }
        event.preventDefault();
        input.click();
      });
      zone.addEventListener('dragover', function (event) {
        event.preventDefault();
        zone.classList.add('is-drag');
      });
      zone.addEventListener('dragleave', function () {
        zone.classList.remove('is-drag');
      });
      zone.addEventListener('drop', function (event) {
        event.preventDefault();
        zone.classList.remove('is-drag');
        var file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        if (!file) {
          return;
        }
        if (!applyFile(file)) {
          return;
        }
        setSelectedFile(file);
      });
      input.addEventListener('change', function () {
        applyFile(input.files && input.files[0]);
      });
      if (opts.required) {
        input.setAttribute('required', 'required');
      }
    };

    KSL.resetPdfPicker = function (inputId) {
      var input = document.getElementById(inputId);
      if (!input) {
        return;
      }
      input.value = '';
      var zone = input.closest('.pdf-dropzone');
      if (!zone) {
        return;
      }
      zone.classList.remove('has-file', 'is-error', 'is-drag');
      var nameEl = zone.querySelector('.pdf-dropzone-name');
      var titleEl = zone.querySelector('.pdf-dropzone-title');
      var errorEl = zone.querySelector('.pdf-dropzone-error');
      if (nameEl) {
        nameEl.textContent = 'No file selected';
      }
      if (titleEl) {
        titleEl.textContent = 'Choose a PDF';
      }
      if (errorEl) {
        errorEl.textContent = '';
        errorEl.classList.add('hidden');
      }
    };

    KSL.readPdfEvidence = function (file) {
      return new Promise(function (resolve, reject) {
        if (!file) {
          reject(new Error('A PDF file is required.'));
          return;
        }
        var name = String(file.name || '');
        var type = String(file.type || '').toLowerCase();
        if (type !== 'application/pdf' && !/\.pdf$/i.test(name)) {
          reject(new Error('Only PDF files are allowed.'));
          return;
        }
        if (file.size < 1024) {
          reject(new Error('The PDF is too small or empty.'));
          return;
        }
        var maxMb = Math.max(1, Number((KSL.state.settings && KSL.state.settings.MAX_SUBTASK_PDF_MB) || 2));
        var maxBytes = maxMb * 1024 * 1024;
        if (file.size > maxBytes) {
          reject(new Error('The PDF must be ' + maxMb + ' MB or smaller.'));
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          var result = String(reader.result || '');
          resolve({
            fileName: name,
            mimeType: 'application/pdf',
            base64: result.indexOf(',') > -1 ? result.split(',')[1] : result
          });
        };
        reader.onerror = function () {
          reject(new Error('Could not read the PDF.'));
        };
        reader.readAsDataURL(file);
      });
    };

    KSL.readOptionalPdfEvidence = function (fileInput) {
      var file = fileInput && fileInput.files && fileInput.files[0];
      if (!file) {
        return Promise.resolve(null);
      }
      return KSL.readPdfEvidence(file);
    };

    KSL.applySubtaskProgressPanel = function (containerId, percentInputId, items, progress) {
      var box = document.getElementById(containerId);
      var percent = document.getElementById(percentInputId);
      var list = Array.isArray(items) ? items : [];
      var computed = Number(progress);
      if (isNaN(computed)) {
        var completed = list.filter(function (item) {
          return String((item && item.status) || '').toLowerCase() === 'completed';
        }).length;
        computed = list.length ? Math.round((completed / list.length) * 100) : 0;
      }
      if (percent) {
        percent.value = computed;
        percent.readOnly = true;
      }
      if (!box) {
        return;
      }
      if (!list.length) {
        box.innerHTML =
          '<p class="page-note">No subtasks on this task. Progress stays at 0% until subtasks are added.</p>';
        return;
      }
      box.innerHTML =
        '<ul class="subtask-progress-list">' +
        list
          .map(function (sub) {
            var done = String((sub && sub.status) || '').toLowerCase() === 'completed';
            return (
              '<li class="subtask-mini"><span>' +
              (done ? 'Completed' : 'Pending') +
              '</span><span>' +
              KSL.escapeHtml((sub && sub.title) || (sub && sub.subtaskId) || 'Subtask') +
              '</span></li>'
            );
          })
          .join('') +
        '</ul>';
    };

    KSL.loadTaskSubtaskProgress = function (taskId, containerId, percentInputId) {
      if (!taskId) {
        KSL.applySubtaskProgressPanel(containerId, percentInputId, [], 0);
        return Promise.resolve({ items: [], progress: 0 });
      }
      return KSL.call('listTaskSubtasks', KSL.getSessionToken(), { taskId: taskId }).then(function (response) {
        if (!response || !response.success) {
          throw new Error((response && response.message) || 'Failed to load subtasks.');
        }
        var data = response.data || {};
        KSL.applySubtaskProgressPanel(containerId, percentInputId, data.items || [], Number(data.progress || 0));
        return data;
      });
    };

    KSL.renderSidebar = function (role) {
      var nav = document.getElementById('sidebarNav');
      if (!nav) {
        return;
      }
      var items = (window.APP_TEMPLATE_STATE && window.APP_TEMPLATE_STATE.navItems) || [];
      var activePage = KSL.getActivePage();
      var scriptUrl = KSL.getScriptUrl();
      var groupsOrder = [];
      var grouped = {};
      items.forEach(function (item) {
        var allowed = item.roles || [];
        if (role && !KSL.roleAllowed(role, allowed)) {
          return;
        }
        if (!role) {
          return;
        }
        var group = item.group || 'Menu';
        if (!grouped[group]) {
          grouped[group] = [];
          groupsOrder.push(group);
        }
        grouped[group].push(item);
      });
      nav.innerHTML = groupsOrder
        .map(function (group) {
          var links = grouped[group]
            .map(function (item) {
              var active = activePage === item.id ? ' active' : '';
              return (
                '<a class="nav-link' +
                active +
                '" href="' +
                KSL.escapeHtml(scriptUrl) +
                '?page=' +
                encodeURIComponent(item.id) +
                '" data-page="' +
                KSL.escapeHtml(item.id) +
                '">' +
                '<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">' +
                (item.svg || '') +
                '</svg><span>' +
                KSL.escapeHtml(item.label) +
                '</span></a>'
              );
            })
            .join('');
          return (
            '<div class="nav-group"><div class="nav-group-label">' +
            KSL.escapeHtml(group) +
            '</div>' +
            links +
            '</div>'
          );
        })
        .join('');
    };

    KSL.debounce = function (fn, waitMs) {
      var timer = null;
      return function () {
        var args = arguments;
        var context = this;
        window.clearTimeout(timer);
        timer = window.setTimeout(function () {
          fn.apply(context, args);
        }, waitMs || 400);
      };
    };

    KSL.runServer = function (functionName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (error) {
            var message = error && error.message ? error.message : String(error || 'Request failed.');
            if (/timed out|Exceeded maximum execution time|Service timed out/i.test(message)) {
              message = 'The server is still busy. Wait a moment and try again.';
            }
            reject(new Error(message));
          });
        runner[functionName].apply(runner, args);
      });
    };

    KSL.showProcessing = function (message) {
      if (document.body.classList.contains('login-body')) {
        return;
      }
      var overlay = document.getElementById('appProcessingOverlay');
      var text = document.getElementById('appProcessingMessage');
      if (text) {
        text.textContent = message || 'Please wait...';
      }
      if (overlay) {
        overlay.classList.remove('hidden');
      }
    };

    KSL.hideProcessing = function () {
      var overlay = document.getElementById('appProcessingOverlay');
      if (overlay) {
        overlay.classList.add('hidden');
      }
    };

    KSL._inflight = 0;
    KSL._busyButton = null;
    KSL._pendingBusyButton = null;
    KSL._scheduledActions = [];
    KSL._pdfPreviewPayload = null;
    KSL._modalResolvers = {};

    KSL.setButtonBusy = function (button, isBusy) {
      if (!button) {
        return;
      }
      if (isBusy) {
        if (!button.dataset.idleHtml) {
          button.dataset.idleHtml = button.innerHTML;
        }
        button.classList.add('is-busy');
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
      } else {
        button.classList.remove('is-busy');
        button.disabled = false;
        button.removeAttribute('aria-busy');
        if (button.dataset.idleHtml) {
          button.innerHTML = button.dataset.idleHtml;
        }
      }
    };

    KSL.beginRequest = function () {
      KSL._inflight += 1;
      if (document.body.classList.contains('login-body')) {
        return;
      }
      var bar = document.getElementById('appProgressBar');
      if (bar) {
        bar.classList.remove('hidden');
      }
      if (!KSL._busyButton && KSL._pendingBusyButton) {
        KSL._busyButton = KSL._pendingBusyButton;
        KSL.setButtonBusy(KSL._busyButton, true);
      }
    };

    KSL.endRequest = function () {
      KSL._inflight = Math.max(0, KSL._inflight - 1);
      if (KSL._inflight > 0) {
        return;
      }
      var bar = document.getElementById('appProgressBar');
      if (bar) {
        bar.classList.add('hidden');
      }
      if (KSL._busyButton) {
        KSL.setButtonBusy(KSL._busyButton, false);
        KSL._busyButton = null;
      }
      KSL._pendingBusyButton = null;
    };

    KSL.trackRequest = function (promise) {
      KSL.beginRequest();
      return Promise.resolve(promise).finally(function () {
        KSL.endRequest();
      });
    };

    KSL.popCallOptions_ = function (args) {
      var options = { busy: false, silent: false };
      if (
        args.length &&
        args[args.length - 1] &&
        typeof args[args.length - 1] === 'object' &&
        !Array.isArray(args[args.length - 1]) &&
        (Object.prototype.hasOwnProperty.call(args[args.length - 1], 'busy') ||
          Object.prototype.hasOwnProperty.call(args[args.length - 1], 'silent'))
      ) {
        var raw = args.pop();
        options.busy = Boolean(raw.busy);
        options.silent = Boolean(raw.silent);
      }
      return options;
    };

    KSL.showToast = function (message, type, options) {
      var host = document.getElementById('appToastHost');
      if (!host) {
        return { dismiss: function () {} };
      }
      var opts = options || {};
      var toast = document.createElement('div');
      var normalizedType = type || 'info';
      toast.className = 'toast toast-' + normalizedType;
      var text = document.createElement('span');
      text.textContent = message;
      toast.appendChild(text);
      var dismissed = false;
      var timer = window.setTimeout(function () {
        if (!dismissed) {
          toast.remove();
          if (typeof opts.onTimeout === 'function') {
            opts.onTimeout();
          }
        }
      }, opts.duration || 4000);
      if (opts.actionLabel && typeof opts.onAction === 'function') {
        var action = document.createElement('button');
        action.type = 'button';
        action.className = 'toast-action';
        action.textContent = opts.actionLabel;
        action.addEventListener('click', function () {
          dismissed = true;
          window.clearTimeout(timer);
          toast.remove();
          opts.onAction();
        });
        toast.appendChild(action);
      }
      host.appendChild(toast);
      return {
        dismiss: function () {
          dismissed = true;
          window.clearTimeout(timer);
          toast.remove();
        }
      };
    };

    KSL.scheduleAction = function (config) {
      var settings = config || {};
      var delayMs = Number(settings.delayMs || 5000);
      var entry = {
        cancelled: false,
        timer: null,
        run: settings.run,
        onUndo: settings.onUndo
      };
      entry.timer = window.setTimeout(function () {
        if (entry.cancelled) {
          return;
        }
        KSL._scheduledActions = KSL._scheduledActions.filter(function (item) {
          return item !== entry;
        });
        if (typeof entry.run === 'function') {
          Promise.resolve(entry.run()).catch(function (error) {
            KSL.showToast((error && error.message) || 'Action failed.', 'error');
          });
        }
      }, delayMs);
      KSL._scheduledActions.push(entry);
      KSL.showToast(settings.message || 'Done. Undo?', settings.toastType || 'info', {
        duration: delayMs,
        actionLabel: settings.undoLabel || 'Undo',
        onAction: function () {
          entry.cancelled = true;
          window.clearTimeout(entry.timer);
          KSL._scheduledActions = KSL._scheduledActions.filter(function (item) {
            return item !== entry;
          });
          if (typeof entry.onUndo === 'function') {
            entry.onUndo();
          }
        }
      });
      return entry;
    };

    KSL.flushScheduledActions = function () {
      var pending = KSL._scheduledActions.slice();
      KSL._scheduledActions = [];
      pending.forEach(function (entry) {
        entry.cancelled = true;
        window.clearTimeout(entry.timer);
        if (typeof entry.run === 'function') {
          Promise.resolve(entry.run()).catch(function () {
            return null;
          });
        }
      });
    };

    KSL.validatePassword = function (value, minLength) {
      var password = String(value || '');
      var min = Math.max(6, Number(minLength || 8));
      return {
        minLength: password.length >= min,
        upper: /[A-Z]/.test(password),
        lower: /[a-z]/.test(password),
        number: /[0-9]/.test(password),
        min: min,
        valid:
          password.length >= min &&
          /[A-Z]/.test(password) &&
          /[a-z]/.test(password) &&
          /[0-9]/.test(password)
      };
    };

        '">Uppercase</span>' +
        '<span class="' +
        (result.lower ? 'is-ok' : 'is-bad') +

          ? '<i class="fa-solid fa-eye-slash"></i>'

    KSL.replaceFiltersInUrl = function (map) {
      var params = new URLSearchParams(window.location.search);
      Object.keys(map || {}).forEach(function (key) {
        var value = map[key];
        if (value === '' || value === null || value === undefined) {

        }
      });
      var next = window.location.pathname + '?' + params.toString() + (window.location.hash || '');
      try {
        window.history.replaceState(null, '', next);
      } catch (error) {
        return;
      }
    };

    KSL.previewOrDownloadFile = function (payload) {
      if (!payload || !payload.base64) {
        throw new Error('No file data was returned.');
      }
      var mime = String(payload.mimeType || '');
      var isPdf = mime.indexOf('pdf') > -1 || /\.pdf$/i.test(payload.fileName || '');
      if (!isPdf) {
        KSL.downloadFile(payload);
        return;
      }
      KSL._pdfPreviewPayload = payload;
      var frame = document.getElementById('kslPdfPreviewFrame');
      var title = document.getElementById('kslPdfPreviewTitle');
      if (!frame || !document.getElementById('kslPdfPreviewModal')) {
        KSL.downloadFile(payload);
        return;
      }
      if (title) {
        title.textContent = payload.fileName || 'PDF preview';
      }
      try {
        var binary = window.atob(payload.base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        var blob = new Blob([bytes], { type: 'application/pdf' });
        frame.src = URL.createObjectURL(blob);
        KSL.openModal('kslPdfPreviewModal');
      } catch (error) {
        KSL.downloadFile(payload);
        KSL.showToast('Preview was blocked. The file was downloaded instead.', 'info');
      }
    };

    KSL.statusClass = function (statusValue) {
      var normalized = String(statusValue || '')
        .toLowerCase()
        .replace(/\s+/g, '');

      }
      return 'status-' + normalized;
    };

    KSL.formatDate = function (value) {
      if (!value) {
        return '';
      }
      var date = value instanceof Date ? value : new Date(value);
      if (isNaN(date.getTime())) {
        return '';
      }
      var dd = String(date.getDate()).padStart(2, '0');
      var mm = String(date.getMonth() + 1).padStart(2, '0');
      var yyyy = date.getFullYear();
      return dd + '/' + mm + '/' + yyyy;
    };

    KSL.escapeHtml = function (value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    };

    KSL.navigate = function (page, extraQuery) {
      KSL.flushScheduledActions();
      var params = new URLSearchParams();
      if (page) {
        params.set('page', page);
      }
      String(extraQuery || '')
        .replace(/^\?/, '')
        .split('&')
        .forEach(function (part) {
          if (!part) {
            return;
          }
          var bits = part.split('=');
          var key = decodeURIComponent(bits.shift() || '');
          var value = decodeURIComponent(bits.join('=') || '');
          if (!key || key === 't' || key === 'page') {
            return;
          }
          params.set(key, value);
        });
      params.set('t', String(Date.now()));
      var nextSearch = '?' + params.toString();
      var baseUrl = KSL.resolveNavigationBaseUrl();
      if (!baseUrl) {
        KSL.showToast(
          'Web app URL is not available. Open the deployed Web app link ending with /exec?page=login.',
          'error'
        );
        return;
      }
      var nextUrl = baseUrl.replace(/\/$/, '') + nextSearch;
      try {
        window.open(nextUrl, '_top');
      } catch (error) {
        window.location.href = nextUrl;
      }
    };

    KSL.applyShellContext = function (bootstrapData) {
      var user = bootstrapData.user || {};
      var role = user.role || '';
      var userNameElement = document.getElementById('userFullName');
      var userRoleElement = document.getElementById('userRole');
      var userAvatarElement = document.getElementById('userAvatar');
      var appTitleTextElement = document.getElementById('appTitleText');
      var badgeElement = document.getElementById('notificationBadge');

      KSL.state.currentUser = user;
      KSL.state.settings = bootstrapData.settings || {};
      KSL.setCachedRole(role);
      KSL.renderSidebar(role);

      if (userNameElement) {
        userNameElement.textContent = user.fullName || 'Unknown User';
      }
      if (userRoleElement) {
        userRoleElement.innerHTML = KSL.roleBadgeHtml(role, user);
      }
      if (userAvatarElement) {
        userAvatarElement.src =
          user.profilePhoto ||
          'https://www.gravatar.com/avatar/?d=mp&f=y';
      }
      if (appTitleTextElement && bootstrapData.settings && bootstrapData.settings.APP_TITLE) {
        appTitleTextElement.textContent = bootstrapData.settings.APP_TITLE;
      }

      if (badgeElement) {
        KSL.setUnreadBadge(Number(bootstrapData.unreadNotifications || 0));
      }

      KSL.hideAccessGate();
      KSL.hideBootOverlay();
      KSL.startUnreadBadgePolling();
    };

    KSL.setUnreadBadge = function (count) {
      var badgeElement = document.getElementById('notificationBadge');
      if (!badgeElement) {
        return;
      }
      var unreadCount = Math.max(0, Number(count || 0));
      badgeElement.textContent = String(unreadCount);
      badgeElement.classList.toggle('hidden', unreadCount < 1);
    };

    KSL.startUnreadBadgePolling = function () {
      if (KSL._unreadBadgeTimer) {
        return;
      }
      function refreshUnreadBadge() {
        var token = KSL.getSessionToken();
        if (!token || KSL.getActivePage() === 'login') {
          return;
        }
        KSL.call('getUnreadNotificationCount', token, { silent: true })
          .then(function (response) {
            if (!response || !response.success) {
              return;
            }
            var count = Number((response.data && response.data.count) || 0);
            KSL.setUnreadBadge(count);
          })
          .catch(function () {
            return null;
          });
      }
      refreshUnreadBadge();
      KSL._unreadBadgeTimer = window.setInterval(refreshUnreadBadge, 30000);
    };

    KSL.isAdministrator = function () {

    };

    KSL.requireAuth = function (requiredRoles, onReady) {
      return KSL.initShell().then(function (bootstrapData) {
        if (Array.isArray(requiredRoles) && requiredRoles.length > 0) {
          var role = bootstrapData.user && bootstrapData.user.role;
          if (!KSL.roleAllowed(role, requiredRoles)) {
            KSL.showAccessGate(
              'You do not have permission to open this page.',
              'Ask an administrator if you need access, or return to the dashboard.',
              'Go to dashboard',
              function () {
                KSL.navigate('dashboard');
              }
            );
            throw new Error('Unauthorized role.');
          }
        }
        KSL.hideAccessGate();
        if (typeof onReady === 'function') {
          onReady(bootstrapData);
        }
        return bootstrapData;
      });
    };

    KSL.readQueryParam = function (key) {

      return params.get(key) || '';
    };

    KSL.redirectToLogin = function () {
      KSL.navigate('login', 'relogin=1');
    };

    KSL.redirectDeniedToLogin = function () {
      KSL.navigate('login', 'denied=1');
    };

    KSL.isInvalidSessionError = function (message) {
      return /session expired|invalid|sign in again|not active|no longer exists|pending administrator|no active session/i.test(
        String(message || '')
      );
    };

    KSL.isForbiddenPageError = function (message) {
      return /not authorized to access the requested page|do not have permission/i.test(String(message || ''));
    };

    KSL.showAccessGate = function (title, message, buttonLabel, onClick) {
      var gate = document.getElementById('accessGate');
      var titleEl = document.getElementById('accessGateTitle');
      var messageEl = document.getElementById('accessGateMessage');
      var button = document.getElementById('accessGateButton');
      if (titleEl) {
        titleEl.textContent = title || 'Access restricted';
      }
      if (messageEl) {
        messageEl.textContent = message || '';
      }
      if (button) {
        if (buttonLabel) {
          button.textContent = buttonLabel;
          button.classList.remove('hidden');
          button.onclick = typeof onClick === 'function' ? onClick : function () {
            KSL.redirectToLogin();
          };
        } else {
          button.classList.add('hidden');
        }
      }
      if (gate) {
        gate.classList.remove('hidden');
      }
      document.body.classList.remove('shell-ready');
      document.body.classList.add('shell-locked');
    };

    KSL.hideAccessGate = function () {
      var gate = document.getElementById('accessGate');
      if (gate) {
        gate.classList.add('hidden');
      }
      document.body.classList.remove('shell-locked');
      document.body.classList.add('shell-ready');
    };

    KSL.initShell = function () {
      if (KSL.getActivePage() === 'login') {
        return Promise.resolve({ success: true });
      }

      if (KSL.state.bootstrap) {
        return KSL.state.bootstrap;
      }

      var token = KSL.getSessionToken() || readStoredToken_();
      if (token && !KSL.state.sessionToken) {
        KSL.setSessionToken(token);
      }
      if (!token) {
        KSL.redirectDeniedToLogin();
        return Promise.reject(new Error('No active session.'));
      }

      function loadBootstrap(attempt) {
        return KSL.runServer('getAppBootstrap', token, KSL.getActivePage()).then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Unable to initialize session.');
          }
          var data = response.data || {};
          KSL.applyShellContext(data);
          return data;
        }).catch(function (error) {
          var message = error && error.message ? error.message : 'Unable to initialize session.';
          if (attempt < 1 && !KSL.isInvalidSessionError(message) && !KSL.isForbiddenPageError(message)) {
            return loadBootstrap(attempt + 1);
          }
          if (KSL.isInvalidSessionError(message)) {
            KSL.clearSessionToken();
            KSL.showAccessGate(
              'Sign in required',
              'Your session expired or is not valid. Sign in again to continue.',
              'Sign in',
              function () {
                KSL.redirectToLogin();
              }
            );
          } else if (KSL.isForbiddenPageError(message)) {
            KSL.showAccessGate(
              'You do not have permission to open this page.',
              'This area is restricted. Return to the dashboard or ask an administrator for access.',
              'Go to dashboard',
              function () {
                KSL.navigate('dashboard');
              }
            );
          } else {
            KSL.hideBootOverlay();
            KSL.showAccessGate(
              'Unable to load this page',
              message,
              'Try again',
              function () {
                window.location.reload();
              }
            );
          }
          throw error;
        });
      }

      KSL.state.bootstrap = loadBootstrap(0);
      return KSL.state.bootstrap;
    };

    KSL.renderPager = function (elementId, state, onChange) {
      var pagination = document.getElementById(elementId);
      if (!pagination) {
        return;
      }
      pagination.innerHTML =
        '<button type="button" data-pager="prev" ' +
        (state.page <= 1 ? 'disabled' : '') +
        '>Previous</button>' +
        '<button type="button" disabled>Page ' +
        state.page +
        ' of ' +
        state.pages +
        '</button>' +
        '<button type="button" data-pager="next" ' +
        (state.page >= state.pages ? 'disabled' : '') +
        '>Next</button>';
      var prev = pagination.querySelector('[data-pager="prev"]');
      var next = pagination.querySelector('[data-pager="next"]');
      if (prev) {
        prev.addEventListener('click', function () {
          state.page -= 1;
          onChange();
        });
      }
      if (next) {
        next.addEventListener('click', function () {
          state.page += 1;
          onChange();
        });
      }
    };

    KSL.downloadFile = function (payload) {
      if (!payload || !payload.base64) {
        throw new Error('No file data was returned.');
      }
      var binary = window.atob(payload.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      var blob = new Blob([bytes], { type: payload.mimeType || 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = payload.fileName || 'download';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    };

    KSL.toDateInput = function (value) {
      if (!value) {
        return '';
      }
      var date = value instanceof Date ? value : new Date(value);
      if (isNaN(date.getTime())) {
        return String(value).slice(0, 10);
      }
      return date.toISOString().slice(0, 10);
    };

    KSL.openModal = function (modalId) {
      var modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.remove('hidden');
      }
    };

    KSL.closeModal = function (modalId) {
      var modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.add('hidden');
      }
    };

    KSL.callBusy = function (functionName) {
      var args = Array.prototype.slice.call(arguments, 1);
      var shown = false;
      var timer = window.setTimeout(function () {
        shown = true;
        KSL.showProcessing();
      }, 150);
      return KSL.trackRequest(
        KSL.runServer.apply(null, [functionName].concat(args)).finally(function () {
          window.clearTimeout(timer);
          if (shown) {
            KSL.hideProcessing();
          }
        })
      );
    };

    KSL.call = function (functionName) {
      var args = Array.prototype.slice.call(arguments, 1);
      var options = KSL.popCallOptions_(args);
      if (options.busy) {
        return KSL.callBusy.apply(null, [functionName].concat(args));
      }
      var request = KSL.runServer.apply(null, [functionName].concat(args));
      if (options.silent) {
        return request;
      }
      return KSL.trackRequest(request);
    };

    function closeConfirm_(value) {
      if (KSL._modalResolvers.confirm) {
        var resolve = KSL._modalResolvers.confirm;
        KSL._modalResolvers.confirm = null;
        resolve(value);
      } else {
        KSL.closeModal('kslConfirmModal');
      }
    }

    function closePrompt_(value) {
      if (KSL._modalResolvers.prompt) {
        var resolve = KSL._modalResolvers.prompt;
        KSL._modalResolvers.prompt = null;
        resolve(value);
      } else {
        KSL.closeModal('kslPromptModal');
      }
    }

    KSL.toggleNotificationDropdown = function (force) {
      var dropdown = document.getElementById('notificationDropdown');
      var button = document.getElementById('notificationButton');
      if (!dropdown) {
        return;
      }
      var open = typeof force === 'boolean' ? force : dropdown.classList.contains('hidden');
      dropdown.classList.toggle('hidden', !open);
      if (button) {
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      if (open) {
        KSL.loadNotificationDropdown();
      }
    };

    KSL.loadNotificationDropdown = function () {
      var list = document.getElementById('notificationDropdownList');
      if (!list) {
        return;
      }
      list.innerHTML = '<p class="page-note">Loading...</p>';
      KSL.call('listNotifications', KSL.getSessionToken(), { unreadOnly: true, page: 1, pageSize: 8 })
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Unable to load notifications.');
          }
          var items = ((response.data || {}).items) || [];
          if (!items.length) {
            list.innerHTML = '<p class="page-note">No unread notifications.</p>';
            return;
          }
          list.innerHTML = items
            .map(function (item) {
              return (
                '<button class="notification-item" type="button" data-notification-id="' +
                KSL.escapeHtml(item.notificationId) +
                '" data-task-id="' +
                KSL.escapeHtml(item.relatedTaskId || '') +
                '"><strong>' +
                KSL.escapeHtml(item.title || 'Notification') +
                '</strong><span>' +
                KSL.escapeHtml(item.message || '') +
                '</span></button>'
              );
            })
            .join('');
        })
        .catch(function (error) {
          list.innerHTML =
            '<p class="page-note">' + KSL.escapeHtml(error.message || 'Unable to load notifications.') + '</p>';
        });
    };

    document.addEventListener(
      'click',
      function (event) {
        if (document.body.classList.contains('login-body')) {
          return;
        }
        var btn = event.target.closest('.btn, .action-menu-item');
        if (btn && !btn.disabled && !btn.classList.contains('password-toggle')) {
          KSL._pendingBusyButton = btn;
        }
      },
      true
    );

    document.addEventListener('click', function (event) {
      var navLink = event.target.closest('a.nav-link[data-page]');
      if (navLink) {
        event.preventDefault();
        KSL.setSidebarOpen(false);
        KSL.navigate(navLink.getAttribute('data-page'));
        return;
      }
      var closeButton = event.target.closest('[data-close-modal]');
      if (closeButton) {
        var modalId = closeButton.getAttribute('data-close-modal');
        KSL.closeModal(modalId);
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      KSL.loadLogo();
      document.addEventListener('click', function () {
        window.setTimeout(KSL.stampTableLabels, 0);
      });
      var observerTarget = document.querySelector('.content-area') || document.body;
      if (window.MutationObserver && observerTarget) {
        new MutationObserver(function () {
          KSL.stampTableLabels();
        }).observe(observerTarget, { childList: true, subtree: true });
      }
      var sidebarToggle = document.getElementById('sidebarToggle');
      var sidebarBackdrop = document.getElementById('sidebarBackdrop');
      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function () {
          KSL.setSidebarOpen(!document.body.classList.contains('sidebar-open'));
        });
      }
      if (sidebarBackdrop) {
        sidebarBackdrop.hidden = false;
        sidebarBackdrop.addEventListener('click', function () {
          KSL.setSidebarOpen(false);
        });
      }
      var confirmOk = document.getElementById('kslConfirmOk');
      var confirmCancel = document.getElementById('kslConfirmCancel');
      var confirmClose = document.getElementById('kslConfirmClose');
      if (confirmOk) {
        confirmOk.addEventListener('click', function () {
          closeConfirm_(true);
        });
      }
      [confirmCancel, confirmClose].forEach(function (el) {
        if (el) {
          el.addEventListener('click', function () {
            closeConfirm_(false);
          });
        }
      });
      var promptOk = document.getElementById('kslPromptOk');
      var promptCancel = document.getElementById('kslPromptCancel');
      var promptClose = document.getElementById('kslPromptClose');
      var promptInput = document.getElementById('kslPromptInput');
      if (promptOk) {
        promptOk.addEventListener('click', function () {
          closePrompt_(promptInput ? promptInput.value : '');
        });
      }
      [promptCancel, promptClose].forEach(function (el) {
        if (el) {
          el.addEventListener('click', function () {
            closePrompt_(null);
          });
        }
      });
      if (promptInput) {
        promptInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            closePrompt_(promptInput.value);
          }
        });
      }
      var passwordForm = document.getElementById('kslPasswordForm');
      var passwordCancel = document.getElementById('kslPasswordCancel');
      var passwordClose = document.getElementById('kslPasswordClose');
      function finishPassword_(value) {
        if (KSL._modalResolvers.password) {
          var resolve = KSL._modalResolvers.password;
          KSL._modalResolvers.password = null;
          KSL.closeModal('kslPasswordModal');
          resolve(value);
        } else {
          KSL.closeModal('kslPasswordModal');
        }
      }
      if (passwordForm) {
        passwordForm.addEventListener('submit', function (event) {
          event.preventDefault();
          var username = document.getElementById('kslPasswordUsername').value.trim();
          var password = document.getElementById('kslPasswordValue').value;
          var confirm = document.getElementById('kslPasswordConfirm').value;
          var check = KSL.validatePassword(password);
          if (!username) {
            KSL.showToast('Username is required.', 'error');
            return;
          }
          if (!check.valid) {
            KSL.showToast('Password must include ' + check.min + '+ characters, uppercase, lowercase, and a number.', 'error');
            return;
          }
          if (password !== confirm) {
            KSL.showToast('Passwords do not match.', 'error');
            return;
          }
          finishPassword_({ username: username, password: password });
        });
      }
      [passwordCancel, passwordClose].forEach(function (el) {
        if (el) {
          el.addEventListener('click', function () {
            finishPassword_(null);
          });
        }
      });
      var sideClose = document.getElementById('kslSidePanelClose');
      if (sideClose) {
        sideClose.addEventListener('click', KSL.closeSidePanel);
      }
      var pdfClose = document.getElementById('kslPdfPreviewClose');
      var pdfCloseFooter = document.getElementById('kslPdfPreviewCloseFooter');
      var pdfDownload = document.getElementById('kslPdfPreviewDownload');
      [pdfClose, pdfCloseFooter].forEach(function (el) {
        if (el) {
          el.addEventListener('click', function () {
            KSL.closeModal('kslPdfPreviewModal');
          });
        }
      });
      if (pdfDownload) {
        pdfDownload.addEventListener('click', function () {
          if (KSL._pdfPreviewPayload) {
            KSL.downloadFile(KSL._pdfPreviewPayload);
          }
        });
      }
      window.addEventListener('beforeunload', function () {
        KSL.flushScheduledActions();
      });
      var logoutButton = document.getElementById('logoutButton');
      if (logoutButton) {
        logoutButton.addEventListener('click', function () {
          var token = KSL.getSessionToken();
          KSL.flushScheduledActions();
          KSL.showProcessing('Signing out...');
          KSL.call('logoutSession', token)
            .catch(function () {
              return null;
            })
            .finally(function () {
              KSL.clearSessionToken();
              KSL.redirectToLogin();
            });
        });
      }
      var notificationButton = document.getElementById('notificationButton');
      var notificationViewAll = document.getElementById('notificationViewAll');
      var notificationList = document.getElementById('notificationDropdownList');
      if (notificationButton) {
        notificationButton.addEventListener('click', function (event) {
          event.stopPropagation();
          KSL.toggleNotificationDropdown();
        });
      }
      if (notificationViewAll) {
        notificationViewAll.addEventListener('click', function () {
          KSL.navigate('notifications');
        });
      }
      if (notificationList) {
        notificationList.addEventListener('click', function (event) {
          var item = event.target.closest('.notification-item');
          if (!item) {
            return;
          }
          var id = item.getAttribute('data-notification-id');
          var taskId = item.getAttribute('data-task-id');
          if (id) {
            KSL.call('markNotificationRead', KSL.getSessionToken(), { notificationId: id }).catch(function () {
              return null;
            });
          }
          KSL.toggleNotificationDropdown(false);
          if (taskId) {
            KSL.navigate('mytasks', 'taskId=' + encodeURIComponent(taskId));
          } else {
            KSL.navigate('notifications');
          }
        });
      }
      document.addEventListener('click', function (event) {
        if (!event.target.closest('.notification-wrap')) {
          KSL.toggleNotificationDropdown(false);
        }
      });
      KSL.enhancePasswordField('loginPasswordInput');
      KSL.enhancePasswordField('newUserPassword', 'newUserPasswordHints');
      KSL.enhancePasswordField('kslPasswordValue', 'kslPasswordHints');
      if (KSL.getActivePage() !== 'login') {
        var cachedRole = readStoredRole_();
        if (cachedRole) {
          KSL.renderSidebar(cachedRole);
        }
        KSL.initShell()
          .then(function () {
            return KSL.loadLogo();
          })
          .catch(function () {
            return null;
          });
      } else {
        KSL.hideBootOverlay();
      }
    });
  })();
</script>
