<section class="page-shell">
  <div class="page-header">
    <h1>Staff</h1>
    <p>Add staff so they can be assigned tasks. Login accounts are created separately under Users.</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="newEmployeeButton" class="btn btn-primary" type="button">
          <i class="fa-solid fa-plus"></i>
          New staff
        </button>
        <button id="employeesRefreshButton" class="btn btn-outline" type="button">Refresh</button>
        <button id="employeesRecalc" class="btn btn-outline" type="button">Recalculate metrics</button>
        <button id="employeesExportButton" class="btn btn-outline" type="button">Export</button>
        <button id="employeesExportPdfButton" class="btn btn-outline" type="button">Export PDF</button>
      </div>
      <div class="toolbar-right">
        <input id="employeesSearchInput" class="input" type="search" placeholder="Search name, Staff UID, email..." style="min-width: 240px;">
        <select id="employeesDepartmentFilter" class="select" style="min-width: 160px;">
          <option value="">All departments</option>
        </select>
        <input id="employeesSupervisorFilter" class="input" type="search" placeholder="Supervisor" style="min-width: 150px;">
        <select id="employeesStatusFilter" class="select" style="min-width: 140px;">
          <option value="">All statuses</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Staff UID</th>
          <th>Name</th>
          <th>Department</th>
          <th>Job title</th>
          <th>Email</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="employeesTableBody">
        <tr><td colspan="7" class="empty-state">Loading staff...</td></tr>
      </tbody>
    </table>
  </div>
  <div id="employeesPagination" class="pagination"></div>
</section>

<div id="employeeModalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="employeeModalTitle">New staff</h3>
      <button class="btn btn-outline" type="button" data-close-modal="employeeModalBackdrop">Close</button>
    </div>
    <form id="employeeForm">
      <input id="employeeIdInput" type="hidden">
      <div class="form-grid">
        <div class="field full">
          <label for="employeeFullNameInput">Full name</label>
          <input id="employeeFullNameInput" class="input" type="text" required>
        </div>
        <div class="field">
          <label for="employeeNumberInput">Staff UID</label>
          <input id="employeeNumberInput" class="input" type="text" readonly>
        </div>
        <div class="field">
          <label for="employeeEmailInput">Work email</label>
          <input id="employeeEmailInput" class="input" type="email">
        </div>
        <div class="field">
          <label for="employeePhoneInput">Phone</label>
          <input id="employeePhoneInput" class="input" type="text">
        </div>
        <div class="field">
          <label for="employeeDepartmentInput">Department</label>
          <select id="employeeDepartmentInput" class="select" required></select>
        </div>
        <div class="field">
          <label for="employeeJobTitleInput">Job title</label>
          <select id="employeeJobTitleInput" class="select"></select>
        </div>
        <div class="field">
          <label for="employeeTypeInput">Employment type</label>
          <select id="employeeTypeInput" class="select"></select>
        </div>
        <div class="field">
          <label for="employeeLocationInput">Work location</label>
          <select id="employeeLocationInput" class="select"></select>
        </div>
        <div class="field">
          <label for="employeeSectionInput">Section</label>
          <select id="employeeSectionInput" class="select"></select>
        </div>
        <div class="field">
          <label for="employeeTeamInput">Team</label>
          <input id="employeeTeamInput" class="input" type="text">
        </div>
        <div class="field">
          <label for="employeeSupervisorIdInput">Supervisor</label>
          <select id="employeeSupervisorIdInput" class="select"></select>
        </div>
        <div class="field">
          <label for="employeeDateJoinedInput">Date joined</label>
          <input id="employeeDateJoinedInput" class="input" type="date">
        </div>
        <div class="field">
          <label for="employeeStatusInput">Status</label>
          <select id="employeeStatusInput" class="select">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" type="button" data-close-modal="employeeModalBackdrop">Cancel</button>
        <button class="btn btn-primary" type="submit">Save staff</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    var state = {
      items: [],
      page: 1,
      pages: 1,
      pageSize: 25,
      meta: {}
    };

    function fillSelect(id, values, placeholder) {
      var select = document.getElementById(id);
      var html = placeholder ? '<option value="">' + KSL.escapeHtml(placeholder) + '</option>' : '';
      html += (values || [])
        .map(function (value) {
          return '<option value="' + KSL.escapeHtml(value) + '">' + KSL.escapeHtml(value) + '</option>';
        })
        .join('');
      select.innerHTML = html;
    }

    function getFilters() {
      return {
        query: document.getElementById('employeesSearchInput').value.trim(),
        department: document.getElementById('employeesDepartmentFilter').value,
        supervisor: document.getElementById('employeesSupervisorFilter').value.trim(),
        status: document.getElementById('employeesStatusFilter').value,
        page: state.page,
        pageSize: state.pageSize
      };
    }

    function renderTable() {
      var body = document.getElementById('employeesTableBody');
      if (!state.items.length) {
        body.innerHTML = '<tr><td colspan="7" class="empty-state">No staff yet. Click New staff.</td></tr>';
        return;
      }
      body.innerHTML = state.items
        .map(function (item) {
          return (
            '<tr><td>' +
            KSL.escapeHtml(item.employeeId) +
            '</td><td>' +
            KSL.escapeHtml(item.fullName) +
            '</td><td>' +
            KSL.escapeHtml(item.department || '-') +
            '</td><td>' +
            KSL.escapeHtml(item.jobTitle || '-') +
            '</td><td>' +
            KSL.escapeHtml(item.email || '-') +
            '</td><td><span class="status-badge ' +
            KSL.statusClass(item.employmentStatus) +
            '">' +
            KSL.escapeHtml(item.employmentStatus) +
            '</span></td><td><div class="toolbar-left">' +
            '<button class="btn btn-outline" type="button" data-action="edit" data-id="' +
            KSL.escapeHtml(item.employeeId) +
            '">Edit</button>' +
            (String(item.employmentStatus || '').toLowerCase() === 'inactive'
              ? ''
              : '<button class="btn btn-danger" type="button" data-action="deactivate" data-id="' +
                KSL.escapeHtml(item.employeeId) +
                '">Deactivate</button>') +
            (KSL.isAdministrator()
              ? '<button class="btn btn-danger" type="button" data-action="delete" data-id="' +
                KSL.escapeHtml(item.employeeId) +
                '" data-name="' +
                KSL.escapeHtml(item.fullName || item.employeeId) +
                '">Delete</button>'
              : '') +
            '</div></td></tr>'
          );
        })
        .join('');
    }

    function renderPagination() {
      var pagination = document.getElementById('employeesPagination');
      pagination.innerHTML =
        '<button type="button" id="employeesPrevPage" ' +
        (state.page <= 1 ? 'disabled' : '') +
        '>Previous</button>' +
        '<button type="button" disabled>Page ' +
        state.page +
        ' of ' +
        state.pages +
        '</button>' +
        '<button type="button" id="employeesNextPage" ' +
        (state.page >= state.pages ? 'disabled' : '') +
        '>Next</button>';
      var prev = document.getElementById('employeesPrevPage');
      var next = document.getElementById('employeesNextPage');
      if (prev) {
        prev.addEventListener('click', function () {
          state.page -= 1;
          loadEmployees();
        });
      }
      if (next) {
        next.addEventListener('click', function () {
          state.page += 1;
          loadEmployees();
        });
      }
    }

    function loadEmployees() {
      KSL.call('listEmployees', KSL.getSessionToken(), getFilters())
        .then(function (response) {
          if (!response || !response.success) {
            throw new Error((response && response.message) || 'Failed to load employees.');
          }
          var payload = response.data || {};
          state.items = payload.items || [];
          state.page = Number((payload.pagination || {}).page || 1);
          state.pages = Number((payload.pagination || {}).pages || 1);
          renderTable();
          renderPagination();
        })
        .catch(function (error) {
          KSL.showToast(error.message || 'Failed to load staff.', 'error');
        });
    }

    function openCreate() {
      document.getElementById('employeeForm').reset();
      document.getElementById('employeeIdInput').value = '';
      document.getElementById('employeeModalTitle').textContent = 'New staff';
      document.getElementById('employeeStatusInput').value = 'Active';
      KSL.fillStaffSelect('employeeSupervisorIdInput', state.meta.staff || [], 'Select supervisor');
      KSL.previewNextId('EMP').then(function (nextId) {
        document.getElementById('employeeNumberInput').value = nextId || 'Generated on save';
      });
      KSL.openModal('employeeModalBackdrop');
    }

    function openEdit(employeeId) {
      var item = state.items.find(function (row) {
        return row.employeeId === employeeId;
      });
      if (!item) {
        KSL.showToast('Staff member not found.', 'error');
        return;
      }
      document.getElementById('employeeModalTitle').textContent = 'Edit staff';
      document.getElementById('employeeIdInput').value = item.employeeId;
      document.getElementById('employeeFullNameInput').value = item.fullName || '';
      document.getElementById('employeeNumberInput').value = item.employeeId || item.employeeNumber || '';
      document.getElementById('employeeEmailInput').value = item.email || '';
      document.getElementById('employeePhoneInput').value = item.phone || '';
      document.getElementById('employeeDepartmentInput').value = item.department || '';
      document.getElementById('employeeJobTitleInput').value = item.jobTitle || '';
      document.getElementById('employeeTypeInput').value = item.employmentType || '';
      document.getElementById('employeeLocationInput').value = item.workLocation || '';
      document.getElementById('employeeSectionInput').value = item.section || '';
      document.getElementById('employeeTeamInput').value = item.team || '';
      KSL.fillStaffSelect(
        'employeeSupervisorIdInput',
        state.meta.staff || [],
        'Select supervisor',
        item.supervisorId || ''
      );
      document.getElementById('employeeStatusInput').value = item.employmentStatus || 'Active';
      if (item.dateJoined) {
        var date = new Date(item.dateJoined);
        if (!isNaN(date.getTime())) {
          var mm = String(date.getMonth() + 1).padStart(2, '0');
          var dd = String(date.getDate()).padStart(2, '0');
          document.getElementById('employeeDateJoinedInput').value =
            date.getFullYear() + '-' + mm + '-' + dd;
        }
      }
      KSL.openModal('employeeModalBackdrop');
    }

    function collectPayload() {
      return {
        employeeId: document.getElementById('employeeIdInput').value.trim(),
        fullName: document.getElementById('employeeFullNameInput').value.trim(),
        employeeNumber: document.getElementById('employeeNumberInput').value.trim(),
        email: document.getElementById('employeeEmailInput').value.trim(),
        phone: document.getElementById('employeePhoneInput').value.trim(),
        department: document.getElementById('employeeDepartmentInput').value,
        jobTitle: document.getElementById('employeeJobTitleInput').value,
        employmentType: document.getElementById('employeeTypeInput').value,
        workLocation: document.getElementById('employeeLocationInput').value,
        section: document.getElementById('employeeSectionInput').value,
        team: document.getElementById('employeeTeamInput').value.trim(),
        supervisorId: document.getElementById('employeeSupervisorIdInput').value,
        supervisorName: (function () {
          var select = document.getElementById('employeeSupervisorIdInput');
          return select && select.selectedIndex > 0 ? select.options[select.selectedIndex].text : '';
        })(),
        dateJoined: document.getElementById('employeeDateJoinedInput').value,
        employmentStatus: document.getElementById('employeeStatusInput').value
      };
    }

    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager'], function () {
        KSL.call('getEmployeeFormMetadata', KSL.getSessionToken())
          .then(function (response) {
            state.meta = (response && response.data) || {};
            fillSelect('employeesDepartmentFilter', state.meta.departments || [], 'All departments');
            fillSelect('employeeDepartmentInput', state.meta.departments || [], 'Select department');
            fillSelect('employeeJobTitleInput', state.meta.jobTitles || [], 'Select job title');
            fillSelect('employeeTypeInput', state.meta.employmentTypes || [], 'Select type');
            fillSelect('employeeLocationInput', state.meta.workLocations || [], 'Select location');
            fillSelect('employeeSectionInput', state.meta.sections || [], 'Select section');
            KSL.fillStaffSelect('employeeSupervisorIdInput', state.meta.staff || [], 'Select supervisor');
          })
          .catch(function () {
            return null;
          });

        document.getElementById('newEmployeeButton').addEventListener('click', openCreate);
        document.getElementById('employeesRefreshButton').addEventListener('click', function () {
          state.page = 1;
          loadEmployees();
        });
        document.getElementById('employeesSearchInput').addEventListener(
          'input',
          KSL.debounce(function () {
            state.page = 1;
            loadEmployees();
          }, 400)
        );
        document.getElementById('employeesDepartmentFilter').addEventListener('change', function () {
          state.page = 1;
          loadEmployees();
        });
        document.getElementById('employeesStatusFilter').addEventListener('change', function () {
          state.page = 1;
          loadEmployees();
        });
        document.getElementById('employeesSupervisorFilter').addEventListener(
          'input',
          KSL.debounce(function () {
            state.page = 1;
            loadEmployees();
          }, 400)
        );
        document.getElementById('employeesRecalc').addEventListener('click', function () {
          KSL.callBusy('recalculateEmployeeMetrics', KSL.getSessionToken(), {})
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Recalculation failed.');
              }
              KSL.showToast(response.message || 'Metrics recalculated.', 'success');
              loadEmployees();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Recalculation failed.', 'error');
            });
        });
        document.getElementById('employeesExportButton').addEventListener('click', function () {
          var options = getFilters();
          options.format = 'csv';
          KSL.callBusy('exportEmployees', KSL.getSessionToken(), options)
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Export failed.');
              }
              KSL.downloadFile(response.data);
              KSL.showToast('Export ready.', 'success');
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Export failed.', 'error');
            });
        });
        document.getElementById('employeesExportPdfButton').addEventListener('click', function () {
          var options = getFilters();
          options.format = 'pdf';
          KSL.callBusy('exportEmployees', KSL.getSessionToken(), options)
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Export failed.');
              }
              KSL.downloadFile(response.data);
              KSL.showToast('Report generated.', 'success');
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Export failed.', 'error');
            });
        });
        document.getElementById('employeesTableBody').addEventListener('click', function (event) {
          var button = event.target.closest('button[data-action]');
          if (!button) {
            return;
          }
          var id = button.dataset.id || '';
          if (button.dataset.action === 'edit') {
            openEdit(id);
            return;
          }
          if (button.dataset.action === 'delete') {
            if (!KSL.confirmDelete(button.dataset.name || id)) {
              return;
            }
            KSL.call('deleteEmployee', KSL.getSessionToken(), { employeeId: id })
              .then(function (response) {
                if (!response || !response.success) {
                  throw new Error((response && response.message) || 'Delete failed.');
                }
                KSL.showToast('Staff record deleted.', 'success');
                loadEmployees();
              })
              .catch(function (error) {
                KSL.showToast(error.message || 'Delete failed.', 'error');
              });
            return;
          }
          if (!window.confirm('Deactivate this staff member? They will no longer appear in assignment lists.')) {
            return;
          }
          KSL.call('deactivateEmployee', KSL.getSessionToken(), { employeeId: id })
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Deactivate failed.');
              }
              KSL.showToast('Staff member deactivated.', 'success');
              loadEmployees();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Deactivate failed.', 'error');
            });
        });
        document.getElementById('employeeForm').addEventListener('submit', function (event) {
          event.preventDefault();
          var payload = collectPayload();
          var fn = payload.employeeId ? 'updateEmployee' : 'createEmployee';
          KSL.call(fn, KSL.getSessionToken(), payload)
            .then(function (response) {
              if (!response || !response.success) {
                throw new Error((response && response.message) || 'Save failed.');
              }
              KSL.showToast('Staff saved.', 'success');
              KSL.closeModal('employeeModalBackdrop');
              state.page = 1;
              loadEmployees();
            })
            .catch(function (error) {
              KSL.showToast(error.message || 'Save failed.', 'error');
            });
        });
        loadEmployees();
      });
    });
  })();
</script>
