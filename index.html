<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kenya Shipyards Limited Tasks Management System" />
    <title>KSL Tasks Management System</title>
    <link rel="icon" href="assets/ksl-logo.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1f3a;
      }

      /*
        Clip Google’s top “This application was created by…” bar by shifting
        the framed Apps Script UI up inside an overflow-hidden viewport.
      */
      .viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #0b1f3a;
      }

      .viewport iframe {
        position: absolute;
        left: 0;
        width: 100%;
        border: 0;
        /* Banner height ~56–64px depending on browser/zoom */
        top: -62px;
        height: calc(100% + 62px);
        background: #ffffff;
      }

      .fallback {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b1f3a;
        color: #fff;
        font-family: "Segoe UI", Arial, sans-serif;
        text-align: center;
      }

      .fallback.show {
        display: flex;
      }

      .fallback a {
        color: #0b1f3a;
        background: #c5a028;
        text-decoration: none;
        font-weight: 700;
        padding: 12px 18px;
        display: inline-block;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="viewport">
      <iframe
        id="appFrame"
        title="KSL Tasks Management System"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="no-referrer-when-downgrade"
        src="https://script.google.com/macros/s/AKfycbwUz5HsPL4O76bxFe_HxCCWZamQ3-LkjXN7OtfWfQRGFHM5Fqn4TW0huPRZNMphVT7Hxw/exec?page=login"
      ></iframe>
    </div>
    <div class="fallback" id="fallback">
      <div>
        <p>Unable to load the embedded app in this browser.</p>
        <a
          id="fallbackLink"
          href="https://script.google.com/macros/s/AKfycbwUz5HsPL4O76bxFe_HxCCWZamQ3-LkjXN7OtfWfQRGFHM5Fqn4TW0huPRZNMphVT7Hxw/exec?page=login"
          target="_blank"
          rel="noopener"
          >Open Sign in</a
        >
      </div>
    </div>
    <script>
      (function () {
        // Prefer /macros/s/… (works better in iframes than /a/*/macros/s/).
        var APP_URL =
          "https://script.google.com/macros/s/AKfycbwUz5HsPL4O76bxFe_HxCCWZamQ3-LkjXN7OtfWfQRGFHM5Fqn4TW0huPRZNMphVT7Hxw/exec?page=login";
        var frame = document.getElementById("appFrame");
        var fallback = document.getElementById("fallback");
        var fallbackLink = document.getElementById("fallbackLink");
        frame.src = APP_URL;
        fallbackLink.href = APP_URL;

        var loaded = false;
        frame.addEventListener("load", function () {
          loaded = true;
          fallback.classList.remove("show");
        });
        setTimeout(function () {
          if (!loaded) {
            // Still show the frame; only surface fallback if src is empty.
            if (!frame.getAttribute("src")) {
              fallback.classList.add("show");
            }
          }
        }, 10000);
      })();
    </script>
  </body>
</html>
