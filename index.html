<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KSL Tasks Management System</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #f3f4f6;
    }
    /* Hide Google’s top warning bar by clipping the framed app */
    .frame-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    .frame-wrap iframe {
      position: absolute;
      left: 0;
      border: 0;
      width: 100%;
      top: -65px;
      height: calc(100% + 65px);
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame-wrap">
    <iframe
      src="https://script.google.com/macros/s/AKfycbwUz5HsPL4O76bxFe_HxCCWZamQ3-LkjXN7OtfWfQRGFHM5Fqn4TW0huPRZNMphVT7Hxw/exec?page=login"
      title="KSL Tasks Management System"
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>
</body>
</html>
