<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KSL Tasks Management System</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1f3a;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .gate {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      background: #0b1f3a;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .gate.hidden {
      display: none;
    }
    .gate h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .gate p {
      margin: 0 0 20px;
      color: #d7dee6;
      font-size: 14px;
    }
    .gate button {
      border: 0;
      background: #c5a028;
      color: #0b1f3a;
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 28px;
      cursor: pointer;
      border-radius: 2px;
    }
    /* Hide Google’s top warning bar by clipping the framed app */
    .frame-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: none;
    }
    .frame-wrap.show {
      display: block;
    }
    .frame-wrap iframe {
      position: absolute;
      left: 0;
      border: 0;
      width: 100%;
      top: -110px;
      height: calc(100% + 110px);
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <div>
      <h1>Kenya Shipyards Limited</h1>
      <p>Tasks Management System</p>
      <button type="button" id="continueBtn">Continue to Sign in</button>
    </div>
  </div>
  <div class="frame-wrap" id="frameWrap">
    <iframe
      id="appFrame"
      title="KSL Tasks Management System"
      allow="clipboard-read; clipboard-write"
      src="about:blank">
    </iframe>
  </div>
  <script>
    (function () {
      var APP_URL =
        "https://script.google.com/macros/s/AKfycbwUz5HsPL4O76bxFe_HxCCWZamQ3-LkjXN7OtfWfQRGFHM5Fqn4TW0huPRZNMphVT7Hxw/exec?page=login";
      var gate = document.getElementById("gate");
      var wrap = document.getElementById("frameWrap");
      var frame = document.getElementById("appFrame");
      var btn = document.getElementById("continueBtn");

      // Load iframe only on user click so browsers don't block Google's redirect chain.
      btn.addEventListener("click", function () {
        gate.classList.add("hidden");
        wrap.classList.add("show");
        frame.src = APP_URL;
      });
    })();
  </script>
</body>
</html>
