<section class="page-shell">
  <div class="page-header">
    <h1>Notifications</h1>
    <p>Review system alerts, open related tasks, and mark items as read.</p>
  </div>
  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="markAllReadButton" class="btn btn-primary" type="button">Mark All Read</button>
        <button id="unreadOnlyButton" class="btn btn-outline" type="button">Unread</button>
        <button id="refreshNotificationsButton" class="btn btn-outline" type="button">Refresh</button>
      </div>
      <div class="toolbar-right">
        <select id="notificationPriorityFilter" class="select" style="min-width: 140px;">
          <option value="">All priorities</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
        <select id="notificationTypeFilter" class="select" style="min-width: 160px;">
          <option value="">All types</option>
          <option value="Assignment">Assignment</option>
          <option value="Progress Review">Progress Review</option>
          <option value="System">System</option>
        </select>
        <input id="notificationSearchInput" class="input" type="search" placeholder="Search..." style="min-width: 180px;">
      </div>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Type</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="notificationsTableBody"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
    </table>
  </div>
  <div id="notificationsPagination" class="pagination"></div>
</section>
<script>
  (function () {
    var state = { items: [], page: 1, pages: 1, pageSize: 25, unreadOnly: false };
    function filters() {
      return {
        query: document.getElementById('notificationSearchInput').value.trim(),
        priority: document.getElementById('notificationPriorityFilter').value,
        type: document.getElementById('notificationTypeFilter').value,
        unreadOnly: state.unreadOnly,
        page: state.page,
        pageSize: state.pageSize
      };
    }
    function load() {
      KSL.call('listNotifications', KSL.getSessionToken(), filters()).then(function (response) {
        if (!response || !response.success) throw new Error((response && response.message) || 'Failed to load notifications.');
        var payload = response.data || {};
        state.items = payload.items || [];
        state.page = Number((payload.pagination || {}).page || 1);
        state.pages = Number((payload.pagination || {}).pages || 1);
        var body = document.getElementById('notificationsTableBody');
        if (!state.items.length) {
          body.innerHTML = '<tr><td colspan="6" class="empty-state">No matching data found.</td></tr>';
        } else {
          body.innerHTML = state.items.map(function (item) {
            return '<tr><td><strong>' + KSL.escapeHtml(item.title) + '</strong><div class="page-note">' +
              KSL.escapeHtml(item.message) + '</div></td><td>' + KSL.escapeHtml(item.type) +
              '</td><td><span class="status-badge ' + KSL.statusClass(item.priority) + '">' +
              KSL.escapeHtml(item.priority) + '</span></td><td>' + KSL.escapeHtml(item.readStatus) +
              '</td><td>' + KSL.escapeHtml(KSL.formatDate(item.createdDate) || '-') +
              '</td><td><div class="toolbar-left">' +
              (item.relatedTaskId ? '<button class="btn btn-outline" type="button" data-action="open" data-task="' +
                KSL.escapeHtml(item.relatedTaskId) + '">Open</button>' : '') +
              '<button class="btn btn-secondary" type="button" data-action="read" data-id="' +
              KSL.escapeHtml(item.notificationId) + '">Mark read</button></div></td></tr>';
          }).join('');
        }
        KSL.renderPager('notificationsPagination', state, load);
      }).catch(function (error) { KSL.showToast(error.message || 'Failed to load notifications.', 'error'); });
    }
    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager', 'Supervisor', 'Team Leader', 'Employee'], function () {
        document.getElementById('markAllReadButton').addEventListener('click', function () {
          KSL.call('markAllNotificationsRead', KSL.getSessionToken()).then(function (response) {
            if (!response || !response.success) throw new Error((response && response.message) || 'Update failed.');
            KSL.showToast('Notifications updated.', 'success');
            load();
          }).catch(function (error) { KSL.showToast(error.message || 'Update failed.', 'error'); });
        });
        document.getElementById('unreadOnlyButton').addEventListener('click', function () {
          state.unreadOnly = !state.unreadOnly;
          state.page = 1;
          load();
        });
        document.getElementById('refreshNotificationsButton').addEventListener('click', load);
        ['notificationPriorityFilter', 'notificationTypeFilter'].forEach(function (id) {
          document.getElementById(id).addEventListener('change', function () {
            state.page = 1;
            load();
          });
        });
        document.getElementById('notificationSearchInput').addEventListener('input', KSL.debounce(function () {
          state.page = 1;
          load();
        }, 350));
        document.getElementById('notificationsTableBody').addEventListener('click', function (event) {
          var button = event.target.closest('button[data-action]');
          if (!button) return;
          if (button.dataset.action === 'open') {
            KSL.navigate('mytasks', 'taskId=' + encodeURIComponent(button.dataset.task || ''));
            return;
          }
          KSL.call('markNotificationRead', KSL.getSessionToken(), { notificationId: button.dataset.id })
            .then(function (response) {
              if (!response || !response.success) throw new Error((response && response.message) || 'Update failed.');
              load();
            }).catch(function (error) { KSL.showToast(error.message || 'Update failed.', 'error'); });
        });
        load();
      });
    });
  })();
</script>
