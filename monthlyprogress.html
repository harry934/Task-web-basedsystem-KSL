<section class="page-shell">
  <div class="page-header">
    <h1>Monthly Progress</h1>
    <p>Generate monthly employee snapshots and record supervisor or management comments.</p>
  </div>
  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="generateMonthButton" class="btn btn-primary" type="button">Generate Month</button>
        <button id="exportMonthButton" class="btn btn-outline" type="button">Export</button>
        <button id="exportMonthPdfButton" class="btn btn-outline" type="button">Export PDF</button>
        <button id="refreshMonthButton" class="btn btn-outline" type="button">Refresh</button>
      </div>
      <div class="toolbar-right">
        <input id="monthInput" class="input" type="month">
        <input id="monthDepartmentFilter" class="input" type="search" placeholder="Department" style="min-width: 150px;">
        <input id="monthSupervisorFilter" class="input" type="search" placeholder="Supervisor" style="min-width: 150px;">
        <input id="monthSearchInput" class="input" type="search" placeholder="Search..." style="min-width: 180px;">
      </div>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Period</th>
          <th>Employee</th>
          <th>Department</th>
          <th>Assigned</th>
          <th>Completed</th>
          <th>Overall</th>
          <th>Supervisor</th>
          <th>Management</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="monthTableBody"><tr><td colspan="9" class="empty-state">Loading...</td></tr></tbody>
    </table>
  </div>
  <div id="monthPagination" class="pagination"></div>
</section>
<script>
  (function () {
    var state = { items: [], page: 1, pages: 1, pageSize: 25 };
    function monthParts() {
      var value = document.getElementById('monthInput').value || '';
      var parts = value.split('-');
      return { year: parts[0] || '', month: parts[1] || '' };
    }
    function filters() {
      var period = monthParts();
      return {
        year: period.year,
        month: period.month,
        department: document.getElementById('monthDepartmentFilter').value.trim(),
        supervisor: document.getElementById('monthSupervisorFilter').value.trim(),
        query: document.getElementById('monthSearchInput').value.trim(),
        page: state.page,
        pageSize: state.pageSize
      };
    }
    function load() {
      KSL.call('listMonthlyProgress', KSL.getSessionToken(), filters()).then(function (response) {
        if (!response || !response.success) throw new Error((response && response.message) || 'Failed to load monthly progress.');
        var payload = response.data || {};
        state.items = payload.items || [];
        state.page = Number((payload.pagination || {}).page || 1);
        state.pages = Number((payload.pagination || {}).pages || 1);
        var body = document.getElementById('monthTableBody');
        if (!state.items.length) {
          body.innerHTML = '<tr><td colspan="9" class="empty-state">No matching data found.</td></tr>';
        } else {
          body.innerHTML = state.items.map(function (item) {
            return '<tr><td>' + KSL.escapeHtml(item.monthName + ' ' + item.year) + '</td><td>' +
              KSL.escapeHtml(item.employeeName) + '</td><td>' + KSL.escapeHtml(item.department || '-') +
              '</td><td>' + item.assigned + '</td><td>' + item.completed + '</td><td>' + item.overall +
              '</td><td>' + KSL.escapeHtml(item.supervisorComments || '-') +
              '</td><td>' + KSL.escapeHtml(item.managementComments || '-') +
              '</td><td><button class="btn btn-outline" type="button" data-id="' + KSL.escapeHtml(item.recordId) +
              '">Review</button></td></tr>';
          }).join('');
        }
        KSL.renderPager('monthPagination', state, load);
      }).catch(function (error) { KSL.showToast(error.message || 'Failed to load monthly progress.', 'error'); });
    }
    function exportFile(format) {
      var options = filters();
      options.format = format;
      KSL.callBusy('exportMonthlyProgress', KSL.getSessionToken(), options).then(function (response) {
        if (!response || !response.success) throw new Error((response && response.message) || 'Export failed.');
        KSL.downloadFile(response.data);
        KSL.showToast('Report generated.', 'success');
      }).catch(function (error) { KSL.showToast(error.message || 'Export failed.', 'error'); });
    }
    document.addEventListener('DOMContentLoaded', function () {
      KSL.requireAuth(['Administrator', 'Manager', 'Supervisor'], function () {
        var now = new Date();
        document.getElementById('monthInput').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('generateMonthButton').addEventListener('click', function () {
          var period = monthParts();
          KSL.callBusy('generateMonthlyProgress', KSL.getSessionToken(), period)
            .then(function (response) {
              if (!response || !response.success) throw new Error((response && response.message) || 'Generate failed.');
              KSL.showToast(response.message || 'Monthly progress generated.', 'success');
              load();
            }).catch(function (error) { KSL.showToast(error.message || 'Generate failed.', 'error'); });
        });
        document.getElementById('exportMonthButton').addEventListener('click', function () { exportFile('csv'); });
        document.getElementById('exportMonthPdfButton').addEventListener('click', function () { exportFile('pdf'); });
        document.getElementById('refreshMonthButton').addEventListener('click', load);
        ['monthInput', 'monthDepartmentFilter', 'monthSupervisorFilter', 'monthSearchInput'].forEach(function (id) {
          document.getElementById(id).addEventListener(id === 'monthInput' ? 'change' : 'input', KSL.debounce(function () {
            state.page = 1;
            load();
          }, 350));
        });
        document.getElementById('monthTableBody').addEventListener('click', function (event) {
          var button = event.target.closest('button[data-id]');
          if (!button) return;
          var supervisorComments = window.prompt('Supervisor comments:', '') || '';
          var managementComments = window.prompt('Management comments (managers/admins):', '') || '';
          KSL.call('reviewMonthlyProgress', KSL.getSessionToken(), {
            recordId: button.dataset.id,
            supervisorComments: supervisorComments,
            managementComments: managementComments
          }).then(function (response) {
            if (!response || !response.success) throw new Error((response && response.message) || 'Review failed.');
            KSL.showToast('Review saved.', 'success');
            load();
          }).catch(function (error) { KSL.showToast(error.message || 'Review failed.', 'error'); });
        });
        load();
      });
    });
  })();
</script>
